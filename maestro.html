<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel del docente · HCM y EFA</title>
<link rel="apple-touch-icon" href="maestro-icon-180.png">
<link rel="icon" type="image/png" href="maestro-icon-192.png">
<meta name="apple-mobile-web-app-title" content="Panel docente">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..800&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
  :root{
    --papel:#F0EADB; --tarjeta:#FBF7EC; --papel-2:#E5DDC8;
    --tinta:#17120B; --tinta-2:#463C2D; --tenue:#8A7C66; --linea:#D9CFB6;
    --oro:#8F7320; --oro-h:#6E5716; --oro-luz:#C9A84C; --oro-s:#F7F0DA;
    --negro:#1A150E; --rojo:#9B2C2C; --verde:#2F6B33;
    --display:'Fraunces',Georgia,serif;
    --cuerpo:'DM Sans',system-ui,-apple-system,sans-serif;
    --mono:'DM Mono',ui-monospace,Menlo,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--papel);color:var(--tinta);font-family:var(--cuerpo);
       -webkit-font-smoothing:antialiased;font-size:15px;line-height:1.5}
  a{color:var(--oro-h)}

  /* ── cabecera ── */
  header{position:sticky;top:0;z-index:20;background:var(--negro);color:#F5E9C9;
         border-bottom:2px solid var(--oro-luz)}
  .cab{max-width:1080px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:14px}
  .cab .esc{width:30px;height:30px;flex:none}
  .cab h1{font-family:var(--display);font-size:17px;margin:0;font-weight:700;letter-spacing:-.01em}
  .cab .sub{font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;
            color:var(--oro-luz);display:block;margin-bottom:1px}
  .cab .sp{flex:1}
  .salir{background:none;border:1.5px solid rgba(201,168,76,.5);color:#F5E9C9;border-radius:18px;
         padding:6px 14px;font:inherit;font-size:13px;cursor:pointer}
  .salir:hover{background:rgba(201,168,76,.18)}

  nav.tabs{background:var(--negro);border-bottom:1px solid rgba(201,168,76,.28)}
  nav.tabs .in{max-width:1080px;margin:0 auto;padding:0 18px;display:flex;gap:2px}
  nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;color:#C8BBA4;
    font:inherit;font-weight:600;padding:11px 16px;cursor:pointer;font-size:14px}
  nav.tabs button.on{color:#F5E9C9;border-bottom-color:var(--oro-luz)}

  main{max-width:1080px;margin:0 auto;padding:22px 18px 70px}

  /* ── selector de escuela ── */
  .escuelas{background:#0F0C07;border-bottom:1px solid rgba(201,168,76,.28)}
  .escuelas .in{max-width:1080px;margin:0 auto;padding:8px 18px;display:flex;gap:8px;flex-wrap:wrap}
  .escuelas button{font:inherit;font-size:13px;font-weight:600;cursor:pointer;border-radius:20px;
    padding:7px 15px;background:transparent;color:#C8BBA4;border:1.5px solid rgba(201,168,76,.35)}
  .escuelas button.on{background:var(--oro-luz);color:var(--negro);border-color:var(--oro-luz)}
  .efa-barra{max-width:1080px;margin:0 auto;padding:10px 18px;display:flex;gap:12px;align-items:center;
    flex-wrap:wrap;font-size:13px;color:var(--tinta-2)}
  .efa-marco{display:block;width:100%;border:0;background:#fff;height:calc(100vh - 170px);min-height:520px}

  /* ── entrada ── */
  .entrada{max-width:380px;margin:12vh auto;text-align:center}
  .entrada .esc{width:58px;height:58px;margin-bottom:18px}
  .entrada h2{font-family:var(--display);font-size:26px;margin:0 0 6px}
  .entrada p{color:var(--tinta-2);margin:0 0 22px;font-size:14px}
  .campo{display:flex;gap:8px}
  input,select,textarea{font:inherit;color:var(--tinta);background:var(--tarjeta);
    border:1.5px solid var(--linea);border-radius:10px;padding:11px 13px}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--oro)}
  .bt{background:var(--negro);color:#F5E9C9;border:0;border-radius:10px;padding:11px 20px;
      font:inherit;font-weight:600;cursor:pointer}
  .bt:hover{background:#2a2216}
  .bt.claro{background:var(--tarjeta);color:var(--tinta);border:1.5px solid var(--linea);font-weight:500}
  .bt.claro:hover{background:var(--oro-s);border-color:var(--oro)}
  .err{color:var(--rojo);font-size:14px;margin-top:12px}

  /* ── lista de lecciones ── */
  .filtro{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
  .filtro label{font-size:13px;color:var(--tinta-2)}
  .rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
  .lec{background:var(--tarjeta);border:1.5px solid var(--linea);border-radius:13px;padding:14px 16px;
       cursor:pointer;text-align:left;font:inherit;color:inherit;display:flex;gap:13px;align-items:flex-start}
  .lec:hover{border-color:var(--oro);background:var(--oro-s)}
  .lec .n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--negro);color:var(--oro-luz);
          font-family:var(--mono);font-size:13px;display:flex;align-items:center;justify-content:center}
  .lec.ex .n{background:var(--oro);color:#fff}
  .lec .t{font-weight:600;font-size:15px;margin-bottom:2px}
  .lec .s{font-size:13px;color:var(--tinta-2)}
  .lec .f{font-family:var(--mono);font-size:11px;color:var(--tenue);margin-top:5px}

  /* ── detalle de leccion ── */
  .volver{background:none;border:0;font:inherit;color:var(--oro-h);cursor:pointer;padding:0;
          margin-bottom:14px;font-size:14px}
  .tit{font-family:var(--display);font-size:25px;margin:0 0 4px;line-height:1.2}
  .tit-s{color:var(--tinta-2);margin:0 0 6px}
  .meta{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
        color:var(--oro);margin-bottom:18px}
  .acciones{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:22px}

  .item{background:var(--tarjeta);border:1.5px solid var(--linea);border-radius:13px;
        padding:15px 17px;margin-bottom:11px;position:relative}
  .item.regla{background:var(--negro);color:#F0EADB;border-color:var(--oro)}
  .item.regla .tipo{background:var(--oro);color:#fff;border-color:var(--oro)}
  .item.regla b{color:var(--oro-luz)}
  .item .tipo{position:absolute;right:13px;top:13px;font-family:var(--mono);font-size:10px;
    letter-spacing:.1em;text-transform:uppercase;background:var(--papel-2);color:var(--tinta-2);
    border:1px solid var(--linea);border-radius:20px;padding:3px 9px}
  .item h4{margin:0 0 9px;font-size:16px;padding-right:96px}
  .item p{margin:0 0 8px}
  .item .en{font-family:var(--display);font-size:16px}
  .item .es{color:var(--tinta-2);font-size:14px}
  .ops{list-style:none;margin:9px 0 0;padding:0}
  .ops li{padding:7px 11px;border-radius:8px;margin-bottom:5px;background:var(--papel);
          border:1.5px solid var(--linea);font-size:14px}
  .ops li.bien{border-color:#4F7942;background:#EDF4EA;font-weight:600}
  .ops li.bien::after{content:' ✓ correcta';font-family:var(--mono);font-size:10px;color:#3D6134;
                      letter-spacing:.08em}
  .carriles{display:flex;gap:5px;margin-top:11px}
  .cchip{font-family:var(--mono);font-size:10px;letter-spacing:.06em;border-radius:20px;
         padding:2px 8px;border:1px solid var(--linea);color:var(--tenue)}
  .cchip.si{background:var(--oro-s);border-color:var(--oro);color:var(--oro-h)}
  .solo-alto{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
             color:var(--rojo);margin-top:9px}
  .bien-mal{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:11px 0}
  .bien-mal div{border-radius:9px;padding:10px 12px;font-family:var(--display);font-size:14px}
  .bien-mal .si{background:rgba(237,244,234,.14);border:1.5px solid #6D9160}
  .bien-mal .no{background:rgba(155,44,44,.14);border:1.5px solid #B4564F;text-decoration:line-through;
                opacity:.8}

  /* ── grupos ── */
  .resumen{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:11px;margin-bottom:22px}
  .caja{background:var(--tarjeta);border:1.5px solid var(--linea);border-radius:12px;padding:13px 15px}
  .caja .k{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;
           color:var(--oro);margin-bottom:5px}
  .caja .v{font-family:var(--display);font-size:25px;line-height:1}
  h3.grupo{font-family:var(--mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;
           color:var(--oro-h);margin:26px 0 9px;border-bottom:1px solid var(--linea);padding-bottom:6px}
  table{width:100%;border-collapse:collapse;background:var(--tarjeta);border-radius:12px;overflow:hidden;
        border:1.5px solid var(--linea);font-size:14px}
  th{background:var(--papel-2);text-align:left;padding:9px 11px;font-size:11px;font-family:var(--mono);
     letter-spacing:.1em;text-transform:uppercase;color:var(--tinta-2);cursor:pointer;white-space:nowrap}
  th:hover{color:var(--oro-h)}
  td{padding:9px 11px;border-top:1px solid var(--linea)}
  td.num{font-family:var(--mono);text-align:right}
  tr:hover td{background:var(--oro-s)}
  .car{font-family:var(--mono);font-size:11px;border-radius:20px;padding:2px 8px;border:1px solid}
  .car.bajo{color:#8A6D00;border-color:#D9B84C;background:#FBF3D9}
  .car.medio{color:#8F5A20;border-color:#D9A04C;background:#FBEBD9}
  .car.alto{color:#8B2B2B;border-color:#C96A6A;background:#FBE0E0}
  .vacio{color:var(--tenue);font-size:14px;padding:18px 0}
  .gchips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
  .gchip{font:inherit;font-weight:700;font-size:15px;border-radius:12px;padding:9px 14px;cursor:pointer;
    background:var(--tarjeta);border:1.5px solid var(--linea);color:var(--tinta);display:flex;gap:8px;align-items:center}
  .gchip span{font-family:var(--mono);font-size:11px;font-weight:500;background:var(--papel-2);border-radius:20px;padding:1px 7px}
  .gchip.on{background:var(--negro);color:#F5E9C9;border-color:var(--negro)}
  .gchip.on span{background:var(--oro-luz);color:var(--negro)}
  tr.fila{cursor:pointer} tr.fila:hover td{background:var(--oro-s)}
  .cst{font-family:var(--mono);font-size:11px;border-radius:20px;padding:2px 7px;background:var(--negro);color:var(--oro-luz);white-space:nowrap}
  .cst.mala{background:var(--rojo);color:#fff}
  .ficha{background:var(--tarjeta);border:1.5px solid var(--oro);border-radius:14px;padding:18px;margin-top:22px}
  .ficha h4{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--oro);margin:18px 0 8px}
  .cstf{border:1.5px solid var(--oro);border-radius:10px;padding:10px 12px;margin-bottom:8px;display:flex;flex-direction:column;gap:2px}
  .cstf span{font-family:var(--mono);font-size:12px;color:var(--tinta-2)} .cstf em{font-style:normal;font-size:12px;color:var(--verde);font-weight:600}
  .cstf.mala{border-color:var(--rojo)} .cstf.mala em{color:var(--rojo)}
  .lchip{display:inline-block;font-family:var(--mono);font-size:11px;border-radius:20px;padding:2px 8px;margin:2px;border:1px solid var(--linea)}
  .lchip.lB{background:#FBF3D9} .lchip.lI{background:#FBEBD9} .lchip.lA{background:#FBE0E0}
  .nota{background:var(--oro-s);border:1.5px solid var(--oro);border-radius:12px;padding:13px 16px;
        font-size:14px;margin-bottom:20px}
  .nota b{color:var(--oro-h)}

  @media print{
    header,nav.tabs,.acciones,.volver,.filtro{display:none!important}
    body{background:#fff}
    .item{break-inside:avoid;border-color:#bbb}
    .item.regla{background:#fff;color:#000;border:2px solid #000}
    .item.regla b{color:#000}
  }
  @media (max-width:560px){
    .bien-mal{grid-template-columns:1fr}
    .cab h1{font-size:15px}
    table{font-size:13px}
    td,th{padding:7px 8px}
  }
</style>
</head>

<script>
(function(){
"use strict";

var CLAVE   = 'hcm2026';               // la misma del panel
var KEY_LS  = 'hcm_maestro_v1';
// De aquí se lee el material, para que nunca se desfase de la app.
// Primero se intenta el index.html de al lado (cuando el panel vive junto a
// la app); si no está —por ejemplo si se abre suelto— se cae a la copia

try{ escuela = localStorage.getItem('maestro_escuela') === 'efa' ? 'efa' : 'hcm'; }catch(e){}

var ESCUDO = '<svg class="esc" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">'+

function esc(t){
  return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ── leer el material del index.html: una sola fuente de verdad ── */
function recorte(txt, marca, abre, cierra){
  var a = txt.indexOf(marca);
  if(a < 0) return null;
  var i = txt.indexOf(abre, a);
  if(i < 0) return null;
  var prof = 0, j = i;
  while(j < txt.length){
    var c = txt[j];
    if(c === '"' || c === "'"){                 // saltar cadenas
      var q = c; j++;
      while(j < txt.length && (txt[j] !== q || txt[j-1] === '\\')) j++;
    }
    else if(c === abre) prof++;
    else if(c === cierra){ prof--; if(prof === 0) return txt.slice(i, j+1); }
    j++;
  }
  return null;
}
function evaluar(src){
  try{ return (new Function('return (' + src + ');'))(); }
  catch(e){ return null; }
}
function traerApp(i){
  i = i || 0;
  if(i >= APP_URLS.length) return Promise.reject(new Error('no pude leer el archivo de la app'));
  return fetch(APP_URLS[i], {cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error('http ' + r.status); return r.text(); })
    .catch(function(){ return traerApp(i + 1); });
}
function cargarMaterial(){
  return traerApp(0).then(function(t){
    LEC  = evaluar(recorte(t, 'var LECCIONES_HCM',  '[', ']'));
    MAT  = evaluar(recorte(t, 'MATERIAL_HCM',       '{', '}'));
    CARR = evaluar(recorte(t, 'var CARRILES_HCM',   '{', '}'));
    var mp = t.match(/var\s+PARADAS_HCM\s*=\s*(\d+)/);
    if(mp) PARADAS = +mp[1];
    var me = t.match(/var\s+EXAMENES_HCM\s*=\s*(\[[^\]]*\])/);
    if(me) EXAM = evaluar(me[1]) || [];
    var md = t.match(/var\s+HCM_DATOS_ENDPOINT\s*=\s*'([^']+)'/);
    if(md) DATOS = md[1];
    if(!LEC || !MAT || !CARR) throw new Error('la app cambió de forma y no pude leer su material');
    return true;
  }).catch(function(e){
    // Último respaldo: la copia guardada aquí. Se avisa, para que no se
    // confunda con el material en vivo.
    var S = window.__HCM_SNAP;
    if(!S) throw e;
    LEC = S.LEC; MAT = S.MAT; CARR = S.CARR; PARADAS = S.PARADAS || 19;
    EXAM = [9,18,19];
    esCopia = true;
    return true;
  });
}

/* ── grupos ── */
function pintarGrupos(c){
  if(!DATOS){
    c.innerHTML = '<p class="nota">La app no tiene todavía la liga del servidor de datos, ' +
      'así que no puedo traer el avance de los cadetes.</p>';
    return;
  }
  var GRUPOS6 = ['301','302','303','304','305','306'];
  var NIV = {bajo:'Básico', medio:'Intermedio', alto:'Avanzado'};
  var PAR = {P1:'Primer parcial', P2:'Segundo parcial', CF:'Curso completo'};
  function pase(){
    try{
      var p = JSON.parse(sessionStorage.getItem('hcm_pase') || 'null');
      if(p && p.v && p.hasta > Date.now()) return p.v;
    }catch(e){}
    return '';
  }
  function guardaPase(v){ try{ sessionStorage.setItem('hcm_pase', JSON.stringify({v:v, hasta:Date.now() + 11 * 3600e3})); }catch(e){} }
  function tiraPase(){ try{ sessionStorage.removeItem('hcm_pase'); }catch(e){} }
  function pedir(cuerpo){
    return fetch(DATOS, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(cuerpo)})
      .then(function(r){ return r.ok ? r.json() : null; });
  }
  function normNom(s){
    return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
  }
  // la misma cuenta que hace la app del cadete al dar la constancia
  function folioDe(nombre, grupo, p, niv, fecha){
    var s = normNom(nombre) + '|' + grupo + '|' + p + '|' + niv + '|' + fecha, h = 0x811c9dc5;
    for(var i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
    return 'HCM-' + p + '-' + niv.charAt(0).toUpperCase() + '-' + ('000000' + h.toString(36).toUpperCase()).slice(-6);
  }
  function leerConstancias(txt, nombre, grupo){
    var inv = {'Básico':'bajo', 'Intermedio':'medio', 'Avanzado':'alto'};
    return String(txt || '').split('|').map(function(t){ return t.trim(); }).filter(Boolean).map(function(t){
      var m = t.match(/^(P1|P2|CF)\s+(Básico|Intermedio|Avanzado)\s+(HCM-\S+)\s+(\d{4}-\d{2}-\d{2})$/);
      if(!m) return {crudo:t};
      var niv = inv[m[2]];
      return {p:m[1], niv:niv, folio:m[3], fecha:m[4], valida: folioDe(nombre, grupo, m[1], niv, m[4]) === m[3]};
    });
  }

  // 1) sin pase: se pide la clave del servidor de calificaciones
  if(!pase()){
    c.innerHTML = '<div class="entrada" style="margin:4vh auto">' +
      '<h2>Avance de los cadetes</h2>' +
      '<p>Esta parte lee la hoja de calificaciones, así que pide la clave del servidor ' +
      '(la de <b>Propiedades del script → CLAVE_MAESTRO</b>). No es la misma que la de este panel.</p>' +
      '<div class="campo"><input type="password" id="clsrv" placeholder="Clave del servidor" style="flex:1" autocomplete="current-password">' +
      '<button class="bt" id="oksrv">Entrar</button></div>' +
      (panelError ? '<p class="err">' + esc(panelError) + '</p>' : '') + '</div>';
    var inp = document.getElementById('clsrv');
    function probar(){
      var v = inp.value.trim(); if(!v) return;
      document.getElementById('oksrv').textContent = 'Revisando…';
      pedir({accion:'entrar', clave:v}).then(function(d){
        if(d && d.ok && d.pase){ guardaPase(d.pase); panelError = ''; panel = null; pintar(); }
        else { panelError = (d && d.mensaje) || 'Esa no es la clave.'; pintar(); }
      }).catch(function(){ panelError = 'Sin conexión con el servidor.'; pintar(); });
    }
    document.getElementById('oksrv').onclick = probar;
    inp.onkeydown = function(e){ if(e.key === 'Enter') probar(); };
    return;
  }

  // 2) con pase: se trae el avance
  if(panel === null && !panelError){
    c.innerHTML = '<p class="vacio">Trayendo el avance de los seis grupos…</p>';
    pedir({accion:'panel_maestro', pase:pase()}).then(function(d){
      if(d && d.ok){ panel = d; }
      else if(d && (d.error === 'sin_permiso')){ tiraPase(); panelError = 'El pase venció. Vuelve a poner la clave.'; }
      else panelError = (d && (d.mensaje || d.error)) || 'El servidor no contestó bien.';
      pintar();
    }).catch(function(){ panelError = 'Sin conexión con el servidor de datos.'; pintar(); });
    return;
  }
  if(panelError){
    c.innerHTML = '<p class="nota"><b>No pude traer los datos.</b> ' + esc(panelError) + '</p>' +
      '<button class="bt claro" id="reintentar">Reintentar</button>';
    document.getElementById('reintentar').onclick = function(){ panelError = ''; panel = null; pintar(); };
    return;
  }

  // el servidor viejo mandaba [{grupo,cadetes}]; el nuevo manda {grupos, cadetes}
  var todos = [];
  if(Array.isArray(panel)) panel.forEach(function(g){ (g.cadetes || []).forEach(function(x){ x.grupo = x.grupo || g.grupo; todos.push(x); }); });
  else (panel.cadetes || []).forEach(function(x){ todos.push(x); });
  var porGrupo = {};
  GRUPOS6.forEach(function(g){ porGrupo[g] = []; });
  todos.forEach(function(x){ var g = String(x.grupo || ''); (porGrupo[g] = porGrupo[g] || []).push(x); });
  var gruposVisibles = Object.keys(porGrupo).filter(function(g){ return GRUPOS6.indexOf(g) >= 0 || porGrupo[g].length; }).sort();
  if(!window.__grupoSel || !porGrupo[window.__grupoSel]) window.__grupoSel = gruposVisibles.filter(function(g){ return porGrupo[g].length; })[0] || '301';
  var sel = window.__grupoSel;

  var html = '<div class="gchips">' + gruposVisibles.map(function(g){
      return '<button class="gchip' + (g === sel ? ' on' : '') + '" data-g="' + esc(g) + '">' + esc(g) +
        '<span>' + porGrupo[g].length + '</span></button>';
    }).join('') + '<button class="gchip todos' + (sel === '*' ? ' on' : '') + '" data-g="*">Todos<span>' + todos.length + '</span></button></div>' +
    '<div id="gcuerpo"></div>';
  c.innerHTML = html;
  c.querySelectorAll('.gchip').forEach(function(b){ b.onclick = function(){ window.__grupoSel = b.dataset.g; pintar(); }; });
  var lista = sel === '*' ? todos.slice() : (porGrupo[sel] || []).slice();
  var cu = document.getElementById('gcuerpo');
  if(!lista.length){
    cu.innerHTML = '<p class="vacio">Nadie del grupo ' + esc(sel) + ' ha cerrado su primera lección todavía.</p>';
    return;
  }
  var min = 0, ses = 0, part = 0, niv = {bajo:0, medio:0, alto:0};
  lista.forEach(function(x){ min += (+x.minutos || 0); ses += (+x.sesiones || 0); part += (+x.particip || 0); niv[x.carril || 'medio'] = (niv[x.carril || 'medio'] || 0) + 1; });
  cu.innerHTML = '<div class="resumen">' +
      cajaR('Cadetes', lista.length) + cajaR('Minutos', min) + cajaR('Sesiones', ses) +
      cajaR('Participación', Math.round(part / lista.length) + '%') +
      cajaR('Niveles', 'B ' + niv.bajo + ' · I ' + niv.medio + ' · A ' + niv.alto) + '</div>' +
    '<div class="filtro"><input id="busca" placeholder="Buscar cadete por nombre" style="flex:1;max-width:320px">' +
      '<button class="bt claro" id="cargaconst">Ver constancias del grupo</button>' +
      '<button class="bt claro" id="imprimir2">Imprimir</button></div><div id="tablas"></div><div id="ficha"></div>';
  document.getElementById('imprimir2').onclick = function(){ window.print(); };
  var bus = document.getElementById('busca');
  bus.oninput = function(){ tabla(bus.value); };
  var CONST = window.__constCache || (window.__constCache = {});
  document.getElementById('cargaconst').onclick = function(){
    var bt = this, i = 0;
    (function sig(){
      if(i >= lista.length){ bt.textContent = 'Constancias al día'; tabla(bus.value); return; }
      var x = lista[i++];
      bt.textContent = 'Leyendo ' + i + ' de ' + lista.length + '…';
      pedir({accion:'detalle_cadete', pase:pase(), nombre:x.nombre}).then(function(d){
        if(d && d.ok) CONST[normNom(x.nombre)] = d;
        tabla(bus.value); sig();
      }).catch(sig);
    })();
  };
  tabla('');

  function tabla(q){
    q = normNom(q);
    var cs = lista.filter(function(x){ return !q || normNom(x.nombre).indexOf(q) >= 0; });
    cs.sort(function(a, b){
      if(ordenCol){
        var va = a[ordenCol], vb = b[ordenCol];
        if(typeof va === 'string' || typeof vb === 'string'){
          va = String(va || '').toLowerCase(); vb = String(vb || '').toLowerCase();
          return ordenAsc ? (va < vb ? -1 : va > vb ? 1 : 0) : (va > vb ? -1 : va < vb ? 1 : 0);
        }
        return ordenAsc ? (va || 0) - (vb || 0) : (vb || 0) - (va || 0);
      }
      return String(a.grupo).localeCompare(String(b.grupo)) || normNom(a.nombre).localeCompare(normNom(b.nombre));
    });
    document.getElementById('tablas').innerHTML = cs.length ? '<table><thead><tr>' +
      (sel === '*' ? th('grupo', 'Grupo') : '') + th('nombre', 'Cadete') + th('carril', 'Nivel') + th('leccion', 'Lección') +
      th('minutos', 'Min') + th('sesiones', 'Ses') + th('particip', 'Part.') + '<th>Constancias</th>' + th('ultima', 'Última') +
      '</tr></thead><tbody>' + cs.map(function(x){
        var cr = x.carril || 'medio', det = CONST[normNom(x.nombre)];
        var cons = det && det.perfil ? leerConstancias(det.perfil.constancias, x.nombre, x.grupo) : null;
        var nom = (LEC[+x.leccion] || {}).titulo || '';
        return '<tr class="fila" data-n="' + esc(x.nombre) + '">' + (sel === '*' ? '<td>' + esc(x.grupo) + '</td>' : '') +
          '<td><b>' + esc(x.nombre) + '</b></td>' +
          '<td><span class="car ' + esc(cr) + '">' + esc(NIV[cr] || cr) + '</span></td>' +
          '<td>' + esc(x.leccion) + (nom ? ' · <span class="es">' + esc(nom) + '</span>' : '') + '</td>' +
          '<td class="num">' + esc(x.minutos) + '</td><td class="num">' + esc(x.sesiones) + '</td>' +
          '<td class="num">' + esc(x.particip) + '%</td>' +
          '<td>' + (cons === null ? '<span class="es">—</span>' : (cons.length ? cons.map(function(k){
              return k.p ? '<span class="cst' + (k.valida ? '' : ' mala') + '" title="' + esc(k.folio) + '">' + k.p + ' ' + esc((NIV[k.niv] || '').charAt(0)) + '</span>' : '';
            }).join(' ') : '<span class="es">ninguna</span>')) + '</td>' +
          '<td class="es">' + esc(x.ultima) + '</td></tr>';
      }).join('') + '</tbody></table>' : '<p class="vacio">Ningún cadete con ese nombre.</p>';
    document.querySelectorAll('#tablas th[data-c]').forEach(function(h){
      h.onclick = function(){
        var col = h.dataset.c;
        if(ordenCol === col) ordenAsc = !ordenAsc; else { ordenCol = col; ordenAsc = true; }
        tabla(bus.value);
      };
    });
    document.querySelectorAll('#tablas tr.fila').forEach(function(tr){
      tr.onclick = function(){ ficha(lista.filter(function(x){ return x.nombre === tr.dataset.n; })[0]); };
    });
  }
  function ficha(x){
    if(!x) return;
    var f = document.getElementById('ficha');
    f.innerHTML = '<div class="ficha"><p class="vacio">Leyendo la ficha de ' + esc(x.nombre) + '…</p></div>';
    f.scrollIntoView({behavior:'smooth', block:'start'});
    pedir({accion:'detalle_cadete', pase:pase(), nombre:x.nombre}).then(function(d){
      if(!d || !d.ok){ f.innerHTML = '<p class="nota">No pude leer la ficha. ' + esc((d && d.error) || '') + '</p>'; return; }
      CONST[normNom(x.nombre)] = d;
      var pf = d.perfil || {}, cons = leerConstancias(pf.constancias, x.nombre, x.grupo);
      var hechas = String(pf.lecciones_hechas || '').trim();
      var h = '<div class="ficha"><button class="bt claro" id="cfcerrar" style="float:right">Cerrar</button>' +
        '<h3 class="tit" style="font-size:21px">' + esc(x.nombre) + '</h3>' +
        '<p class="meta">Grupo ' + esc(x.grupo) + ' · ' + esc(NIV[x.carril] || x.carril || '') + ' · ' + esc(x.minutos) + ' min · ' + esc(x.sesiones) + ' sesiones</p>' +
        '<h4>Constancias</h4>' + (cons.length ? cons.map(function(k){
          if(!k.p) return '<div class="cstf mala">' + esc(k.crudo) + '</div>';
          return '<div class="cstf' + (k.valida ? '' : ' mala') + '"><b>' + esc(PAR[k.p] || k.p) + ' · ' + esc(NIV[k.niv] || k.niv) + '</b>' +
            '<span>' + esc(k.fecha) + ' · folio ' + esc(k.folio) + '</span><em>' + (k.valida ? '✓ Folio verificado' : '✗ El folio no coincide') + '</em></div>';
        }).join('') : '<p class="vacio">Todavía no gana ninguna. Se ganan terminando todas las lecciones de un parcial.</p>') +
        '<h4>Lecciones terminadas</h4><p>' + (hechas ? esc(hechas).replace(/(\d+)([BIA])/g, '<span class="lchip l$2">$1 $2</span>') : '<span class="es">—</span>') + '</p>' +
        '<p class="es" style="font-size:12px">B = Básico · I = Intermedio · A = Avanzado (el nivel más alto con el que la terminó)</p>' +
        '<h4>Sesiones</h4>' + ((d.sesiones || []).length ? '<table><thead><tr><th>Fecha</th><th>Lección</th><th>Min</th><th>Frases</th><th>Parecido</th></tr></thead><tbody>' +
          d.sesiones.slice().reverse().map(function(s){
            return '<tr><td>' + esc(s.fecha) + ' ' + esc(s.hora || '') + '</td><td>' + esc(s.titulo || s.leccion || '') + '</td>' +
              '<td class="num">' + esc(s.segundos) + '</td><td class="num">' + esc(s.frases || '') + '</td><td class="num">' + (s.promedio === null || s.promedio === undefined ? '—' : esc(s.promedio) + '%') + '</td></tr>';
          }).join('') + '</tbody></table>' : '<p class="vacio">Sin sesiones registradas.</p>') + '</div>';
      f.innerHTML = h;
      document.getElementById('cfcerrar').onclick = function(){ f.innerHTML = ''; };
      tabla(bus.value);
    }).catch(function(){ f.innerHTML = '<p class="nota">Sin conexión con el servidor.</p>'; });
  }
  function th(col, et){
    var fl = ordenCol === col ? (ordenAsc ? ' ↑' : ' ↓') : '';
    return '<th data-c="' + col + '">' + et + fl + '</th>';
  }
  function cajaR(k, v){ return '<div class="caja"><div class="k">' + k + '</div><div class="v">' + v + '</div></div>'; }
}

/* ── cómo se usa ── */
function pintarAyuda(c){
  c.innerHTML =
    '<h2 class="tit">Cómo se usa</h2>' +
    '<p class="tit-s">Lo que hace cada pestaña, y lo que falta del lado del servidor.</p>' +
    '<div class="item"><h4>Lecciones</h4>' +
    '<p>Las 19 paradas del curso. Entra a la que quieras, en cualquier orden: aquí ves el material ' +
    'completo con <b>las respuestas correctas marcadas</b>, el texto de los audios y la pista de cada ' +
    'ejercicio hablado.</p>' +
    '<p>El selector <i>Ver como</i> te muestra exactamente qué ejercicios le tocan a cada carril. ' +
    'Los marcados en rojo son los del ALC 11-12 y solo los ve el carril avanzado.</p>' +
    '<p><b>Imprimir esta lección</b> saca una versión limpia en papel, sin menús, para llevarla al salón.</p></div>' +
    '<div class="item"><h4>Grupos</h4>' +
    '<p>El avance de los seis grupos, del 301 al 306: en qué lección va cada cadete, su carril, ' +
    'sus minutos, sus sesiones y su porcentaje de participación. Se puede ordenar por cualquier ' +
    'columna y buscar por nombre.</p></div>' +
    '<div class="item"><h4>El material sale de la app, no de aquí</h4>' +
    '<p>Este panel lee las lecciones directamente del archivo de la app del cadete. Si mañana ' +
    'cambias un ejercicio allá, aquí aparece cambiado sin que haya que tocar nada. No hay dos copias ' +
    'que se puedan desfasar.</p></div>' +
    '<div class="item"><h4>Para dejar correcciones a un cadete</h4>' +
    '<p>Eso se escribe directo en la hoja de cálculo, en la pestaña <b>Correcciones</b>: el nombre del ' +
    'cadete, el tipo (corrección, mensaje, tarea o bonus), la frase y tu mensaje. La app se lo entrega ' +
    'la próxima vez que entre y marca la fila como entregada.</p></div>' +
    '<div class="item"><h4>Lo que falta del lado del servidor</h4>' +
    '<p>El servidor de datos todavía tiene la lista de grupos de primer año. Hay que abrir el Apps ' +
    'Script <b>HCM-Datos</b>, dejar <span class="es">GRUPOS = [\'301\',\'302\',\'303\',\'304\',\'305\',\'306\']</span>, ' +
    'cambiar los dos <span class="es">\'101\'</span> de respaldo por <span class="es">\'301\'</span>, ' +
    'correr <b>crearHojas</b> y publicar una versión nueva. Hasta entonces la pestaña de Grupos ' +
    'no va a traer nada.</p></div>';
}

/* ── arranque ── */
function arrancar(){
  if(escuela === 'efa'){
    // EFA no necesita leer el material del Colegio: se abre de una vez.
    pintar();
    cargarMaterial().catch(function(){});
    return;
  }
  RAIZ.innerHTML = '<div class="entrada">' + ESCUDO + '<h2>Un momento</h2>' +
    '<p>Leyendo las lecciones de la app…</p></div>';
  cargarMaterial().then(function(){ pintar(); })
    .catch(function(e){
      RAIZ.innerHTML = '<div class="entrada">' + ESCUDO + '<h2>No pude leer la app</h2>' +
        '<p>' + esc(e.message) + '</p><p class="es">Este panel tiene que estar en la misma carpeta ' +
        'que <b>index.html</b>, o la app tiene que estar publicada en GitHub Pages.</p></div>';
    });
}

var entrado = false;
try{ entrado = localStorage.getItem(KEY_LS) === '1'; }catch(e){}
entrado ? arrancar() : pintarEntrada();
})();
</script>
<!-- AVISO_VERSION_NUEVA: avisa cuando hay una versión publicada más nueva que la que está abierta -->
<script>
(function(){
  try{ if(window.top!==window.self) return; }catch(e){ return; }
  var PREFIJO_CACHE = '';           // cajas propias de esta app que se pueden tirar
  var CLAVE = 'aviso_ver_' + location.pathname;
  var ultima = 0, mostrado = false;
  function tamLocal(){
    try{ var n = performance.getEntriesByType('navigation')[0]; return n && n.decodedBodySize ? n.decodedBodySize : 0; }catch(e){ return 0; }
  }
  function tamServidor(r){
    var et = r.headers.get('etag') || '';
    var m = et.match(/-([0-9a-f]+)"?$/i);
    return m ? parseInt(m[1],16) : 0;
  }
  function revisar(){
    if(mostrado || !navigator.onLine) return;
    var ahora = Date.now(); if(ahora - ultima < 60000) return; ultima = ahora;
    try{ if(+sessionStorage.getItem('aviso_callar') > ahora) return; }catch(e){}
    fetch(location.pathname, {method:'HEAD', cache:'no-store'}).then(function(r){
      if(!r.ok) return;
      var srv = tamServidor(r); if(!srv) return;
      var loc = tamLocal(), base = loc;
      if(!base){
        try{ base = +localStorage.getItem(CLAVE) || 0; if(!base){ localStorage.setItem(CLAVE, srv); return; } }catch(e){ return; }
      }
      if(srv !== base) pintar(srv);
    }).catch(function(){});
  }
  function actualizar(srv){
    try{ localStorage.setItem(CLAVE, srv); sessionStorage.setItem('aviso_callar', Date.now()+5*60000); }catch(e){}
    var pasos = [];
    if('serviceWorker' in navigator){
      pasos.push(navigator.serviceWorker.getRegistrations().then(function(rs){ return Promise.all(rs.map(function(g){ return g.update().catch(function(){}); })); }).catch(function(){}));
    }
    if(PREFIJO_CACHE && window.caches){
      pasos.push(caches.keys().then(function(ks){ return Promise.all(ks.filter(function(k){ return k.indexOf(PREFIJO_CACHE)===0; }).map(function(k){ return caches.delete(k); })); }).catch(function(){}));
    }
    pasos.push(fetch(location.href, {cache:'reload'}).catch(function(){}));
    Promise.all(pasos).then(function(){ location.reload(); });
    setTimeout(function(){ location.reload(); }, 4000);
  }
  function pintar(srv){
    mostrado = true;
    var b = document.createElement('div');
    b.id = 'aviso-version';
    b.setAttribute('role','status');
    b.style.cssText = 'position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));'+
      'z-index:2147483000;display:flex;align-items:center;gap:12px;background:#0E2A5C;color:#F2F7FF;'+
      'padding:10px 10px 10px 16px;border-radius:999px;box-shadow:0 8px 28px rgba(8,20,48,.35);'+
      'font:500 14px/1.2 "DM Sans",system-ui,-apple-system,sans-serif;max-width:calc(100vw - 24px);white-space:nowrap';
    b.innerHTML = '<span>Hay una versión nueva</span>'+
      '<button type="button" style="font:inherit;font-weight:700;border:0;border-radius:999px;padding:8px 14px;background:#6FA0FF;color:#0A1D40;cursor:pointer">Actualizar</button>'+
      '<button type="button" aria-label="Ahora no" style="font:inherit;border:0;background:none;color:#BCD3FF;font-size:18px;padding:0 6px;cursor:pointer">×</button>';
    var bs = b.querySelectorAll('button');
    bs[0].onclick = function(){ bs[0].textContent = 'Cargando…'; actualizar(srv); };
    bs[1].onclick = function(){ b.remove(); mostrado = false; try{ sessionStorage.setItem('aviso_callar', Date.now()+30*60000); }catch(e){} };
    document.body.appendChild(b);
  }
  setTimeout(revisar, 3000);
  document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='visible') revisar(); });
  window.addEventListener('focus', revisar);
})();
</script>
