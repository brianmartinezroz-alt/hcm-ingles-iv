<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inglés · HCM</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F0EADB">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HCM">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
<style>

:root{
  --crema:#F2EDE0; --crema-2:#EAE4D4; --papel:#FAF8F2;
  --tinta:#1C1510; --tinta-2:#4A3F35; --tenue:#8A7A6A; --linea:#DDD5C4;
  --verde:#8B1A2A; --verde-hondo:#6B1020; --verde-suave:#F5E8EA;
  --coral:#C9A84C; --ambar:#8B7355;
  --voz:#1E3A63; --voz-hondo:#132850; --grabando:#C8322D;
  --dorado:#C9A84C; --dorado-h:#A88530; --dorado-s:#FDF6E3;
  --display:'Libre Baskerville',Georgia,serif;
  --body:'Inter',system-ui,-apple-system,sans-serif;
  --mono:ui-monospace,monospace;
}
[data-uni="1"]{ --verde:#8B1A2A; --verde-hondo:#6B1020; --verde-suave:#F5E8EA; }
[data-uni="2"]{ --verde:#C9A84C; --verde-hondo:#A88530; --verde-suave:#FDF6E3; }
[data-uni="3"]{ --verde:#4A6741; --verde-hondo:#2E4A28; --verde-suave:#E8EEE6; }
[data-uni="4"]{ --verde:#C9A84C; --verde-hondo:#A88530; --verde-suave:#1A1A1A; }
[data-nv="pre-a1"],[data-nv="a1"]{ --verde:#8B1A2A; --verde-hondo:#6B1020; --verde-suave:#F5E8EA; }
[data-nv="a2"],[data-nv="b1"]{ --verde:#C9A84C; --verde-hondo:#A88530; --verde-suave:#FDF6E3; }
[data-nv="b2"],[data-nv="c1"]{ --verde:#4A6741; --verde-hondo:#2E4A28; --verde-suave:#E8EEE6; }
[data-nv="c2"]{ --verde:#C9A84C; --verde-hondo:#A88530; --verde-suave:#1A1A1A; }
.hcm-login{display:flex;flex-direction:column;align-items:center;padding:32px 20px 24px;gap:18px}
.hcm-lema{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--dorado);text-align:center}
.hcm-titulo{font-family:var(--display);font-size:24px;font-weight:700;color:var(--tinta);text-align:center;line-height:1.15}
.hcm-sub{font-size:12px;color:var(--tenue);text-align:center;line-height:1.55;margin-top:-6px}
.hcm-form{width:100%;display:flex;flex-direction:column;gap:13px}
.hcm-campo{display:flex;flex-direction:column;gap:4px}
.hcm-campo label{font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--tinta-2)}
.hcm-campo input{background:var(--crema);border:1.5px solid var(--linea);border-radius:10px;padding:13px 14px;font-family:var(--body);font-size:15px;color:var(--tinta);transition:border-color .15s}
.hcm-campo input:focus{outline:none;border-color:var(--verde)}
.hcm-campo input::placeholder{color:var(--tenue)}
.hcm-btn-login{width:100%;background:var(--verde);color:#fff;border:0;border-radius:10px;padding:15px;font-family:var(--body);font-size:15px;font-weight:700;cursor:pointer;transition:background .15s}
.hcm-btn-login:hover{background:var(--verde-hondo)}
.hcm-btn-login:active{transform:scale(.98)}
.hcm-mapa{padding:14px 0}
.hcm-mapa-cab{padding:0 16px 14px}
.hcm-saludo{font-size:11.5px;color:var(--tenue);margin-bottom:2px}
.hcm-nombre{font-family:var(--display);font-size:20px;font-weight:700;color:var(--tinta)}
.hcm-carril-chip{display:inline-block;margin-top:5px;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.hcm-carril-chip.bajo{background:var(--verde-suave);color:var(--verde)}
.hcm-carril-chip.medio{background:#FEF3E2;color:#92600A}
.hcm-carril-chip.alto{background:#E8EEE6;color:#2E4A28}
.hcm-prog-fila{display:flex;align-items:center;gap:10px;margin-top:10px}
.hcm-prog-bar{flex:1;height:5px;background:var(--linea);border-radius:3px;overflow:hidden}
.hcm-prog-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--verde),var(--dorado))}
.hcm-prog-txt{font-size:10.5px;color:var(--tenue);white-space:nowrap}
.hcm-paradas{display:flex;flex-direction:column;gap:6px;padding:0 16px}
.hcm-parada{display:flex;align-items:flex-start;gap:11px;padding:11px 12px;background:var(--papel);border:1.5px solid var(--linea);border-radius:12px;cursor:pointer;transition:.15s}
.hcm-parada:active{transform:scale(.985)}
.hcm-parada.actual{border-color:var(--verde);background:var(--verde-suave)}
.hcm-parada.hecha{opacity:.6}
.hcm-parada.bloqueada{opacity:.3;cursor:not-allowed}
.hcm-parada.examen{border-color:var(--dorado);background:var(--dorado-s)}
.hcm-parada.examen-hecho{border-color:var(--dorado);opacity:.6}
.hcm-par-ic{width:28px;height:28px;border-radius:50%;background:var(--crema-2);border:1.5px solid var(--linea);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--tenue);flex:none}
.hcm-parada.actual .hcm-par-ic{background:var(--verde);border-color:var(--verde);color:#fff}
.hcm-parada.hecha .hcm-par-ic{background:var(--verde);border-color:var(--verde);color:#fff;font-size:13px}
.hcm-parada.examen .hcm-par-ic,.hcm-parada.examen-hecho .hcm-par-ic{background:var(--dorado);border-color:var(--dorado);color:#fff;font-size:15px}
.hcm-par-tx{flex:1;min-width:0}
.hcm-par-eti{font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--tenue);margin-bottom:1px}
.hcm-parada.actual .hcm-par-eti{color:var(--verde)}
.hcm-parada.examen .hcm-par-eti,.hcm-parada.examen-hecho .hcm-par-eti{color:var(--dorado-h)}
.hcm-par-nom{font-family:var(--display);font-size:14px;font-weight:700;color:var(--tinta);line-height:1.2;margin-bottom:1px}
.hcm-par-sub{font-size:11px;color:var(--tenue);line-height:1.4}
.hcm-dx{display:flex;flex-direction:column;gap:16px;padding:24px 16px}
.hcm-dx-titulo{font-family:var(--display);font-size:22px;font-weight:700;color:var(--tinta)}
.hcm-dx-sub{font-size:13px;color:var(--tenue);line-height:1.55}
.hcm-carril{display:flex;align-items:flex-start;gap:11px;padding:13px 14px;background:var(--papel);border:1.5px solid var(--linea);border-radius:11px;cursor:pointer;transition:.15s}
.hcm-carril:hover{border-color:var(--verde)}
.hcm-carril.sel{border-color:var(--verde);background:var(--verde-suave)}
.hcm-carril-ic{font-size:20px;flex:none;margin-top:1px}
.hcm-carril-tx b{display:block;font-size:14px;font-weight:600;color:var(--tinta);margin-bottom:2px}
.hcm-carril-tx small{font-size:11.5px;color:var(--tenue);line-height:1.4}

<style>
  :root{
    --crema:#F5F1E8;      /* fondo general */
    --crema-2:#EFEADD;    /* bloques secundarios */
    --papel:#FDFBF6;      /* tarjetas */
    --tinta:#2A2724;      /* texto principal */
    --tinta-2:#57534E;    /* texto secundario */
    --tenue:#8A837A;      /* texto terciario */
    --linea:#E2DACA;
    --verde:#C9A84C;      /* acento */
    
    --verde-hondo:#9A7C22;
    --verde-suave:#E6F3EC;
    --coral:#D85A30;
    --ambar:#C08A22;
    /* El microfono NO puede ser del mismo verde que "continuar": el alumno
       no distinguia cual era cual. Azul profundo = tu voz. Verde = avanzar.
       Rojo = grabando ahora. Tres colores, tres significados. */
    --voz:#2B4C7E;
    --voz-hondo:#1E3A63;
    --grabando:#C8322D;
    --display:'Fraunces',Georgia,serif;
    --body:'DM Sans',system-ui,-apple-system,sans-serif;
    --mono:'DM Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--crema);color:var(--tinta);font-family:var(--body);line-height:1.55;
       -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
  .shell{max-width:1140px;margin:0 auto;padding:22px 16px 80px}

  /* ── En celular la pantalla NO se mueve. El encabezado se queda arriba
        y solo el contenido de en medio se desliza por dentro.
        Así el alumno nunca tiene que subir o bajar la página entera. ── */
  @media (max-width:760px){
    html,body{height:100%;overflow:hidden;overscroll-behavior:none}
    .shell{
      height:100dvh;              /* dvh: cuenta la barra del navegador del celular */
      max-height:100dvh;
      display:flex;flex-direction:column;
      padding:12px 14px 0;
      overflow:hidden;
    }
    .topbar{flex:none;padding-bottom:10px;margin-bottom:12px}
    .brand{font-size:19px}
    #app{
      flex:1 1 auto;
      min-height:0;               /* sin esto flex no deja encoger y se desborda */
      overflow-y:auto;
      -webkit-overflow-scrolling:touch;
      padding-bottom:18px;
      scrollbar-width:none;
    }
    #app::-webkit-scrollbar{display:none}
    .card{margin-bottom:0}
  }
  @supports not (height:100dvh){
    @media (max-width:760px){ .shell{height:100vh;max-height:100vh} }
  }
  .wrapc{max-width:540px;margin:0 auto}

  .topbar{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;
          border-bottom:1px solid var(--linea);padding-bottom:14px;margin-bottom:20px}
  .kicker{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;
          color:var(--tenue);margin-bottom:4px}
  .brand{font-family:var(--display);font-size:23px;font-weight:600;letter-spacing:-.02em;color:var(--tinta)}
  .brand em{font-style:normal;color:var(--verde)}
  button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--verde);outline-offset:2px}

  /* ── tarjeta principal ── */
  .qcard{background:var(--papel);border:1px solid var(--linea);border-radius:16px;padding:26px 22px;
         box-shadow:0 1px 2px rgba(42,39,36,.04),0 8px 24px rgba(42,39,36,.05)}
  .qlbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
        color:var(--tenue);margin-bottom:9px}
  .qtxt{font-family:var(--display);font-size:23px;line-height:1.3;font-weight:600;
        letter-spacing:-.015em;margin-bottom:8px;color:var(--tinta)}
  .qsub{font-size:13.5px;color:var(--tinta-2);margin-bottom:20px;line-height:1.55}

  /* ── botones ── */
  /* ---- cada nivel toma el color de su propio mapa ----
     El mapa de cada nivel ya tiene su material y su color: madera y tierra
     en el primero, piedra verde, ladrillo cobre, marmol acero, marmol vino,
     obsidiana y oro, cristal casi blanco. Los botones ahora van a juego, de
     modo que el alumno reconoce en que nivel esta con solo ver la pantalla.
     El azul del microfono y el rojo de grabando NO se tocan: esos tres
     colores significan cosas distintas y deben seguir siendo los mismos
     en todos los niveles. */
  [data-nv="pre-a1"]{ --verde:#8F5A26; --verde-hondo:#6E4318; --verde-suave:#F3EBDF; }
  [data-nv="a1"]    { --verde:#2E7D55; --verde-hondo:#1F5C3E; --verde-suave:#E6F0E9; }
  [data-nv="a2"]    { --verde:#B0552A; --verde-hondo:#8A3F1C; --verde-suave:#F6E9E0; }
  [data-nv="b1"]    { --verde:#1F7A8C; --verde-hondo:#145A69; --verde-suave:#E4F0F3; }
  [data-nv="b2"]    { --verde:#8C2F4A; --verde-hondo:#6B2038; --verde-suave:#F5E7EB; }
  [data-nv="c1"]    { --verde:#5B3E8E; --verde-hondo:#452D6E; --verde-suave:#EDE8F5; }
  [data-nv="c2"]    { --verde:#3A4552; --verde-hondo:#2A3441; --verde-suave:#EAEEF2; }

  .btn{width:100%;display:flex;align-items:center;justify-content:center;gap:9px;background:var(--verde);
       color:#fff;border:0;border-radius:10px;padding:14px;font-size:14.5px;font-weight:700;
       cursor:pointer;font-family:var(--body);transition:background .15s}
  .btn:hover{background:var(--verde-hondo)}
  .btn.ghost{background:none;border:1px solid var(--linea);color:var(--tinta-2);font-weight:500;font-size:13.5px;padding:12px}
  .btn.ghost:hover{background:var(--crema-2);color:var(--tinta)}
  .btn.rec{background:var(--grabando);box-shadow:0 0 0 3px rgba(200,50,45,.16)}
  .btn+.btn{margin-top:8px}
  .btn[disabled]{opacity:.5;cursor:default}
  .pulse{width:9px;height:9px;border-radius:50%;background:currentColor}
  .btn.rec .pulse{animation:beat 1s infinite}
  @keyframes beat{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}

  .mic-big{width:100%;display:flex;align-items:center;justify-content:center;gap:11px;background:var(--voz);
    color:#fff;border:0;border-radius:40px;padding:19px;font-size:16px;font-weight:700;cursor:pointer;
    font-family:var(--body);transition:background .15s}
  .mic-big:hover{background:var(--voz-hondo)}
  /* grabando: rojo y con latido, imposible confundirlo con avanzar */
  .mic-big.rec{background:var(--grabando);box-shadow:0 0 0 4px rgba(200,50,45,.18)}
  .mic-big[disabled]{opacity:.5}
  .ring2{width:11px;height:11px;border-radius:50%;background:currentColor}
  .mic-big.rec .ring2{animation:beat 1s infinite}
  @media(prefers-reduced-motion:reduce){.btn .pulse,.mic-big .ring2{animation:none}}

  /* ── opciones ── */
  .pick{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
  .pick button{background:var(--crema);border:1px solid var(--linea);color:var(--tinta);
    border-radius:22px;padding:10px 15px;font-family:var(--body);font-size:14px;cursor:pointer;text-align:left}
  .pick button:hover{border-color:var(--verde);background:var(--verde-suave)}
  .pick button.sel{background:var(--verde);border-color:var(--verde);color:#fff;font-weight:700}
  .pick button i{font-style:normal;font-family:var(--mono);font-size:10.5px;opacity:.65;display:block;margin-top:2px}
  .pick button.sel i{opacity:.9}

  .opts{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
  /* ---- tipos nuevos: gramatica y listening ---- */
  .reglabox{background:var(--papel);border:1px solid var(--linea);border-left:3px solid var(--verde);
    border-radius:10px;padding:12px 14px;margin:10px 0}
  .regla-t{font-family:var(--display);font-size:16px;margin-bottom:4px}
  .regla-d{font-size:13.5px;line-height:1.5;opacity:.85}
  .parfila{display:flex;gap:8px;margin:10px 0}
  .par{flex:1;border-radius:9px;padding:10px 12px;font-size:14px;border:1px solid var(--linea)}
  .par-et{display:block;font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;
    text-transform:uppercase;opacity:.6;margin-bottom:3px}
  .par.bien{background:rgba(201,168,76,.09);border-color:rgba(201,168,76,.35)}
  .par.mal{background:rgba(216,90,48,.08);border-color:rgba(216,90,48,.3);text-decoration:line-through;opacity:.75}
  .cazafila,.piezasfila{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}
  .palb{background:var(--papel);border:1px solid var(--linea);color:var(--tinta);
    border-radius:8px;padding:9px 13px;font-size:15px;font-family:inherit;cursor:pointer;transition:.15s}
  .palb:active{transform:scale(.96)}
  .palb.usada{opacity:.25;pointer-events:none}
  .palb.ok{background:rgba(201,168,76,.2);border-color:var(--verde)}
  .palb.no{background:rgba(216,90,48,.18);border-color:var(--coral)}
  .hueco{display:inline-block;min-width:64px;border-bottom:2px dashed var(--verde);
    margin:0 4px;color:transparent}
  .opsfila{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
  .opsfila.col{flex-direction:column}
  .armado{min-height:46px;background:var(--papel);border:1px dashed var(--linea);
    border-radius:9px;padding:10px 12px;margin:10px 0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .armado-vacio{font-size:12.5px;opacity:.45}
  .armw{background:rgba(201,168,76,.13);border:1px solid rgba(201,168,76,.3);
    border-radius:6px;padding:5px 10px;font-size:14.5px}
  .pidebox{background:rgba(216,90,48,.08);border:1px solid rgba(216,90,48,.25);
    border-radius:8px;padding:9px 12px;margin:10px 0;font-size:13.5px}
  .dictoin{width:100%;background:var(--papel);border:1px solid var(--linea);border-radius:9px;
    padding:11px 12px;font-family:inherit;font-size:15px;color:var(--tinta);margin:10px 0;resize:vertical}
  .dictoin:focus{outline:none;border-color:var(--verde)}
  .fb{border-radius:9px;padding:10px 12px;margin:10px 0;font-size:14px;line-height:1.45}
  .fb.ok{background:rgba(201,168,76,.12);border:1px solid rgba(201,168,76,.35)}
  .grabando{display:flex;align-items:center;gap:9px;background:rgba(216,90,48,.1);
    border:1px solid rgba(216,90,48,.35);border-radius:9px;padding:11px 13px;margin:10px 0;
    font-size:14px;font-weight:500}
  .grabando .punto{width:11px;height:11px;border-radius:50%;background:var(--coral);
    animation:latir 1s infinite;flex:none}
  @keyframes latir{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}
  .aprendi .apfila{display:flex;gap:8px;margin:12px 0}
  .aprendi .apbox{flex:1;background:var(--papel);border:1px solid var(--linea);border-radius:9px;
    padding:10px 6px;text-align:center}
  .aprendi .apbox b{display:block;font-family:var(--display);font-size:22px;color:var(--verde)}
  .aprendi .apbox span{font-size:10.5px;opacity:.7}
  .aprendi .aplista{margin-top:12px}
  .aprendi .aplista .hl{font-family:var(--mono);font-size:9px;letter-spacing:.13em;
    text-transform:uppercase;opacity:.6;margin-bottom:5px}
  /* ---- acentos, roleplay, recuento, pares, palabra, deletreo ---- */
  .acefila{display:flex;gap:8px;margin:12px 0}
  .aceb{flex:1;background:var(--papel);border:1px solid var(--linea);border-radius:10px;
    padding:11px 4px;font-size:24px;line-height:1;cursor:pointer;transition:.15s;
    display:flex;flex-direction:column;align-items:center;gap:5px;font-family:inherit;color:var(--tinta)}
  .aceb span{font-size:9.5px;opacity:.7;letter-spacing:.02em}
  .aceb.on{border-color:var(--verde);background:rgba(201,168,76,.1)}
  .aceb:active{transform:scale(.95)}
  .quien{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;
    opacity:.6;margin:10px 0 5px}
  .opt.gr{flex:1;text-align:center;font-size:19px;padding:15px 10px;font-family:var(--display)}
  .palgrande{font-family:var(--display);font-size:30px;text-align:center;margin:14px 0 4px;
    color:var(--verde)}
  .apoyofila{display:flex;flex-wrap:wrap;gap:6px}
  .bubble-ia.pensando .ht{opacity:.55;font-style:italic}
  /* ---- asomarse a una lección desde el mapa ---- */
  .asom-velo{position:fixed;inset:0;z-index:950;background:rgba(42,39,36,.55);
    backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:20px}
  .asom-caja{background:var(--papel);border:1px solid var(--linea);border-radius:17px;
    padding:20px 19px;max-width:380px;width:100%;max-height:85vh;overflow-y:auto;
    box-shadow:0 16px 44px rgba(0,0,0,.25)}
  .asom-tag{font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;
    color:var(--tenue);margin-bottom:6px}
  .asom-t{font-family:var(--display);font-size:23px;font-weight:600;line-height:1.15}
  .asom-o{font-size:13.5px;color:var(--tenue);margin-top:5px;line-height:1.5}
  .asom-b{margin-top:13px}
  .asom-h{font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;
    color:var(--verde);margin-bottom:3px}
  .asom-i{font-size:14.5px;line-height:1.5;padding-left:10px;border-left:2px solid var(--linea)}
  .asom-vela{margin-top:14px;padding:10px 12px;background:var(--crema);border-radius:9px;
    font-size:12.5px;color:var(--tenue);line-height:1.5}

  /* ---- el método ---- */
  .met-t{font-family:var(--display);font-size:26px;font-weight:600;line-height:1.1;margin:4px 0 6px}
  .met-s{font-size:14.5px;color:var(--tenue);line-height:1.55;margin-bottom:20px}
  .met-b{display:flex;gap:13px;padding:15px 0;border-top:1px solid var(--linea)}
  .met-n{flex:none;width:25px;height:25px;border-radius:50%;background:rgba(201,168,76,.12);
    color:var(--verde);display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-size:11.5px;margin-top:2px}
  .met-c{flex:1;min-width:0}
  .met-h{font-family:var(--display);font-size:17px;font-weight:600;margin-bottom:4px;line-height:1.25}
  .met-p{font-size:14.5px;line-height:1.6;color:var(--tinta)}
  .met-f{margin-top:6px;font-family:var(--mono);font-size:10px;letter-spacing:.06em;
    color:var(--tenue)}
  .met-pie{margin-top:18px;padding-top:14px;border-top:1px solid var(--linea);
    font-size:12.5px;color:var(--tenue);line-height:1.55}

  .lqv{background:var(--papel);border:1px solid var(--linea);border-radius:13px;
    padding:15px 16px;margin:12px 0}
  .lqv-h{font-family:var(--display);font-size:17px;font-weight:600;margin-bottom:11px}
  .lqv-b{margin-bottom:11px}
  .lqv-t{font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;
    color:var(--verde);margin-bottom:4px}
  .lqv-i{font-size:14px;line-height:1.5;padding:3px 0 3px 11px;border-left:2px solid var(--linea)}
  .lqv-oir{width:100%;background:var(--crema);border:1px solid var(--linea);color:var(--tinta);
    border-radius:9px;padding:9px;font-family:inherit;font-size:13.5px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:7px}

  .hilox{background:rgba(201,168,76,.07);border-left:3px solid var(--verde);
    border-radius:0 10px 10px 0;padding:11px 14px;margin:11px 0;font-size:14px;line-height:1.5}
  .hilox span{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.13em;
    text-transform:uppercase;opacity:.6;margin-bottom:3px}

  /* ---- pantalla Más ---- */
  .maslista{display:flex;flex-direction:column;gap:7px;margin-top:14px}
  .masb{display:flex;align-items:center;gap:12px;background:var(--papel);
    border:1px solid var(--linea);border-radius:12px;padding:13px 14px;
    font-family:inherit;cursor:pointer;text-align:left;color:var(--tinta);width:100%}
  .masb:active{transform:scale(.985)}
  .mas-ic{font-size:21px;flex:none;width:26px;text-align:center}
  .mas-tx{flex:1;min-width:0}
  .mas-tx b{display:block;font-size:15px;font-weight:600;margin-bottom:1px}
  .mas-tx small{font-size:12px;color:var(--tenue);line-height:1.35}
  .mas-fl{font-size:19px;color:var(--tenue);flex:none}

  /* ---- mapa 3D ---- */
  /* El mapa 3D pone su propio ancho, alto y scroll. Aquí solo se le da
     un hueco a pantalla completa y se le deja hacer lo suyo. */
  /* Centrado y con ancho de celular, aunque se abra en computadora. */
  .lienzo3d{position:fixed;left:0;right:0;margin:0 auto;
    width:min(430px,100vw);top:0;
    bottom:calc(72px + env(safe-area-inset-bottom));z-index:1;
    overflow-y:auto;overflow-x:hidden;background:var(--crema);
    scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  .lienzo3d::-webkit-scrollbar{display:none}
  .lienzo3d::-webkit-scrollbar{display:none}
  .lienzo3d canvas{display:block}
  .cab3d{position:fixed;left:0;right:0;margin:0 auto;
    width:min(430px,100vw);top:0;z-index:5;padding:14px 18px 10px;
    pointer-events:none;background:linear-gradient(180deg,var(--crema),transparent);
    display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .cab3d .niveles{pointer-events:auto;display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
  .nivb{background:var(--papel);border:1px solid var(--linea);color:var(--tinta);
    border-radius:6px;padding:4px 7px;font-family:var(--mono);font-size:9px;
    cursor:pointer;line-height:1.1}
  .nivb.on{background:var(--verde);border-color:var(--verde);color:#fff}
  .nivb.cerrado{opacity:.38;cursor:not-allowed}
  .cab3d-niv{font-family:var(--display);font-size:19px;font-weight:600}
  .cab3d-par{font-size:12.5px;color:var(--tenue);margin-top:1px}
  .btn3d{position:fixed;left:0;right:0;margin:0 auto;width:max-content;
    bottom:calc(92px + env(safe-area-inset-bottom));z-index:6;
    background:var(--verde);color:#fff;border:0;border-radius:13px;
    padding:14px 28px;font-family:inherit;font-size:15.5px;font-weight:600;
    cursor:pointer;box-shadow:0 6px 20px rgba(201,168,76,.4);white-space:nowrap}
  .btn3d:active{transform:scale(.97)}
  body:has(.lienzo3d) .shell{padding-bottom:0}

  /* ---- hojas de hola y adiós ---- */
  /* FLOTANTE en medio de la pantalla, con el mapa visible alrededor.
     Antes subia desde abajo pegada al borde y tapaba todo. */
  .hoja-velo{position:fixed;inset:0;z-index:880;background:rgba(42,39,36,0);
    display:flex;align-items:center;justify-content:center;padding:20px;
    transition:background .3s ease;pointer-events:auto;backdrop-filter:blur(0px)}
  .hoja-velo.abierta{background:rgba(42,39,36,.34);backdrop-filter:blur(2.5px)}
  .hoja{width:100%;max-width:360px;background:var(--papel);
    border-radius:20px;padding:20px 22px 22px;
    box-shadow:0 22px 58px rgba(0,0,0,.3);
    transform:translateY(24px) scale(.94);opacity:0;
    transition:transform .3s cubic-bezier(.22,.9,.3,1), opacity .24s ease;
    max-height:74vh;overflow-y:auto}
  .hoja-velo.abierta .hoja{transform:translateY(0) scale(1);opacity:1}
  .hoja-asa{display:none}
  .hoja-cab{display:flex;align-items:center;gap:13px;margin-bottom:14px}
  .hoja-foto{width:54px;height:54px;border-radius:50%;object-fit:cover;flex:none;
    border:2px solid var(--verde)}
  .hoja-foto.vacia{background:var(--crema);border-color:var(--linea);
    display:flex;align-items:center;justify-content:center;font-size:24px}
  /* El saludo es lo que se viene a aprender, asi que es lo mas grande de
     la ventana. El nombre pasa a segundo termino. */
  .hoja-hola{font-family:var(--display);font-size:31px;font-weight:600;
    line-height:1.1;color:var(--tinta);margin-bottom:3px}
  .hoja-nom{font-size:14.5px;color:var(--tenue);font-weight:500;line-height:1.3}
  @media(max-width:380px){ .hoja-hola{font-size:26px} }
  .hoja-racha{background:rgba(216,90,48,.09);border:1px solid rgba(216,90,48,.26);
    border-radius:10px;padding:9px 13px;font-size:13.5px;margin-bottom:13px}
  .hoja-racha b{color:var(--coral);font-size:16px}
  .hoja-hoy{background:var(--crema);border-radius:13px;padding:14px 16px;margin-bottom:15px}
  .hoja-et{font-family:var(--mono);font-size:9px;letter-spacing:.13em;
    text-transform:uppercase;color:var(--verde);margin-bottom:4px}
  .hoja-lec{font-family:var(--display);font-size:20px;font-weight:600;margin-bottom:3px}
  .hoja-sub{font-size:13.5px;color:var(--tenue);line-height:1.5}
  .hoja-btn{width:100%}
  .adios-frase{font-family:var(--display);font-size:15px;line-height:1.45;
    text-align:center;color:var(--verde);margin:13px 4px 15px;font-style:italic}
  .hoja-mas{width:100%;margin-top:9px;background:none;border:0;font-family:inherit;
    font-size:13.5px;color:var(--tenue);cursor:pointer;padding:9px}
  @media (prefers-reduced-motion:reduce){
    .hoja{transition:none} .hoja-velo{transition:none}
  }

  /* ---- barra de abajo ---- */
  .barrabaja{position:fixed;left:0;right:0;bottom:0;z-index:800;
    display:flex;align-items:flex-end;justify-content:space-around;
    background:rgba(253,251,246,.97);backdrop-filter:blur(10px);
    border-top:1px solid var(--linea);
    padding:8px 6px calc(12px + env(safe-area-inset-bottom))}
  .tabb{flex:1;background:none;border:0;font-family:inherit;cursor:pointer;
    font-size:10.5px;color:var(--tenue);line-height:1.3;padding:2px 0}
  .tabb .ic{display:block;font-size:20px;margin-bottom:2px;opacity:.5}
  .tabb.on{color:var(--verde);font-weight:600}
  .tabb.on .ic{opacity:1}
  .tabb:active{transform:scale(.94)}
  .tabb.maestro{color:var(--tinta);font-weight:600}
  .fotomaestro{display:flex;width:44px;height:44px;border-radius:50%;margin:0 auto 2px;
    align-items:center;justify-content:center;font-size:20px;overflow:hidden;
    background:linear-gradient(160deg,#93A7B8,#3E5468);
    border:2.5px solid var(--verde);box-shadow:0 3px 10px rgba(0,0,0,.18)}
  .fotomaestro img{width:100%;height:100%;object-fit:cover}
  .tabb .ic img{width:26px;height:26px;border-radius:50%;object-fit:cover;
    display:block;margin:0 auto}
  body{padding-bottom:78px}
  .menub{display:none}          /* fuera las tres líneas */
  @media (min-width:900px){ .barrabaja{max-width:520px;margin:0 auto;border-radius:18px 18px 0 0} }

  /* ---- foto de perfil ---- */
  .fotoperfil{width:104px;height:104px;border-radius:50%;margin:0 auto 12px;
    background:var(--crema);border:2px solid var(--linea);overflow:hidden;
    display:flex;align-items:center;justify-content:center;font-size:38px;
    position:relative;cursor:pointer}
  .fotoperfil img{width:100%;height:100%;object-fit:cover}
  .fotoperfil .cambiar{position:absolute;left:0;right:0;bottom:0;
    background:rgba(42,39,36,.72);color:#fff;font-size:9.5px;padding:4px 0;
    text-align:center;letter-spacing:.04em}

  /* ---- corrección al momento ---- */
  .corr{background:rgba(216,90,48,.07);border:1px solid rgba(216,90,48,.28);
    border-radius:11px;padding:13px 15px;margin:11px 0}
  .corr.ok{background:rgba(201,168,76,.08);border-color:rgba(201,168,76,.3)}
  .corr.pensando{opacity:.6;font-style:italic;font-size:13.5px;
    background:var(--papel);border-color:var(--linea)}
  .corr-h{font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;
    opacity:.65;margin-bottom:3px}
  .corr-q{font-size:15px;line-height:1.5}
  .corr-c{font-size:15px;line-height:1.5}
  .corr-k{margin-top:9px;padding-top:8px;border-top:1px solid rgba(0,0,0,.07);font-size:13.5px}

  .fb-t{font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;
    opacity:.7;margin-bottom:4px}
  .fb-p{font-size:14.5px;line-height:1.55}

  /* ---- opciones con su traduccion ---- */
  .optfila{display:flex;gap:5px;align-items:stretch;flex-wrap:wrap;margin-bottom:7px}
  .optfila .opt{flex:1;margin:0;min-width:0}
  /* C1 y C2: fuera TODO el espanol de la interfaz. Se apaga desde aqui en
     vez de parchar boton por boton, asi tambien cubre los que se agreguen
     despues. La clase la pone aplicarIdiomaUI() segun el nivel. */
  body.solo-en .optmx,
  body.solo-en .varmx,
  body.solo-en #oires,
  body.solo-en #sig1,
  body.solo-en .oirb.alt,
  body.solo-en .qsub{display:none!important}

  .optmx{flex:none;background:var(--papel);border:1px solid var(--linea);
    border-radius:9px;padding:0 11px;font-size:14px;cursor:pointer;color:var(--tinta)}
  .optmx:active{transform:scale(.94)}
  .opttrad{flex-basis:100%;font-size:13px;color:var(--tenue);padding:4px 4px 2px 10px;
    border-left:2px solid rgba(201,168,76,.3);margin-left:3px}
  .opttrad.pensando{opacity:.55;font-style:italic}

  /* ---- video de gente real ---- */
  .vidmarco{width:100%;margin:12px 0}
  .vidcaja{background:var(--papel);border:1px solid var(--linea);border-radius:13px;
    padding:16px 17px;text-align:center}
  .vidfrase{font-family:var(--display);font-size:20px;margin-bottom:7px;line-height:1.25}
  .vidnota{font-size:13px;color:var(--tenue);line-height:1.5;margin-bottom:13px}
  .vidbtn{display:inline-block;background:#CC0000;color:#fff;border-radius:11px;
    padding:12px 22px;font-size:14.5px;font-weight:600;text-decoration:none}
  .vidbtn:active{transform:scale(.97)}
  .vidcargando{padding:18px;text-align:center;color:var(--tenue);font-size:13.5px}
  /* escoger por donde empezar */
  .picknv{display:flex;flex-direction:column;gap:10px;margin:14px 0 4px}
  .picknv button{display:block;width:100%;text-align:left;background:var(--papel);
    border:2px solid var(--linea);border-radius:14px;padding:14px 15px;cursor:pointer;
    font-family:inherit;color:inherit}
  .picknv button b{display:block;font-family:var(--display);font-size:19px;margin-bottom:4px}
  .picknv button span{display:block;font-size:13.5px;color:var(--tenue);line-height:1.45}
  .picknv button i{display:inline-block;margin-top:8px;font-style:normal;font-size:12px;
    font-weight:600;color:var(--verde)}
  .picknv button.sel{border-color:var(--verde);background:rgba(201,168,76,.07)}
  .picknv button:active{transform:scale(.99)}
  /* el video se ve dentro de la app, en su recuadro */
  .vidplayer{position:relative;width:100%;padding-bottom:56.25%;height:0;
    border-radius:13px;overflow:hidden;background:#000;border:1px solid var(--linea)}
  .vidplayer iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0}
  .vidpie{font-size:12px;color:var(--tenue);text-align:center;margin-top:7px;line-height:1.45}
  .vidpie a{color:var(--tenue)}
  /* barrita de "solo estas mirando otro nivel" */
  .visitabarra{position:fixed;left:12px;right:12px;bottom:78px;z-index:820;
    background:var(--tinta);color:#fff;border-radius:13px;padding:11px 13px;
    display:flex;align-items:center;gap:11px;font-size:13px;line-height:1.35;
    box-shadow:0 8px 24px rgba(0,0,0,.24)}
  .visitabarra b{color:var(--verde-suave)}
  .visitabarra button{flex:none;background:var(--verde);color:#fff;border:0;
    border-radius:9px;padding:9px 13px;font-size:13px;font-weight:600;
    font-family:inherit;cursor:pointer}
  /* el renglon que explica el saludo o la despedida que tocó hoy */
  .hoja-gloss{font-size:12.5px;color:var(--tenue);line-height:1.45;margin:-4px 0 12px}
  .hoja-oir{width:100%;margin-bottom:9px}
  /* el ejemplo en video que acompana al vocabulario nuevo */
  .vocvid{margin:14px 0 4px}
  .vocvid.oculto{display:none}
  .vocvid-t{font-size:12.5px;color:var(--tenue);margin-bottom:6px;
    text-transform:uppercase;letter-spacing:.06em}

  /* ---- phrasal verbs y expresiones ---- */
  .phrgrande{font-family:var(--display);font-size:29px;text-align:center;margin:14px 0 3px;
    color:var(--verde);line-height:1.15}
  .phrsig{text-align:center;font-size:14.5px;color:var(--tenue);margin-bottom:6px}

  /* ---- preguntame lo que sea ---- */
  .pgchips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
  .pgchip{background:var(--crema);border:1px solid var(--linea);color:var(--tinta);
    border-radius:20px;padding:6px 12px;font-size:12.5px;font-family:inherit;cursor:pointer}
  .pgchip.on{background:rgba(201,168,76,.14);border-color:var(--verde);color:var(--verde)}
  .pgchip:active{transform:scale(.96)}
  .pgidioma{display:flex;gap:5px;margin-bottom:9px}
  .pgi{flex:1;background:var(--crema);border:1px solid var(--linea);color:var(--tenue);
    border-radius:8px;padding:7px;font-size:12.5px;font-family:inherit;cursor:pointer}
  .pgi.on{background:var(--papel);border-color:var(--verde);color:var(--verde);font-weight:500}
  .pgfila{display:flex;gap:6px;align-items:stretch}
  .pgfila .tx{flex:1;margin:0}
  .pgmic{flex:none;width:46px;background:var(--crema);border:1px solid var(--linea);
    border-radius:9px;color:var(--tinta);cursor:pointer;display:flex;align-items:center;
    justify-content:center;position:relative}
  .pgmic.oyendo{background:rgba(216,90,48,.14);border-color:var(--coral);color:var(--coral)}
  .pgpunto{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;
    background:var(--coral);animation:latir 1s infinite}
  .pgtxt{font-size:15px;line-height:1.6}

  /* ---- variantes con traduccion y duda ---- */
  .varfila{display:flex;align-items:stretch;gap:5px;margin-bottom:6px;flex-wrap:wrap}
  .varfila .varb{flex:1;margin-bottom:0;min-width:0}
  .varmx,.varuse{background:var(--papel);border:1px solid var(--linea);color:var(--tinta);
    border-radius:9px;padding:0 11px;font-family:inherit;font-size:13px;cursor:pointer;
    white-space:nowrap;flex:none}
  .varuse{font-size:12.5px;color:var(--verde);border-color:rgba(201,168,76,.35)}
  .varmx:active,.varuse:active{transform:scale(.95)}
  .vartrad{flex-basis:100%;font-size:13.5px;color:var(--tenue);padding:5px 4px 2px;
    border-left:2px solid rgba(201,168,76,.3);margin-left:3px;padding-left:9px}
  .vartrad.pensando{opacity:.55;font-style:italic}
  .dudab{border-style:dashed}
  .dudabox{background:var(--papel);border:1px solid var(--linea);border-radius:12px;
    padding:14px 15px;margin-top:10px}
  .dudabox .hl{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;
    text-transform:uppercase;opacity:.65}

  /* ---- barra flotante del jefe ---- */
  #barrajefe{position:fixed;left:0;right:0;bottom:0;z-index:900;
    background:rgba(42,39,36,.96);backdrop-filter:blur(8px);
    padding:8px 10px calc(8px + env(safe-area-inset-bottom));
    display:flex;flex-direction:column;gap:5px;
    box-shadow:0 -3px 18px rgba(0,0,0,.22)}
  .bj-fila{display:flex;align-items:center;gap:6px;justify-content:center;flex-wrap:wrap}
  .bj-b{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);
    color:#F5F1E8;border-radius:7px;padding:7px 11px;font-size:12.5px;font-family:inherit;
    cursor:pointer;white-space:nowrap}
  .bj-b.chico{padding:5px 9px;font-size:11px}
  .bj-b.apaga{background:rgba(216,90,48,.3);border-color:rgba(216,90,48,.5)}
  .bj-b:active{transform:scale(.95)}
  .bj-txt{color:#F5F1E8;font-size:12px;opacity:.85;max-width:150px;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .bj-txt.mono{font-family:var(--mono);font-size:11px}
  body:has(#barrajefe) #app{padding-bottom:130px}
  @media (max-width:760px){ body:has(#barrajefe) .shell{padding-bottom:0} }

  /* ---- modo jefe ---- */
  .jefe-tag{display:inline-block;background:rgba(216,90,48,.12);border:1px solid rgba(216,90,48,.35);
    color:var(--coral);border-radius:6px;padding:4px 9px;font-family:var(--mono);font-size:9px;
    letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px}
  .jefe-t{font-family:var(--display);font-size:23px;margin-bottom:3px}
  .jefe-s{font-size:13.5px;opacity:.7;margin-bottom:16px}
  .jefe-bloque{border-top:1px solid var(--linea);padding-top:13px;margin-top:13px}
  .jefe-h{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;
    opacity:.6;margin-bottom:8px}
  .jefe-fila{display:flex;gap:6px;flex-wrap:wrap}
  .jefe-fila.wrap{gap:5px}
  .jefe-b{background:var(--papel);border:1px solid var(--linea);color:var(--tinta);border-radius:8px;
    padding:9px 12px;font-size:13.5px;font-family:inherit;cursor:pointer}
  .jefe-b.chico{padding:7px 10px;font-size:12px;font-family:var(--mono)}
  .jefe-b.on{background:rgba(201,168,76,.14);border-color:var(--verde)}
  .jefe-b.peligro{border-color:rgba(216,90,48,.4);color:var(--coral)}
  .jefe-b:active{transform:scale(.97)}
  .jefe-nota{font-size:11.5px;opacity:.6;margin-top:7px;line-height:1.45}

/* ═══════════════════════════════════════════════════════════════════
   COLORES DEL COLEGIO · papel beige, negro y dorado
   Va al final a propósito: lo de arriba queda intacto y esto lo pisa.
   Negro = avanzar.    Dorado = tu voz.    Ámbar = grabando.
   ═══════════════════════════════════════════════════════════════════ */
:root,
:root[data-uni], body[data-uni],
:root[data-nv],  body[data-nv]{
  --crema:#F0EADB;        /* el papel de la pantalla */
  --crema-2:#E5DDC8;      /* bloques secundarios */
  --papel:#FBF7EC;        /* tarjetas */
  --tinta:#17120B;        /* texto principal, casi negro */
  --tinta-2:#463C2D;      /* texto secundario */
  --tenue:#8A7C66;        /* texto terciario */
  --suave:#463C2D;
  --linea:#D9CFB6;

  --verde:#1A150E;        /* avanzar: negro */
  --verde-hondo:#000000;
  --verde-suave:#EDE4CB;

  --voz:#8F7320;          /* el micrófono: dorado */
  --voz-hondo:#6E5716;
  --grabando:#A8541C;     /* grabando ahora */

  --dorado:#8F7320;       /* dorado que sí se lee sobre beige */
  --dorado-h:#6E5716;
  --dorado-s:#F7F0DA;
  --coral:#A8541C;
  --ambar:#8F7320;

  --display:'Libre Baskerville',Georgia,'Times New Roman',serif;
  --body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}

    if(VOCES.length||t>18){cb(VOCES);return;}
    t++;setTimeout(intenta,150);
  })();
}
function calidadVoz(v){
  var n=(v.name||'')+' '+(v.voiceURI||'');
  var p=0;
  if(/natural|neural|premium|enhanced|wavenet|studio/i.test(n))p+=5;
  if(/google/i.test(n))p+=3;
  if(/siri|samantha|karen|daniel|moira|aaron|nicky/i.test(n))p+=2;
  if(v.localService===false)p+=2;              // las de servidor suelen sonar mejor
  if(/david|zira|mark|hazel|espeak|compact|pico/i.test(n))p-=4;
  return p;
}
function idVoz(v){return (v.name||'')+'|'+(v.lang||'');}
function vocesIngles(){
  var en=VOCES.filter(function(v){return /^en(-|_)/i.test(v.lang);});
  en.sort(function(a,b){return calidadVoz(b)-calidadVoz(a);});
  // fuera duplicados exactos
  var vistos={},unicas=[];
  en.forEach(function(v){
    var k=idVoz(v).toLowerCase();
    if(!vistos[k]){vistos[k]=1;unicas.push(v);}
  });
  // variedad real: máximo dos por país, sin repetir el nombre completo.
  // Antes se comparaba solo la primera palabra y eso tiraba voces distintas
  // ("English Australia" y "English India" quedaban como si fueran la misma).
  var porPais={},nombres={},out=[];
  unicas.forEach(function(v){
    var p=(v.lang||'').toLowerCase();
    var n=(v.name||'').replace(/^(Microsoft|Google|Apple)\s+/i,'')
          .replace(/\s*-\s*English.*$/i,'').replace(/\s*\(.*\)$/,'')
          .replace(/[^a-z]/gi,'').toLowerCase();
    if(nombres[n])return;
    if((porPais[p]||0)>=2)return;
    porPais[p]=(porPais[p]||0)+1;nombres[n]=1;out.push(v);
  });
  // si aún caben, se agregan las que sobraron de países ya representados
  unicas.forEach(function(v){if(out.length<6&&out.indexOf(v)<0)out.push(v);});
  return out.slice(0,6);
}
function etiquetaVoz(v){
  var pais={'en-us':'Estados Unidos','en-gb':'Inglaterra','en-au':'Australia','en-ca':'Canadá',
            'en-in':'India','en-ie':'Irlanda','en-za':'Sudáfrica','en-nz':'Nueva Zelanda'}[(v.lang||'').toLowerCase()]||v.lang;
  var n=(v.name||'Voz').replace(/^(Microsoft|Google|Apple)\s+/i,'')
        .replace(/\s*-\s*English.*$/i,'').replace(/\s*\(.*\)$/,'').trim();
  return {nombre:n||v.name,pais:pais};
}
function elegirVozES(){
  VOZ_ES=VOCES.filter(function(v){return /^es(-|_)/i.test(v.lang);})
              .sort(function(a,b){return (/mx|us/i.test(b.lang)?1:0)-(/mx|us/i.test(a.lang)?1:0);})[0]||null;
}
function aplicarVoz(id){
  if(!id)return;
  VOZ_EN=VOCES.filter(function(v){return idVoz(v)===id;})[0]
       ||VOCES.filter(function(v){return v.voiceURI===id;})[0]||VOZ_EN;
}

// vel: 0.7 lento · nada = normal. Solo aplica a ESA frase, no a toda la app.
function sayLento(t,lang,cb){ return say(t,lang,cb,0.7); }
function say(t,lang,cb,vel){
  callarTodo();          // ← al primer clic se hace silencio, sin esperar la descarga
  marcarCargando(true);  // ← el botón avisa que viene en camino
  VEL_PEDIDA=vel||null;
  var k=clave(t);
  var archivo=(typeof GRABABLES!=='undefined'&&GRABABLES[k])?GRABABLES[k]:k;
  // se intenta SIEMPRE el audio: si el archivo existe, suena la voz buena;
  // si no, se apunta como faltante y de ahí en adelante va la del navegador
  if(!AUDIO_FALLA[archivo]){
    try{speechSynthesis.cancel();}catch(e){}
    decirConTuVoz(t,lang,cb,archivo);
    return;
  }
  say2(t,lang,cb);
}
function hablar(t,lang,cb){
  var u=new SpeechSynthesisUtterance(t);
  var es=(lang==='es-MX');
  var v=es?VOZ_ES:VOZ_EN;
  // el idioma tiene que ser el de la voz elegida: si se fuerza en-US y la voz
  // es británica o australiana, varios navegadores la ignoran y usan la de fábrica
  if(v){u.voice=v;u.lang=v.lang;}
  else{u.lang=es?'es-MX':'en-US';}
  // Si el alumno pidió "Más lento", también aquí se le baja.
  var base=es?Math.min(1.15,(RATE||0.85)+0.12):(RATE||0.85);
  u.rate=VEL_PEDIDA?Math.max(0.5,base*VEL_PEDIDA):base;
  u.pitch=1;
  if(cb)u.onend=cb;
  speechSynthesis.speak(u);
}
// varias frases seguidas, sin que se pisen
// se dice una sola cosa a la vez; encolar era lo que empalmaba las voces
function decirSeguido(lista){
  if(!lista||!lista.length)return;
  say(lista[0][0],lista[0][1]);
}

// Busca el audio en audio/nombre.webm y, si no está, en nombre.webm (la raíz).
// Así funciona aunque los archivos se hayan subido sueltos.
// Cada paquete es una carpeta con el catálogo completo generado con otra voz.
// La app solo ofrece los que de verdad existen en el repositorio.
var PAQUETES=[
  {id:'audio-us', nombre:'Estados Unidos', nota:'el que más se oye en el trabajo'},
  {id:'audio-uk', nombre:'Inglaterra',     nota:'acento británico'},
  {id:'audio-au', nombre:'Australia',      nota:'acento australiano'},
  {id:'audio-in', nombre:'India',          nota:'muy común en el trabajo técnico'}
];
var PAQUETE_ACTIVO='audio-us';   // por defecto, sin pasar por el selector
var VEL_AUDIO=1;   // 0.85 pausado · 1 normal · 1.15 rápido. Nunca 0.7: es irreal
var RUTAS=['audio/',''];
function armarRutas(){
  var r=[];
  if(PAQUETE_ACTIVO&&PAQUETE_ACTIVO!=='audio')r.push(PAQUETE_ACTIVO+'/');
  r.push('audio/');r.push('');
  RUTAS=r;AUDIO_RUTA=null;AUDIO_FALLA={};
}
var EXT=['.webm','.mp3'];   // sirve cualquiera de los dos formatos
var AUDIO_FALLA={};     // los que ya se sabe que no existen
var AUDIO_RUTA=null;    // la ruta que sí sirvió, para no volver a probar
var AUDIO_HAY=0;        // cuántas grabaciones se han encontrado
var BANDERA={us:'🇺🇸',uk:'🇬🇧',au:'🇦🇺',in:'🇮🇳'};
var NOMACE ={us:'Estados Unidos',uk:'Inglaterra',au:'Australia',in:'India'};
var LANGACE={us:'en-US',uk:'en-GB',au:'en-AU',in:'en-IN'};
function deletrear(t){
  return String(t||'').toUpperCase().split('').join(', ');
}
function mezclar(a){
  for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}
  return a;
}
function normal(t){
  return String(t||'').toLowerCase().replace(/[.,!?;:'"]/g,'').replace(/\s+/g,' ').trim();
}
function clave(t){
  return String(t).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
}
var AUDIO_ACTUAL=null;
var TURNO=0;   // cada vez que se calla todo, cambia el turno.
               // Lo que venga del servidor con un turno viejo se descarta.
function callarTodo(){
  TURNO++;
  try{speechSynthesis.cancel();}catch(e){}
  if(AUDIO_ACTUAL){
    try{
      AUDIO_ACTUAL.onended=null;AUDIO_ACTUAL.onerror=null;AUDIO_ACTUAL.oncanplaythrough=null;
      AUDIO_ACTUAL.pause();AUDIO_ACTUAL.currentTime=0;
    }catch(e){}
    AUDIO_ACTUAL=null;
  }
}
// Se separa "el archivo no existe" de "el navegador no me dejó sonar".
// Antes se confundían y un bloqueo momentáneo dejaba la frase en voz genérica
// para el resto de la sesión.
function reproducir(url,onOk,onNoExiste,onBloqueado,vel){
  callarTodo();
  var miTurno=TURNO;
  var a=new Audio();
  a.preload='auto';
  // La velocidad se ajusta aquí: un solo archivo sirve para todas.
  // preservesPitch evita que suene a caricatura al bajarle.
  // vel = lo que pidió el botón "Más lento" para ESTA frase.
  // VEL_AUDIO = la preferencia general del alumno, de sus ajustes.
  // Antes solo se miraba la preferencia general, y por eso el botón de
  // "Más lento" no hacía nada: mandaba el dato al servidor de voz, que
  // lo ignora y devuelve exactamente el mismo audio.
  try{
    a.playbackRate=(vel||VEL_AUDIO);
    if('preservesPitch' in a)a.preservesPitch=true;
    if('mozPreservesPitch' in a)a.mozPreservesPitch=true;
    if('webkitPreservesPitch' in a)a.webkitPreservesPitch=true;
  }catch(e){}
  var resuelto=false;
  a.oncanplaythrough=function(){
    if(resuelto)return;resuelto=true;
    if(miTurno!==TURNO)return;   // llegó tarde
    AUDIO_ACTUAL=a;
    marcarCargando(false);   // ya está sonando: se quita el aviso del botón
    a.onended=function(){onOk&&onOk();};
    var p=a.play();
    if(p&&p.catch)p.catch(function(){
      // existe, pero no se pudo reproducir: no se marca como faltante
      onBloqueado&&onBloqueado();
    });
  };
  a.onerror=function(){
    if(resuelto)return;resuelto=true;
    onNoExiste&&onNoExiste();
  };
  a.src=url;
  try{a.load();}catch(e){if(!resuelto){resuelto=true;onNoExiste&&onNoExiste();}}
  return a;
}

function nombresPosibles(texto,archivo){
  // el mismo audio puede estar con nombre corto (es-01) o largo (la frase entera)
  var n=[];
  if(archivo)n.push(archivo);
  var k=clave(texto);
  if(n.indexOf(k)<0)n.push(k);
  return n;
}
// pide el audio al servidor y lo reproduce; se guarda para no volver a pedirlo
var VOZ_CACHE={};
// Hombre o mujer según la frase, siempre igual para la misma frase.
// Así no suena todo con la misma voz, pero tampoco cambia cada vez.
// Antes la voz se sorteaba con un hash: "My name is Sarah" podía salir con
// voz de hombre. Ahora se lee la frase: si hay un nombre o un pronombre,
// manda eso. Solo si no hay ninguna pista se recurre al sorteo.
var NOM_F=('sarah maria maría ana laura karen lucia lucía sofia sofía elena julia rosa carmen diana '+
  'patricia claudia veronica verónica alejandra gabriela mariana andrea paola daniela fernanda '+
  'emily emma olivia sophia isabella mia charlotte amelia harper evelyn abigail lisa mary jennifer '+
  'linda susan jessica karla brenda mónica monica silvia norma leticia guadalupe alma').split(' ');
var NOM_M=('carlos juan jose josé luis miguel jorge pedro antonio manuel francisco javier ricardo '+
  'roberto fernando alberto raul raúl sergio hector héctor arturo eduardo martin martín pablo '+
  'james john robert michael william david richard joseph thomas charles daniel matthew mark paul '+
  'steven andrew kevin brian george edward samuel oscar óscar rafael victor víctor').split(' ');

function sexoDeLaFrase(t){
  var x=' '+String(t).toLowerCase().replace(/[^a-záéíóúñ ]/g,' ')+' ';
  // pronombres y tratamientos: mandan sobre todo lo demás
  if(/ (she|her|hers|ms|mrs|miss|ella|señora|señorita|sra) /.test(x))return 'f';
  if(/ (he|him|his|mr|sir|el señor|señor|sr) /.test(x))return 'm';
  // un nombre reconocido
  for(var i=0;i<NOM_F.length;i++)if(x.indexOf(' '+NOM_F[i]+' ')>=0)return 'f';
  for(var j=0;j<NOM_M.length;j++)if(x.indexOf(' '+NOM_M[j]+' ')>=0)return 'm';
  // si la frase es del propio alumno, su voz es la que él escogió
  if(/ (my name is|i am|i'm|soy|me llamo) /.test(x)){
    var a=(progreso().avatar)||{};
    if(a.sexo)return a.sexo==='m'?'f':'m';
  }
  var n=0;
  for(var k=0;k<x.length;k++)n+=x.charCodeAt(k);
  return (n%2===0)?'f':'m';
}
function vozDelServidor(texto,lang,cb,onFalla){
  if(!VOZ_ENDPOINT){onFalla&&onFalla();return;}
  var miTurno=TURNO;
  // Se toma ya, porque la respuesta del servidor llega después.
  var vel=VEL_PEDIDA;
  // Ojo: la velocidad NO va en la llave. El servidor devuelve el mismo audio
  // pida lo que pida, así que se guarda una sola vez y se reproduce más
  // despacio aquí. Antes se guardaba aparte y se gastaba una llamada de balde.
  var k=clave(texto)+'|'+(PAQUETE_ACTIVO||'audio-us')+'|'+sexoDeLaFrase(texto);

  if(VOZ_CACHE[k]){
    if(miTurno!==TURNO)return;
    reproducir(VOZ_CACHE[k],function(){cb&&cb();},function(){onFalla&&onFalla();},function(){cb&&cb();},vel);
    return;
  }
  fetch(VOZ_ENDPOINT,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({texto:texto,idioma:(lang==='es-MX'?'es':'en'),
      paquete:PAQUETE_ACTIVO||'audio-us',sexo:sexoDeLaFrase(texto)})})
    .then(function(r){return r.ok?r.json():null;})
    .then(function(d){
      if(!d||!d.ok||!d.audio){delete VOZ_CACHE[k];onFalla&&onFalla();return;}
      var url='data:audio/mpeg;base64,'+d.audio;
      VOZ_CACHE[k]=url;
      if(miTurno!==TURNO)return;   // ya cambió de pantalla: no suena
      reproducir(url,function(){cb&&cb();},function(){onFalla&&onFalla();},function(){cb&&cb();},vel);
    })
    .catch(function(){delete VOZ_CACHE[k];onFalla&&onFalla();});   // reintentable
}

/* ═══ precarga ═══
   La causa real de que el audio llegara tarde: cada frase se pedía al servidor
   apenas se tocaba el botón, y Apps Script tarda 1-3 segundos en responder.
   Ahora las frases de la pantalla se piden desde que la pantalla se dibuja,
   una por una y sin sonar. Cuando el alumno toca, ya están en memoria. */
var VEL_PEDIDA=null;
var PRECARGANDO=false;
function precargarVoz(texto,lang,listo){
  if(!VOZ_ENDPOINT||!texto){listo&&listo();return;}
  var k=clave(texto)+'|'+(PAQUETE_ACTIVO||'audio-us')+'|'+sexoDeLaFrase(texto);
  if(VOZ_CACHE[k]){listo&&listo();return;}   // ya la tenemos
  fetch(VOZ_ENDPOINT,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({texto:texto,idioma:(lang==='es-MX'?'es':'en'),
      paquete:PAQUETE_ACTIVO||'audio-us',sexo:sexoDeLaFrase(texto)})})
    .then(function(r){return r.ok?r.json():null;})
    .then(function(d){
      if(d&&d.ok&&d.audio)VOZ_CACHE[k]='data:audio/mpeg;base64,'+d.audio;
      listo&&listo();
    })
    .catch(function(){listo&&listo();});
}
// de una en una: si se piden 12 de golpe, Apps Script las encola y tarda más
function precargarLista(frases){
  if(!frases||!frases.length||PRECARGANDO)return;
  PRECARGANDO=true;
  var i=0;
  (function siguiente(){
    if(i>=frases.length){PRECARGANDO=false;return;}
    var f=frases[i++];
    var texto=(typeof f==='string')?f:(f&&(f.en||f.texto||f.q));
    var lang=(typeof f==='object'&&f&&f.lang)?f.lang:'en-US';
    if(!texto){siguiente();return;}
    precargarVoz(texto,lang,siguiente);
  })();
}

/* El botón no puede sentirse muerto mientras baja el audio. */
var BOTON_ULTIMO=null;
document.addEventListener('click',function(e){
  var b=e.target&&e.target.closest&&e.target.closest('button');
  if(b)BOTON_ULTIMO=b;
},true);
function marcarCargando(si){
  var b=BOTON_ULTIMO;
  if(!b)return;
  if(si){b.classList.add('cargando-audio');
    setTimeout(function(){b.classList.remove('cargando-audio');},6000);}
  else b.classList.remove('cargando-audio');
}

/* SOLO GOOGLE. Antes la app buscaba primero una grabacion de Brian en las
   carpetas de audio y solo despues le pedia la voz al servidor. Eso hacia
   dos cosas malas: sonaba disparejo (unas frases con su voz, otras con la
   de Google) y cada frase sin grabar gastaba varios intentos fallidos
   antes de rendirse, que es parte de por que iba lento.
   Ahora se va derecho al servidor de Google, siempre. */
var SOLO_GOOGLE=true;

var SIN_PAQUETE_LOCAL=false;   // se aprende a la primera y ya no se insiste
function decirConTuVoz(texto,lang,cb,archivo){
  if(SOLO_GOOGLE){
    vozDelServidor(texto,lang,cb,function(){avisoDeAudio();cb&&cb();});
    return;
  }
  // si ya se comprobó que no hay grabaciones locales, se va directo al servidor
  if(SIN_PAQUETE_LOCAL){
    vozDelServidor(texto,lang,cb,function(){avisoDeAudio();cb&&cb();});
    return;
  }
  var nombres=nombresPosibles(texto,archivo);
  if(nombres.every(function(k){return AUDIO_FALLA[k];})){
    vozDelServidor(texto,lang,cb,function(){avisoDeAudio();cb&&cb();});return;
  }
  var combos=[];
  nombres.forEach(function(k){
    (AUDIO_RUTA!==null?[AUDIO_RUTA]:RUTAS).forEach(function(r){
      EXT.forEach(function(e){combos.push({url:r+k+e,k:k,r:r});});
    });
  });
  var n=0;
  (function intenta(){
    if(n>=combos.length){
      nombres.forEach(function(k){AUDIO_FALLA[k]=1;});
      if(AUDIO_HAY===0)SIN_PAQUETE_LOCAL=true;   // no hay paquete: no volver a probar
      vozDelServidor(texto,lang,cb,function(){avisoDeAudio();cb&&cb();});
      return;
    }
    var c=combos[n++];
    reproducir(c.url,
      function(){AUDIO_RUTA=c.r;AUDIO_HAY++;cb&&cb();},   // sonó
      intenta,                                            // no existe: siguiente
      function(){AUDIO_RUTA=c.r;cb&&cb();},               // existe pero bloqueado: no se marca
      VEL_PEDIDA
    );
  })();
}
// El silencio era el peor error: parecía que el botón no servía.
// Si el audio no se pudo traer, se dice en pantalla, con el porqué.
var AVISO_AUDIO_DADO=false;
function avisoDeAudio(){
  if(AVISO_AUDIO_DADO)return;
  AVISO_AUDIO_DADO=true;
  if(!VOZ_ENDPOINT){
    avisito('No hay voz configurada todavía. Avísale a Brian: falta pegar la dirección del servidor de voz.');
  }else{
    avisito('No pude traer el audio. Revisa tu internet y vuelve a tocar el botón.');
  }
}
// habla siempre con la voz del navegador, sin buscar grabación
function say2(t,lang,cb){
  callarTodo();
  if(!VOZ_SINTETICA){cb&&cb();return;}   // silencio, nunca voz robótica
  if(!('speechSynthesis' in window)){cb&&cb();return;}
  try{hablar(t,lang,cb);}catch(e){cb&&cb();}
}
// comprueba si existe una grabación, sin reproducirla
function buscarGrabacion(nombre,cb){
  if(SOLO_GOOGLE){ cb(false); return; }   // ya no hay grabaciones que buscar
  var combos=[];
  RUTAS.forEach(function(r){EXT.forEach(function(e){combos.push([r,r+nombre+e]);});});
  var n=0;
  (function intenta(){
    if(n>=combos.length){cb(false);return;}
    var par=combos[n++];
    var a=new Audio(par[1]);
    a.oncanplaythrough=function(){AUDIO_RUTA=par[0];cb(true,par[0]);};
    a.onerror=intenta;
    a.load();
  })();
}


// Antes: si no habia grabacion, nadie hablaba. Ahora Google la dice.
function soloTuVoz(texto,cb,archivo){
  if(SOLO_GOOGLE){
    vozDelServidor(texto,'en-US',function(){cb&&cb(true);},function(){cb&&cb(false);});
    return;
  }
  var nombres=nombresPosibles(texto,archivo);
  if(nombres.every(function(k){return AUDIO_FALLA[k];})){cb&&cb(false);return;}
  var combos=[];
  nombres.forEach(function(k){
    (AUDIO_RUTA!==null?[AUDIO_RUTA]:RUTAS).forEach(function(r){
      EXT.forEach(function(e){combos.push({url:r+k+e,r:r});});
    });
  });
  var n=0;
  (function intenta(){
    if(n>=combos.length){
      nombres.forEach(function(k){AUDIO_FALLA[k]=1;});
      vozDelServidor(texto,'en-US',function(){cb&&cb(true);},function(){cb&&cb(false);});
      return;
    }
    var c=combos[n++];
    reproducir(c.url,
      function(){AUDIO_RUTA=c.r;cb&&cb(true);},
      intenta,
      function(){AUDIO_RUTA=c.r;cb&&cb(true);}
    );
  })();
}

/* ═══════════ voz: escuchar ═══════════ */
var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
var EN_MARCO=(function(){try{return window.self!==window.top;}catch(e){return true;}})();
var SEGURO=(window.isSecureContext!==false)&&location.protocol!=='file:';
var HAY_MIC=!!SR;

// por qué no va a abrir el micrófono, en palabras que se entiendan
function diagnostico(){
  if(!SR)return {ok:false,corto:'Este navegador no reconoce voz',
    largo:'Este navegador no transcribe lo que dices. Practicas igual en voz alta: hablas, y luego escribes lo que dijiste para revisarlo.'};
  if(EN_MARCO)return {ok:false,corto:'Estás viéndolo dentro de una vista previa',
    largo:'El micrófono solo abre cuando la página está en su propia pestaña. Copia el enlace y ábrelo directo.'};
  if(!SEGURO)return {ok:false,corto:'La página no está en https',
    largo:'Abierta como archivo suelto, el navegador no da acceso al micrófono. Con el enlace del servidor sí funciona.'};
  return {ok:true};
}
/* ── Escuchar CON PACIENCIA ──
   Antes el microfono se apagaba en el primer silencio: el alumno pensaba
   tantito a media frase y se le cortaba. Un adulto aprendiendo se detiene
   a buscar la palabra; eso es normal y no debe castigarse.
   Ahora:
   - aguanta los silencios y va juntando lo que dice por pedazos
   - espera MAS al principio (todavia no empieza a hablar, esta pensando)
     y MENOS despues de que ya dijo algo (ahi si, ya acabo)
   - se corta sola a los 45 segundos para no quedarse abierta
   - si el navegador la cierra sola, se vuelve a abrir sin que se note */
var ESPERA_ANTES = 10000;  // pensando antes de soltar la primera palabra
var ESPERA_DESPUES = 2600; // pausa despues de haber dicho algo = ya acabo
var ESPERA_TRABADO = 4200; // se trabo: se le da mas aire antes de cortarlo
var ESPERA_INCOMPLETO = 3800; // dijo menos de lo que se le pidio: aun no acaba

/* Ruiditos que NO son la frase: duda, muletilla, tos. Si lo ultimo que se
   oyo es uno de estos, el alumno NO termino — se esta trabando. Cortarlo
   ahi es el error que mas mata una app de hablado. */
var MULETILLAS=['uh','uhh','um','umm','erm','er','eh','ehh','mm','mmm','hmm',
  'ah','ahh','este','esteee','mmhm','ehm'];

/* Palabras que casi nunca cierran una frase. Si lo ultimo que dijo es una
   de estas, todavia viene algo: se le espera. NO significa que se trabo,
   por eso va aparte — "a" o "the" son palabras de verdad. */
var COLGADAS=['a','an','the','my','your','his','her','to','in','on','at','of',
  'and','or','but','with','for','is','are','am','i'];
function quedaColgado(t){
  var u=ultimaPalabra(t).toLowerCase().replace(/[^a-z']/g,'');
  return COLGADAS.indexOf(u)>=0;
}
function esMuletilla(p){
  p=String(p||'').toLowerCase().replace(/[^a-záéíóúñ ]/g,'').trim();
  return MULETILLAS.indexOf(p)>=0;
}
function ultimaPalabra(t){
  var p=String(t||'').trim().split(/\s+/);
  return p.length?p[p.length-1]:'';
}
// "I I I work" o "wor- work": el mismo arranque repetido = tartamudeo
// ¿Se esta trabando AHORITA? Mira el final: sirve para decidir cuanto
// silencio aguantar antes de cortarlo.
function seTrabo(t){
  var p=String(t||'').toLowerCase().replace(/[^a-z' ]/g,'').trim().split(/\s+/).filter(Boolean);
  if(!p.length)return false;
  if(esMuletilla(p[p.length-1]))return true;
  return parTrabado(p,p.length-1);
}
// ¿Se trabo en algun momento? Mira toda la frase: sirve para decirle
// "se te trabo" en vez de marcarle un error que no cometio.
function huboTrabon(t){
  var p=String(t||'').toLowerCase().replace(/[^a-z' ]/g,'').trim().split(/\s+/).filter(Boolean);
  for(var i=0;i<p.length;i++){
    if(esMuletilla(p[i]))return true;
    if(parTrabado(p,i))return true;
  }
  return false;
}
function parTrabado(p,i){
  if(i<1)return false;
  if(p[i]===p[i-1])return true;                       // "I I"
  if(p[i-1].length>=3 && p[i]!==p[i-1] &&
     p[i].indexOf(p[i-1].slice(0,3))===0)return true; // "wor- work"
  return false;
}
function cuantasPalabras(t){
  return String(t||'').trim().split(/\s+/).filter(Boolean).length;
}
var TOPE_TOTAL = 45000;

/* listen(idioma, cuandoTermine, cuandoFalle, opciones)
   opciones.meta = la frase que se le pidio decir. Con eso el micrófono
   sabe cuanto falta y tiene la paciencia justa.
   cuandoTermine(texto, confianza, extra) — extra.alternativas trae las
   otras versiones que entendio el navegador, que sirven para no marcarle
   error a alguien que en realidad si lo dijo bien. */
function listen(lang,onDone,onErr,ops){
  if(!SR){onErr&&onErr('sin-soporte');return null;}
  try{ callarTodo(); }catch(e){}   // sin esto el micrófono oye a la app
  ops=ops||{};
  var meta=String(ops.meta||'');
  var palabrasMeta=cuantasPalabras(meta);

  var r=new SR();
  r.lang=lang||'en-US';
  r.interimResults=true;      // para saber que sigue hablando
  r.continuous=true;          // que NO se apague al primer silencio
  // Varias versiones de lo mismo. El navegador suele acertar en la segunda
  // o la tercera cuando el acento es marcado; quedarse con la primera es
  // marcarle error a quien lo dijo bien.
  r.maxAlternatives=6;

  var firme='', confianza=0, terminado=false, cerrandoYo=false;
  var relojSilencio=null, relojTope=null, dijoAlgo=false;
  var ultimoSuelto='', alternativas=[], seTraboAlguna=false, reaperturas=0;

  function acabar(){
    if(terminado)return;
    terminado=true;
    clearTimeout(relojSilencio); clearTimeout(relojTope);
    cerrandoYo=true;
    try{ r.stop(); }catch(e){}
    var t=(firme.trim()||ultimoSuelto.trim());
    if(t) onDone(t, confianza||0.9, {alternativas:alternativas.slice(), trabado:seTraboAlguna});
    else   onErr&&onErr('no-speech');
  }

  /* Cuanto silencio se aguanta antes de dar por terminado.
     No es un numero fijo: depende de si se trabo y de cuanto le falta. */
  function cuantoEsperar(){
    if(!dijoAlgo) return ESPERA_ANTES;
    var hastaAhora=(firme+' '+ultimoSuelto);
    if(seTrabo(hastaAhora)) return ESPERA_TRABADO;
    if(quedaColgado(hastaAhora)) return ESPERA_INCOMPLETO;   // "I am a..." sigue
    if(palabrasMeta>2 && cuantasPalabras(hastaAhora) < palabrasMeta*0.7)
      return ESPERA_INCOMPLETO;    // dijo la mitad: seguro sigue
    return ESPERA_DESPUES;
  }
  function reiniciarEspera(){
    clearTimeout(relojSilencio);
    relojSilencio=setTimeout(acabar, cuantoEsperar());
  }

  r.onresult=function(e){
    var suelto='';
    for(var i=e.resultIndex;i<e.results.length;i++){
      var res=e.results[i];
      if(res.isFinal){
        var mejor=res[0].transcript.trim();
        // Un ruidito suelto y con poca confianza no es lo que dijo: es
        // el ventilador, un carro, alguien tosiendo. No se anota.
        var basura = mejor && cuantasPalabras(mejor)<=1 && esMuletilla(mejor) &&
                     (res[0].confidence||1) < 0.55;
        // Si lo que llega es exactamente lo que ya se tenia (el navegador
        // reentrego el mismo final tras reabrir), no se pega dos veces.
        var yaEstaba = mejor && (firme===mejor ||
          firme.slice(-mejor.length-1)===(' '+mejor) || firme.slice(-mejor.length)===mejor);
        if(!basura && mejor && !yaEstaba){
          firme += (firme?' ':'') + mejor;
          if(res[0].confidence) confianza=res[0].confidence;
          for(var a=0;a<res.length;a++){
            var alt=(res[a].transcript||'').trim();
            if(alt && alternativas.indexOf(alt)<0) alternativas.push(alt);
          }
        }
      } else {
        suelto += res[0].transcript;
      }
    }
    if(suelto.trim()) ultimoSuelto=suelto;
    if(firme.trim()||suelto.trim())dijoAlgo=true;
    if(huboTrabon(firme+' '+suelto)) seTraboAlguna=true;
    reiniciarEspera();
  };

  // que hable no es lo mismo que entenderle: si detecta voz, sigue esperando
  r.onspeechstart=function(){ dijoAlgo=true; reiniciarEspera(); };
  r.onaudiostart =function(){ reiniciarEspera(); };

  r.onerror=function(e){
    var cual=e&&e.error;
    // "no-speech" y "aborted" no son fallas: es que todavia no habla
    if(cual==='no-speech'||cual==='aborted'){ return; }
    if(terminado)return;
    terminado=true;
    clearTimeout(relojSilencio); clearTimeout(relojTope);
    onErr&&onErr(cual||'error');
  };

  /* Chrome cierra el microfono solo cada cierto rato, aunque le pidamos
     continuo. Si eso pasa y el alumno no ha terminado, se reabre calladito. */
  r.onend=function(){
    if(terminado||cerrandoYo)return;
    // Chrome cierra el micrófono cada tanto. Si lo que lleva dicho todavia
    // no alcanza para la frase que se le pidio, se reabre y se le sigue
    // escuchando: lo que ya dijo NO se pierde, se le va sumando.
    if(reaperturas<4){
      reaperturas++;
      try{ r.start(); reiniciarEspera(); return; }catch(e){}
    }
    acabar();
  };

  try{
    r.start();
    reiniciarEspera();
    relojTope=setTimeout(acabar, TOPE_TOTAL);
  }catch(x){ onErr&&onErr('no-inicio'); }

  // por si alguna pantalla quiere cortar antes ("ya terminé")
  r.terminar=acabar;
  return r;
}


/* ═══════════ grabar audio (respaldo para Android) ═══════════ */
// El reconocimiento de voz falla en muchos Android. La grabación no:
// se graba el audio, se guarda, y Brian lo escucha después.
var HAY_GRAB=!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder);
var grabadora=null,trozos=[],streamActivo=null;

function grabarInicio(onListo,onError){
  if(!HAY_GRAB){onError&&onError('sin-soporte');return;}
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(st){
    streamActivo=st;trozos=[];
    var tipo='';
    ['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg'].forEach(function(t){
      if(!tipo&&window.MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t))tipo=t;
    });
    grabadora=tipo?new MediaRecorder(st,{mimeType:tipo}):new MediaRecorder(st);
    grabadora.ondataavailable=function(e){if(e.data&&e.data.size)trozos.push(e.data);};
    grabadora.onstop=function(){
      var blob=new Blob(trozos,{type:grabadora.mimeType||'audio/webm'});
      if(streamActivo){streamActivo.getTracks().forEach(function(t){t.stop();});streamActivo=null;}
      onListo&&onListo(blob);
    };
    grabadora.start();
  }).catch(function(e){onError&&onError(e&&e.name||'error');});
}
function grabarFin(){
  try{if(grabadora&&grabadora.state!=='inactive')grabadora.stop();}catch(e){}
}
function blobABase64(blob,cb){
  var r=new FileReader();
  r.onloadend=function(){cb(String(r.result).split(',')[1]||'');};
  r.readAsDataURL(blob);
}

function buscarVisual_(texto,id){
  var k=clave(texto);
  if(IMG_FALLA[k])return;
  var combos=[];
  IMG_RUTAS.forEach(function(r){
    VID_EXT.forEach(function(e){combos.push({url:r+k+e,video:true});});
    IMG_EXT.forEach(function(e){combos.push({url:r+k+e,video:false});});
  });
  var n=0;
  (function intenta(){
    if(n>=combos.length){IMG_FALLA[k]=1;return;}
    var c=combos[n++];
    if(c.video){
      try{
        var v=document.createElement('video');
        if(typeof v.load!=='function'){intenta();return;}
        v.oncanplay=function(){poner(c,true);};
        v.onerror=intenta;
        v.src=c.url;v.load();
      }catch(e){intenta();}
    }else{
      var im=new Image();
      im.onload=function(){poner(c,false);};
      im.onerror=intenta;
      im.src=c.url;
    }
  })();
  function poner(c,esVideo){
    var caja=document.getElementById(id);
    if(!caja)return;
    caja.classList.add('con-medio');
    caja.innerHTML=esVideo
      ? '<video src="'+c.url+'" autoplay muted loop playsinline></video>'
      : '<img src="'+c.url+'" alt="">';
  }
}

/* ═══════════ comparar lo dicho con la meta ═══════════ */
function norm(s){return String(s).toLowerCase().replace(/[.,!?¿¡;:"']/g,'').replace(/\s+/g,' ').trim();}
function peso(w){return Math.max(1,w.length);}
function comparar(meta,oido){
  var m=norm(meta).split(' ').filter(Boolean), o=norm(oido).split(' ').filter(Boolean);
  var pool=o.slice(), marcas=m.map(function(w){
    var i=pool.indexOf(w);
    if(i>=0){pool.splice(i,1);return true;}
    return false;
  });
  // se pondera por largo de palabra: fallar "dentist" pesa más que comerse "a"
  var total=0,logrado=0;
  m.forEach(function(w,i){total+=peso(w);if(marcas[i])logrado+=peso(w);});
  return {pct:total?Math.round(logrado/total*100):0, marcas:marcas, palabras:m};
}
/* El navegador entrega varias versiones de lo que oyo. Se comparan todas
   contra la frase meta y se toma la que mejor embona. Alguien con acento
   marcado suele salir bien en la segunda o la tercera, y quedarse con la
   primera era marcarle un error que no cometio. */
function compararMejor(meta,oido,alternativas){
  var mejor=comparar(meta,oido); mejor.dicho=oido;
  (alternativas||[]).forEach(function(alt){
    var c=comparar(meta,alt);
    if(c.pct>mejor.pct){ c.dicho=alt; mejor=c; }
  });
  return mejor;
}

function pintar(meta,cmp){
  return cmp.palabras.map(function(w,i){
    return '<span class="'+(cmp.marcas[i]?'w-ok':'w-no')+'">'+esc(w)+'</span>';
  }).join(' ');
}

// OJO con el patron de cientos: solo corre de 1100 a 1900. Mil es
// "a thousand" y dos mil es "two thousand", nunca "ten hundred" ni
// "twenty hundred". Esa nota va escrita en el ejercicio para que nadie
// la enseñe mal.
function etiquetaNumero(){
  var n=(P&&P.nivel_n)||0;
  if(n<=0)return 'los que se oyen parecido';
  if(n===1)return 'los a\u00f1os';
  if(n===2)return 'cantidades grandes';
  if(n===3)return 'dinero y porcentajes';
  return 'cifras de reporte';
}

// Reglas que valen para todos los niveles: se le quita lo que todavia no le
// toca y se le mete lo que si.
function afinarPorNivel(mat,p){
  if(!mat||!mat.length)return mat;
  var n=(p&&p.nivel_n)||0;
  var nums=numerosDe(n), ni=0;
  mat.forEach(function(S,si){
    if(!S||!S.items||!S.items.length)return;
    // El habla libre es de B2 para arriba: abajo todavia no tienen con que
    // llenar un minuto solos, y se vuelve un silencio incomodo.
    if(n<4){
      var sinFree=S.items.filter(function(z){ return z.k!=='free'; });
      if(sinFree.length>=2) S.items=sinFree;
    }
    // Un numero cada dos sesiones, del tipo que toca a su nivel
    if(nums.length && si%2===1) S.items.push(nums[ni++ % nums.length]);
  });
  return mat;
}

// materialDe de verdad ahora pasa por el afinador. El molde de cada nivel
// sigue igual; lo que cambia es lo que se le quita y se le mete despues.
function materialDe(p){
  var m=materialDe_(p);
  try{ m=afinarPorNivel(m,p); }catch(e){}
  return m;
}
function materialDe_(p){
  var n=p.nivel_n||0;
  // --- C2 tiene su propio molde: registro, ironia, debate y sonar nativo ---
  if(n>=6 && typeof moldeC2==='function'){
    var mc=moldeC2(p);
    try{ mc = frasesDeBrian().concat(mc); }catch(e){}
    return mc;
  }
  // --- pre-A1 usa el molde nuevo de 3 areas (listening, gramatica, produccion) ---
  if(n===0 && typeof moldePreA1==='function'){
    var mp=moldePreA1(p);
    try{ mp = frasesDeBrian().concat(mp); }catch(e){}
    return mp;
  }
  function frase(t,pre){
    t=(t||'').trim();

  var trab=frase(p.trabajo_en&&p.trabajo_en.replace(/^I am /,''),'I am')||'I have a job.';
  var lug=frase(p.lugar_en&&p.lugar_en.replace(/^I work /,''),'I work')||'I work every day.';
  var acc=frase(p.accion_en)||'I work every day.';

  var gus=frase(p.gusto_en&&p.gusto_en.replace(/^I like /,''),'I like')||'I like my family.';
  var met=frase(p.meta_en&&p.meta_en.replace(/^I study English /,''),'I study English')||'I study English for my job.';

  var base=[

       {k:'ask',q:'What is your name?',es:'¿Cómo te llamas? Contesta con la primera frase.',pista:yo},
       {k:'ask',q:'What do you do?',es:'¿A qué te dedicas?',pista:trab},
       {k:'free',q:'Tell me about you.',es:'Dime quién eres. Todo lo que puedas.'}
     ]},
    {t:'Lo que haces todos los días', hoy:'aprendemos a contar tu rutina',
     obj:'Contar qué haces y a qué hora empiezas, contestando en voz alta.',
     tip:'Si algo no te sale a la primera, dilo otra vez. Nadie te está calificando el intento.',
     enc:'Ahora tu rutina. Vamos a usar lo de ayer y le sumamos lo que haces y a qué hora.',
     items:[
       {k:'model',en:acc,es:p.accion_es.charAt(0).toUpperCase()+p.accion_es.slice(1)+'.'},
       {k:'model',en:hor,es:'Empiezo a las '+p.hora_es+'.'},
       {k:'model',en:'I work every day.',es:'Trabajo todos los días.'},
       {k:'ask',q:'What do you do every day?',es:'¿Qué haces todos los días?',pista:acc},
       {k:'ask',q:'What time do you start?',es:'¿A qué hora empiezas?',pista:hor},
       {k:'free',q:'Tell me about your day.',es:'Cuéntame tu día.'}
     ]},
    {t:'Conversación: que te pregunten', hoy:'practicamos contestar preguntas',
     obj:'Contestar cinco preguntas sin ver el texto, y hacer una pregunta tú.',
     tip:'Esta es la más parecida a una conversación real. Va a costar más, y eso está bien.',
     enc:'Hoy es puro contestar. Yo pregunto, tú respondes en voz alta. Si no sale, pides la pista y ya.',
     items:[
       {k:'model',en:'Nice to meet you.',es:'Mucho gusto.'},
       {k:'model',en:'And you?',es:'¿Y tú?'},
       {k:'ask',q:'Hello! What is your name?',es:'Salúdame y di tu nombre.',pista:yo},
       {k:'ask',q:'Where do you work?',es:'¿Dónde trabajas?',pista:lug},
       {k:'ask',q:'What time do you start?',es:'¿A qué hora entras?',pista:hor},
       {k:'ask',q:'Do you work every day?',es:'Contesta: Yes, I do. / No, I do not.',pista:'Yes, I do.'},
       {k:'free',q:'Now ask me a question.',es:'Ahora pregúntame tú algo a mí. Lo que sea.'}
     ]},
    {t:'Lo que te gusta', hoy:'aprendemos a dar tu opinión',
     obj:'Decir qué te gusta y para qué quieres el inglés, con tus palabras.',
     tip:'Aquí no hay respuesta correcta. Lo que digas es tuyo.',
     enc:'Hoy opiniones. Es donde deja de sonar a repetir frases y empieza a sonar a tú.',
     items:[
       {k:'model',en:gus,es:'Me gusta '+p.gusto_es+'.'},
       {k:'model',en:met,es:'Estudio inglés '+p.meta_es+'.'},
       {k:'model',en:'It is difficult, but I like it.',es:'Es difícil, pero me gusta.'},
       {k:'ask',q:'What do you like?',es:'¿Qué te gusta?',pista:gus},
       {k:'ask',q:'Why do you study English?',es:'¿Para qué estudias inglés?',pista:met},
       {k:'free',q:'Tell me what you like and why.',es:'Dime qué te gusta y por qué.'}
     ]},
    {t:'Repaso · la misma pregunta del día uno', hoy:'repasamos todo lo que ya sabes',

  // el nivel decide cuánto modelo se da y qué tanto se le exige
  return base.map(function(ses,idx){
    var mods=ses.items.filter(function(x){return x.k==='model';});

    var it;
    if(n===0){            // Pre-A1: máximo 3 frases modelo
      it=mods.slice(0,3).concat(resto);
    }else if(n===1){      // A1: como está

    }else{                // A2 o más: menos repetir, más hablar
      it=mods.slice(0,2).concat(resto);
      it.push({k:'free',q:'Tell me more. Why?',es:'Explícame por qué. Alárgate más que en la respuesta anterior.'});

    var sits=[];
    // una serie de cambios sobre la primera frase modelo de la sesión
    var mods=it.filter(function(x){return x.k==='model';});

    });

    var cuantos = n<=0 ? 2 : 3;
    var libres=[];
    turnos.slice(0,cuantos).forEach(function(t){
      libres.push({k:'sit',ctx:t.ctx,q:t.dice,es:t.pide,pista:''});

    });

    // primero lo que falló ayer, luego lo nuevo
    it=frasesDeBrian().concat(tocaHoy(3)).concat(resto2).concat(sits).concat(libres);
    return {t:ses.t,hoy:ses.hoy,obj:ses.obj,tip:ses.tip,enc:ses.enc,items:it};
  });
}

/* ── RESCATE de alumnos viejos ──
   Quien entro hace meses trae datos con la forma antigua: progreso de un
   mapa de 70 paradas, avatar, etc. El mapa de hoy tiene 28: si lo dejamos
   pasar con "parada 53 guardada" se traba y NO PUEDE ENTRAR.
   Esto NO borra al alumno: rescata su nombre, su trabajo y su nivel, y
   tira solo lo que ya no cuadra (el camino/progreso viejo). Es una mudanza,
   no un incendio. Corre una sola vez por alumno. */
(function rescatarSiEsViejo(){
  try{
    var d=load(); if(!d) return;
    if(d.esquema===3) return;              // ya migrado, no volver a tocar

    var razones=[];
    // 1. progreso apuntando fuera del mapa nuevo (28 paradas)
    if(d.camino && (d.camino.parada>28 || d.camino.maxima>28)) razones.push('parada fuera de rango');
    // 2. estructura vieja del avatar/monito que ya no existe
    if(d.camino && d.camino.avatar && (d.camino.avatar.cara||d.camino.avatar.cuerpo)) razones.push('avatar viejo');
    /* OJO: "no trae sello" NO es motivo suficiente. Todos los alumnos de
       antes de hoy vienen sin sello, y si eso bastara les borrariamos el
       avance a todos, incluidos los que estan al corriente. Solo se migra
       cuando algo de verdad no cuadra con el mapa nuevo. */

    if(razones.length){
      var salvado = {
        perfil: d.perfil || null,          // nombre, trabajo, nivel: se quedan
        preferencias: d.preferencias || d.prefs || null,
        paquete: d.paquete,                // la voz elegida
        probado: d.probado,
        tutorVisto: d.tutorVisto,
        fotoPreguntada: d.fotoPreguntada,
        esquema: 3
      };
      // el camino viejo se tira: se reconstruye limpio a partir del nivel
      save(salvado);
      try{ console.log('EFA: alumno migrado ('+razones.join(', ')+'). Perfil conservado.'); }catch(e){}
    } else {
      // esta al dia: solo se le pone el sello para no revisarlo cada vez
      d.esquema=3; save(d);
    }
  }catch(e){ try{ console.warn('EFA: no pude migrar, sigo igual', e); }catch(_){} }
})();

  }
}

      if(!MAT||!MAT.length){ avisito('Primero arma material desde el menú jefe.'); return; }

      if(a==='atras'){ it--; if(it<0){it=Math.max(0,(MAT[sIdx].items||[]).length-1);} paso(); }

  });
