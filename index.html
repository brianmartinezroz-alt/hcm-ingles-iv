// El 3D tarda un momento en descomprimirse. Si la pantalla del mapa se pintó
// antes, se quedaba con el tablero viejo para siempre. Ahora, en cuanto el 3D
// está listo, se repinta solo.
window.EFA_alMontar=function(){
  try{
    if(MAPA3D_APAGADO)return;
    var enMapa = APP && (APP.querySelector('.mapcab') || APP.querySelector('#tablero') ||
                         APP.querySelector('.lienzo3d'));
    if(enMapa) mapa();
  }catch(e){}
};

function zonasDelNivel(){
  var n=(P&&P.nivel)||'Pre-A1';
  return ZONAS_NIVEL[n]||ZONAS_NIVEL['Pre-A1'];
}

/* Al irse a una leccion hay que SOLTAR el mapa. Antes se quedaba
   dibujando contra un lienzo que ya nadie veia y el telefono se
   arrastraba. */
function soltarMapa(){
  try{ if(MAPA3D&&MAPA3D.dispose)MAPA3D.dispose(); }catch(e){}
  MAPA3D=null;
  // Al salir del mapa se acaba la visita: nadie se queda atrapado viendo
  // un nivel que no es el suyo.
  VISITANDO=null; MAPA_NIVEL_FORZADO=''; MAT_VISITA=null;
  var v=document.getElementById('visitabarra');
  if(v&&v.remove)v.remove();
}

/* Que tema de mapa toca. Usa el mismo nombre de nivel que las zonas
   ('Pre-A1', 'A1'...), y el mapa lo normaliza por si viene con otra
   mayuscula. Si el jefe anda curioseando otro nivel, manda ese. */
function nivelDelMapa(){
  try{ if(typeof MAPA_NIVEL_FORZADO==='string'&&MAPA_NIVEL_FORZADO)
         return MAPA_NIVEL_FORZADO; }catch(e){}
  return (P&&P.nivel)||'Pre-A1';
}
var MAPA_NIVEL_FORZADO='';

/* ═══════════ mirar otros niveles ═══════════
   Regla que puso Brian:
     · Un nivel IGUAL O MÁS ABAJO que el tuyo se puede estudiar de verdad.
       Alguien de B2 puede regresar a repasar A1 cuando quiera.
     · Un nivel MÁS ARRIBA solo se puede MIRAR: se ve el mapa y, al tocar
       una parada, se abre la ventanita con el vocabulario y la gramática
       que toca ahí. Pero no se practica.
   Ver lo que viene motiva; practicarlo antes de tiempo, no.                */
var VISITANDO=null;    // nivel que se está mirando sin poder practicarlo
var MAT_VISITA=null;   // el material de ESE nivel, solo para la ventanita

function nOrden(nv){
  return ({'Pre-A1':0,'A1':1,'A2':2,'B1':3,'B2':4,'C1':5,'C2':6})[nv]||0;
}

// Una copia del perfil del alumno pero con otro nivel, para sacar el
// material de ESE nivel sin tocar el suyo.
function perfilDeNivel(nv){
  var falso={}; for(var k in P)falso[k]=P[k];
  falso.nivel=nv; falso.nivel_n=nOrden(nv);
  return falso;
}

function visitarNivel(nv){
  VISITANDO=nv;
  MAPA_NIVEL_FORZADO=nv;     // el mapa y los colores se pintan de ese nivel
  MAT_VISITA=null;
  try{ MAT_VISITA=materialDe(perfilDeNivel(nv)); }catch(e){ MAT_VISITA=null; }
  mapa();
}

function volverAMiNivel(){
  VISITANDO=null; MAPA_NIVEL_FORZADO=''; MAT_VISITA=null;
  try{ if(P)MAT=materialDe(P); }catch(e){}
  mapa();
}

// La barrita que le recuerda que solo está de visita.
function avisoDeVisita(){
  var v=document.getElementById('visitabarra');
  if(v&&v.remove)v.remove();
  if(!VISITANDO)return;
  var d=document.createElement('div');
  d.id='visitabarra'; d.className='visitabarra';
  d.innerHTML='<span>Estás viendo <b>'+esc(VISITANDO)+'</b>. '+
    'Aquí solo puedes asomarte a lo que viene.</span>'+
    '<button id="visitasalir">Volver a lo mío</button>';
  document.body.appendChild(d);
  var b=document.getElementById('visitasalir');
  if(b)b.onclick=function(e){ e.stopPropagation(); volverAMiNivel(); };
}

// Le pone al body la etiqueta del nivel para que el CSS de arriba cambie el
// color de los botones. Se llama al entrar y cada vez que se pinta el mapa.
function pintarColorDelNivel(){
  try{
    var cod=String(nivelDelMapa()||'Pre-A1').toLowerCase().replace(/\s+/g,'');
    var buenos={'pre-a1':1,'a1':1,'a2':1,'b1':1,'b2':1,'c1':1,'c2':1};
    if(!buenos[cod])cod='pre-a1';
    document.body.setAttribute('data-nv',cod);
  }catch(e){}
}

function montarMapa3D(host,c){
  if(MAPA3D_APAGADO)return false;
  var M=window.EFA_MAPA3D;
  if(!M||!M.listo||!M.crear)return false;
  try{
    if(MAPA3D&&MAPA3D.dispose)MAPA3D.dispose();
    // El mapa fija su propio tamaño y maneja su propio scroll. Hay que
    // pasarle las medidas reales de la pantalla, no dejarlo en 390x844.
    var an=Math.max(280, host.clientWidth  || window.innerWidth  || 390);
    var al=Math.max(360, host.clientHeight || window.innerHeight || 844);
    MAPA3D=M.crear(host,{
      totalStops:PARADAS,
      currentStop:Math.max(0,(c.parada||1)-1),
      zones:zonasDelNivel(),
      width:Math.round(an),
      height:Math.round(al),
      reviewEvery:7,
      examEvery:14,
      /* El fondo ya NO se fuerza desde aqui: cada nivel trae el suyo, y si
         se lo imponemos todos los mapas vuelven a verse iguales. */
      nivel:nivelDelMapa(),
      onSelect:function(i,info){
        var n=i+1;
        try{
          if(JEFE_LIBRE){ irALeccionDe(n); return; }
          asomarseALeccion(n,c.parada);
        }catch(e){ avisito('Parada '+n); }
      }
    });
    if(!MAPA3D)return false;
    return true;
  }catch(e){
    console.warn('no pude montar el mapa 3D:',e);
    MAPA3D=null;
    return false;
  }
}

function mapa3DoViejo(){
  var c; try{ c=progreso(); }catch(e){ c={parada:1}; }
  var M=window.EFA_MAPA3D;
  if(MAPA3D_APAGADO)return false;
  if(!M){ EFA_MOTIVO='no se cargó el bloque del mapa'; return false; }
  if(M.error){ EFA_MOTIVO=M.error; return false; }
  if(!M.listo){ EFA_MOTIVO='todavía descomprimiendo'; return false; }

  // En el mapa 3D la cabecera va dentro del lienzo, no arriba: si se muestran
  // las dos, se encabalgan y se ve el titulo encima del nivel.
  var tb=document.querySelector('.topbar');
  if(tb)tb.style.display='none';
  // Por ahora solo pre-A1 y C2 tienen contenido. Los demás se ven pero no entran.
  var LISTOS={'Pre-A1':1,'C2':1};
  var SOY_JEFE=(typeof JEFE_LIBRE!=='undefined'&&JEFE_LIBRE)||
               (typeof MODO_JEFE!=='undefined'&&MODO_JEFE);
  var nivAhora=(P&&P.nivel)||'Pre-A1';
  APP.innerHTML='<div id="lienzo3d" class="lienzo3d"></div>'+
    '<div class="cab3d">'+
      '<div>'+
        '<div class="cab3d-niv">'+esc(nivAhora)+'</div>'+
        '<div class="cab3d-par">Parada '+c.parada+' de '+PARADAS+'</div>'+
      '</div>'+
      '<div class="niveles">'+
        ['Pre-A1','A1','A2','B1','B2','C1','C2'].map(function(nv){
          // Ya no hay niveles cerrados: los de arriba se pueden mirar.
          // Se marcan en gris claro para que se note que son de asomarse.
          var cerrado=(nOrden(nv)>nOrden(nivAhora)) && !SOY_JEFE;
          return '<button class="nivb'+(nv===nivAhora?' on':'')+(cerrado?' cerrado':'')+
                 '" data-niv="'+nv+'">'+esc(nv)+'</button>';
        }).join('')+
      '</div>'+
    '</div>'+
    '<button class="btn3d" id="ir3d">Empezar la parada '+c.parada+'</button>';

  var host=document.getElementById('lienzo3d');
  if(!host)return false;
  // se espera un cuadro para que el navegador ya le haya dado medidas
  requestAnimationFrame(function(){
    if(!montarMapa3D(host,c)){
      EFA_MOTIVO=EFA_MOTIVO||'createLevelMap falló';
      MAPA3D_APAGADO=true;
      mapaViejo();
    }
  });

  var b=document.getElementById('ir3d');
  if(b){
    if(!P){
      b.textContent='Empezar: cuéntame de ti';
      b.onclick=function(){ try{personalizar();}catch(e){ avisito('No pude abrir el alta.'); } };
    }else{
      b.onclick=function(){
        try{ arrancarParada(); }
        catch(e){ avisito('No pude abrir la lección: '+String(e).slice(0,60)); }
      };
    }
  }

  APP.querySelectorAll('.nivb').forEach(function(bt){
    bt.onclick=function(){
      var nv=bt.dataset.niv;
      if(!P){ avisito('Primero cuéntame de ti, para armarte tus frases.'); return; }

      // El jefe entra a donde sea, a estudiar.
      var jefe=(typeof JEFE_LIBRE!=='undefined'&&JEFE_LIBRE)||
               (typeof MODO_JEFE!=='undefined'&&MODO_JEFE);
      var mio=nOrden(VISITANDO||(P&&P.nivel)||'Pre-A1');
      if(VISITANDO)mio=nOrden((P&&P.nivel)||'Pre-A1');
      var alla=nOrden(nv);

      if(alla>mio && !jefe){
        visitarNivel(nv);     // más arriba del suyo: solo mirar
        return;
      }

      // Su nivel o uno de abajo: se estudia de verdad.
      VISITANDO=null; MAPA_NIVEL_FORZADO=''; MAT_VISITA=null;
      P.nivel=nv; P.nivel_n=alla;
      try{ var d=load(); d.perfil=P; save(d); D=d; }catch(e){}
      try{ MAT=materialDe(P); }catch(e){}
      mapa();
    };
  });
  marcarTab('mapa');
  return true;
}

function mapaViejo(){
  var c=progreso();
  var tr=tramoDe(c.parada);
  var tb=document.querySelector('.topbar');
  if(tb)tb.style.display='';

  var t=tableroSVG(c.parada,PARADAS);
  var h='<div class="mapcab">'+
    '<div class="maptramo" style="background:'+tr.color+'">'+esc(tr.nombre)+'</div>'+
    '<div class="mapsub">'+esc(tr.sub)+'</div>'+
    '<div class="mapfila">'+
      '<div class="mapdato"><b>'+c.parada+'</b><span>de '+PARADAS+'</span></div>'+
      '<div class="mapdato"><b>'+puntosLibres()+'</b><span>puntos</span></div>'+
      '<div class="mapdato"><b>'+diasSeguidos(c.dias)+'</b><span>días seguidos</span></div>'+
    '</div></div>';

  h+='<div class="tabwrap">'+t.svg+
     '<div class="aqui-pill">Aquí vas · '+c.parada+'</div></div>';

  h+='<div class="mapbotones">'+
     '<button class="btn" id="seguir">'+
       (!yaPersonalizo()?'Empezar: cuéntame de ti'
         :(esRepaso(c.parada)?'Repasar lo que se te atora':'Practicar la parada '+c.parada))+'</button>'+
     (yaPersonalizo()
       ?'<button class="btn ghost" id="miperfil" style="margin-top:8px">Mi avance y mi perfil</button>'
       :'<p class="tiny" style="margin-top:10px">Son unos minutos. Con tus respuestas armo tus frases: '+
        'no son de un libro, salen de tu trabajo.</p>')+
     '</div>';

  APP.innerHTML=h;

  document.getElementById('seguir').onclick=function(){
    // sin sus respuestas, el material sería genérico: mejor mandarlo a armarlo
    arrancarParada();
  };
  var mp=document.getElementById('miperfil');
  if(mp)mp.onclick=perfilAlumno;

  // No se regresa. Lo que se le atoró vuelve solo, en las casillas de repaso.
  APP.querySelectorAll('.lo').forEach(function(g){
    var n=+g.getAttribute('data-n');
    g.style.cursor='pointer';
    g.onclick=function(){
      if(JEFE_LIBRE){ irALeccionDe(n); return; }   // el jefe entra a donde sea
      asomarseALeccion(n,c.parada);
    };
  });

  // si acaba de avanzar, el muñeco brinca a su nueva loseta
  // la primera vez que ve el tablero, se le explica con el dedo encima
  // el recorrido ya no se dispara aqui: lo lanza el arranque, para que
  // valga igual con el mapa 3D que con este tablero de respaldo
  if(!yaPersonalizo()){
    say('Este es tu camino. Toca el botón y te hago unas preguntas para armar tus frases.','es-MX');
  }else if(SALTAR_DESDE&&SALTAR_DESDE<c.parada){
    var de=SALTAR_DESDE; SALTAR_DESDE=0;
    setTimeout(function(){
      saltarA(de,c.parada,t.base,t.alto,function(){
        if(idxTramo(de)!==idxTramo(c.parada)){
          say('Llegaste a un tramo nuevo: '+tr.nombre+'.','es-MX');
        }
      });
    },420);
  }else{
    say('Vas en la parada '+c.parada+'. '+tr.sub+'.','es-MX');
  }
}
var SALTAR_DESDE=0;

      guardarProgreso(cc);perfilAlumno();

// la curva: cuántas frases produjo en cada sesión
function curvaDeAvance(){
  var ses=(load().sesiones||[]).slice(-8);
  if(ses.length<2)return '<p class="tiny" style="text-align:left">Con dos sesiones ya puedes ver tu curva.</p>';
  var vals=ses.map(function(r){
    return (r.intentos||[]).filter(function(a){return a.oido&&a.tipo!=='pista';}).length;
  });
  var max=Math.max.apply(null,vals)||1;
  return '<div class="curva"><span class="hl">Frases que dijiste en cada sesión</span>'+
    '<div class="cbarras">'+vals.map(function(v,i){
      return '<div class="cb"><i style="height:'+Math.round(v/max*100)+'%"></i><span>'+v+'</span></div>';
    }).join('')+'</div>'+
    '<p class="tiny" style="text-align:left;margin:8px 0 0">De '+vals[0]+' a '+vals[vals.length-1]+' frases.</p></div>';
}

/* ═══════════ lo que Brian corrigió ═══════════ */
// El bucle: Brian firma en la hoja y escribe la corrección; la app la recoge
// y esa frase entra en la práctica siguiente, marcada como suya. Sin esto,
// la firma se queda en la hoja y el alumno nunca la ve.
var DE_BRIAN=[];
function pedirCorrecciones(cb){
  // sin conexión o sin endpoint: se usa lo último que se guardó, no se vacía.
  // Así el alumno sigue viendo sus tareas aunque abra la app sin internet.
  if(!DATOS_ENDPOINT||!P||!P.nombre){
    try{DE_BRIAN=(load().deBrian)||[];}catch(e){DE_BRIAN=[];}
    cb&&cb(DE_BRIAN);return;
  }
  fetch(DATOS_ENDPOINT,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({accion:'correcciones',nombre:P.nombre})})
    .then(function(r){return r.ok?r.json():null;})
    .then(function(d){
      var c=(d&&d.ok&&d.correcciones)||[];
      DE_BRIAN=c;
      try{var g=load();g.deBrian=c;save(g);D=g;}catch(e){}
      cb&&cb(c);
    })
    .catch(function(){
      try{DE_BRIAN=(load().deBrian)||[];}catch(e){DE_BRIAN=[];}
      cb&&cb(DE_BRIAN);
    });
}
function frasesDeBrian(){
  return DE_BRIAN.filter(function(x){return x.frase;}).slice(0,3).map(function(x){
    return {k:'model',en:x.frase,es:'Esta te la corrigió Brian. Vamos con la forma buena.',deBrian:true};
  });
}
function mensajeDeBrian(){
  var m=DE_BRIAN.filter(function(x){return x.mensaje;})[0];
  return m?m.mensaje:'';
}
// Las tareas que Brian le dejó (texto, su audio, videos, links, ejercicios).
// Cada una trae: titulo, nota, audio (base64 o url), videos[], links[], hecha.
function tareasDeBrian(){
  return DE_BRIAN.filter(function(x){return x.tipo==='tarea';});
}
// El material bonus: aparece en el mapa, da tokens fijos por HACERLO (no por nota).
function bonusDeBrian(){

}
// se recuerda localmente qué tareas/bonus ya cerró, para no repagar tokens
function hechosDeBrian(){var d=load();return d.hechosBrian||{};}
function marcarHecho(id,tokens){
  var d=load();d.hechosBrian=d.hechosBrian||{};
  if(d.hechosBrian[id])return false;   // ya estaba, no se vuelve a pagar
  d.hechosBrian[id]=hoyISO();
  if(tokens){d.camino=d.camino||{};d.camino.puntos=(d.camino.puntos||0)+tokens;}
  save(d);D=d;
  // se le avisa al servidor que ya la hizo, para que Brian lo vea en su panel
  if(DATOS_ENDPOINT&&P&&P.nombre){
    try{fetch(DATOS_ENDPOINT,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({accion:'tarea_hecha',nombre:P.nombre,id:id})})
      .catch(function(){});}catch(e){}
  }
  return true;
}
function tareasPendientes(){
  var h=hechosDeBrian();
  return tareasDeBrian().filter(function(t){return !h[t.id];}).length;
}

/* ═══════════ repetición espaciada ═══════════ */
// No basta repasar lo de ayer. Cada frase lleva su historial y su próxima
// fecha: si sale bien, el intervalo crece (1, 3, 7, 16 días); si sale mal,
// vuelve a empezar. Es el sistema Leitner, adaptado a frases habladas.
var DIAS=[1,3,7,16,35];
function hoyISO(){return new Date().toISOString().slice(0,10);}
function enDias(n){var d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);}
function memoria(){var d=load();return d.memoria||{};}
function guardarMemoria(mem){var d=load();d.memoria=mem;save(d);D=d;}

function registrarEnMemoria(frase,pct){
  if(!frase)return;
  var mem=memoria(),k=clave(frase);
  var m=mem[k]||{frase:frase,paso:0,vistas:0,fallos:0};
  m.vistas++;
  if(pct!==null&&pct!==undefined&&pct>=80){
    m.paso=Math.min(m.paso+1,DIAS.length-1);
  }else{
    m.paso=0;m.fallos++;
  }
  m.ultima=hoyISO();
  m.proxima=enDias(DIAS[m.paso]);
  m.dominada=(m.paso>=3&&m.fallos===0)||m.paso>=4;
  // si venía fallando y ahora salió, entra a vigilancia: vuelve una vez más
  if(pct>=80&&m.fallos>0&&m.paso>=2)retirarError(m.frase);
  mem[k]=m;guardarMemoria(mem);
}
// lo que toca repasar hoy: vencido y no dominado, lo más atrasado primero
function tocaHoy(max){
  var mem=memoria(),hoy=hoyISO(),out=[];
  Object.keys(mem).forEach(function(k){
    var m=mem[k];
    if(m.dominada)return;
    if(!m.proxima||m.proxima<=hoy)out.push(m);
  });
  out.sort(function(a,b){return (a.proxima||'').localeCompare(b.proxima||'')||b.fallos-a.fallos;});
  return out.slice(0,max||3).map(function(m){
    return {k:'model',en:m.frase,es:'Esta ya la practicaste. A ver si te sale sola.',repaso:true};
  });
}
function cuantasDominadas(){
  var mem=memoria(),n=0,t=0;
  Object.keys(mem).forEach(function(k){t++;if(mem[k].dominada)n++;});
  return {dominadas:n,total:t};
}

/* ═══════════ cuánto español según el nivel ═══════════ */
// Pre-A1: todo en español. A1: inglés con el español debajo, más chico.
// A2: inglés, y el español solo si lo pide. B1: inglés solo.
// En C2 TODO va en inglés. A ese nivel el español estorba.
function esC2(){ return !!(P && (P.nivel==='C2' || P.nivel_n>=6)); }

/* El espanol se va retirando poco a poco, no de golpe. Antes B1 ya salia
   todo en ingles y era un salto brutal desde A2. Ahora:
     Pre-A1  todo en espanol
     A1      ingles arriba, espanol abajo (siempre visible)
     A2      ingles arriba, espanol abajo (siempre visible)
     B1      ingles; el espanol esta a un toque (boton de bandera)
     B2      ingles; el espanol esta a un toque, pero ya casi no se usa
     C1      SOLO ingles, sin bandera
     C2      SOLO ingles, sin bandera
   nivel_n: 0 Pre-A1, 1 A1, 2 A2, 3 B1, 4 B2, 5 C1, 6 C2 */
function modoIdioma(){
  var n=(P&&P.nivel_n);
  if(n===undefined||n===null)n=0;
  if(n>=5)return 'en';      // C1 y C2: nada de espanol, ni escondido
  if(n<=0)return 'es';
  if(n===1||n===2)return 'both';
  return 'en-es';           // B1 y B2: ingles, con el espanol a un toque
}

/* Arriba de B2 NO hay red de seguridad: ni banderas, ni "que significa".
   Si se deja el boton, se usa, y a ese nivel el chiste es no usarlo. */
function hayTraduccion(){ return modoIdioma()!=='en'; }
// devuelve la instrucción como toca según el nivel
function bilingue(en,es,clase){
  var m=modoIdioma();
  clase=clase||'qsub';
  if(m==='es')  return '<div class="'+clase+'">'+esc(es)+'</div>';
  if(m==='both')return '<div class="'+clase+'"><span class="ins-en">'+esc(en)+'</span>'+
                       '<span class="ins-es">'+esc(es)+'</span></div>';
  if(m==='en-es')return '<div class="'+clase+'"><span class="ins-en">'+esc(en)+'</span>'+
                       '<button class="ins-b" data-es="'+esc(es)+'">¿qué dice?</button></div>';
  return '<div class="'+clase+'"><span class="ins-en">'+esc(en)+'</span></div>';
}
function ligarBilingue(){
  APP.querySelectorAll('.ins-b').forEach(function(b){
    b.onclick=function(e){
      e.stopPropagation();
      b.outerHTML='<span class="ins-es">'+b.getAttribute('data-es')+'</span>';
    };
  });
}

function planDeHoy(S){
  var m=modoIdioma();
  return '<div class="plan"><span class="plan-l">Lo de hoy, en tres pasos</span>'+
    PLAN.map(function(p,i){
      var t = m==='es' ? p.es : (m==='both' ? p.en+' · '+p.es : p.en);
      return '<div class="plan-p"><span class="plan-n">'+(i+1)+'</span>'+
             '<span class="plan-i">'+ico(p.ico,18)+'</span><span class="plan-t">'+esc(t)+'</span></div>';
    }).join('')+
    '<button class="plan-b" id="planoir">'+ico('bocina',17)+' Escuchar el plan</button></div>';
}
function ligarPlan(S){
  var b=document.getElementById('planoir');
  if(!b)return;
  b.onclick=function(e){
    e.stopPropagation();
    var m=modoIdioma();
    var txt = m==='es'
      ? 'Hoy '+(S.hoy||'practicamos')+'. Primero escuchas, luego repites en voz alta, y después contestas tú. Nada más eso.'
      : 'Today, first you listen. Then you repeat. Then you answer. That is all.';
    say(txt, m==='es'?'es-MX':'en-US');
  };
}

/* ═══════════ cierre: una conversación corta ═══════════ */
// Cerrar con "di lo que puedas" tira lo que acaba de practicar. Aquí el cierre
// es una conversación: escucha, contesta, escucha, contesta. Cada turno usa el
// material de la sesión, con contexto, no al aire.
function conversacionDe(p,n){
  var conv=[
    [
      {ctx:'Estás en el comedor. Se sienta alguien que no conoces.',
       dice:'Hi! I am Sarah. What is your name?', pide:'Salúdala y dile cómo te llamas.'},
      {ctx:'Ya sabe tu nombre. Ahora quiere saber de tu trabajo.',
       dice:'Nice to meet you. What do you do here?', pide:'Dile a qué te dedicas y dónde trabajas.'},
      {ctx:'Se tiene que ir. Se despide.',
       dice:'It was nice meeting you. See you tomorrow!', pide:'Despídete de ella.'}
    ],
    [
      {ctx:'Tu compañero nuevo no sabe los horarios.',
       dice:'What time do you start in the morning?', pide:'Dile a qué hora entras a trabajar.'},
      {ctx:'Ahora quiere saber qué haces.',
       dice:'And what do you do every day?', pide:'Cuéntale qué haces en tu trabajo.'},
      {ctx:'Te pregunta si trabajas siempre.',
       dice:'Do you work every day?', pide:'Dile si trabajas diario y agrégale algo más.'}
    ],
    [
      {ctx:'Llega un cliente de fuera a recorrer la planta.',
       dice:'Good morning. How are you today?', pide:'Dile cómo estás y pregúntale a él lo mismo.'},
      {ctx:'Quiere saber en qué parte trabajas.',
       dice:'Where do you work exactly?', pide:'Dile en qué área de la planta trabajas.'},
      {ctx:'Te agradece la explicación.',
       dice:'Thank you. That was very clear.', pide:'Dale las gracias.'}
    ],
    [
      {ctx:'En el descanso, alguien saca plática.',
       dice:'So, what do you like to do after work?', pide:'Dile qué te gusta hacer.'},
      {ctx:'Le da curiosidad por qué estudias inglés.',
       dice:'And why are you learning English?', pide:'Dile para qué te sirve el inglés.'},
      {ctx:'Te dice que el español se le hace difícil.',
       dice:'Spanish is hard for me. Is English hard for you?', pide:'Dile si a ti también se te hace difícil.'}
    ],
    [
      {ctx:'Te presentan con el gerente de un cliente.',
       dice:'Hello. Tell me a little about yourself.', pide:'Di tu nombre, tu trabajo y dónde trabajas.'},
      {ctx:'Quiere saber de tu día de ayer.',
       dice:'What did you do yesterday?', pide:'Cuéntale una cosa que hiciste ayer.'},
      {ctx:'Se despide y te desea buen día.',
       dice:'Great. Have a good day!', pide:'Despídete y deséale lo mismo.'}
    ]
  ];
  return conv[n]||conv[0];
}

// La gente no contesta con el dato pelón: dice "me llamo Brian" o "soy chef".
// Aquí se quitan esos arranques para quedarnos con lo que importa.
function limpiarNombre(v){
  var t=String(v||'').replace(/[.,;:!¡?¿]/g,' ').trim();
  // se van los arranques y las muletillas, estén donde estén
  var basura=/^(hola|buenos|buenas|d[ií]as|tardes|noches|me|mi|yo|nombre|es|llamo|soy|este|pues|bueno|eh|mmm|ah|my|name|is|i|am|im|a|el|la|se[ñn]or|se[ñn]ora)$/i;
  var p=t.split(/\s+/).filter(Boolean).filter(function(w){
    return !basura.test(w.replace(/[^A-Za-zÁÉÍÓÚÑÜáéíóúñü]/g,''));
  })[0]||'';
  p=p.replace(/[^A-Za-zÁÉÍÓÚÑÜáéíóúñü]/g,'');
  if(!p)return '';
  return p.charAt(0).toUpperCase()+p.slice(1).toLowerCase();
}
function limpiarOficio(v){
  return String(v||'').trim()
    .replace(/^(pues[,\s]*|este[,\s]*|bueno[,\s]*)/i,'')
    .replace(/^(yo\s+)?(soy|trabajo\s+de|trabajo\s+como|me\s+dedico\s+a|mi\s+trabajo\s+es)\s+/i,'')
    .replace(/^(un|una|el|la)\s+/i,'')
    .replace(/[.;]+$/,'')
    .trim();
}
function limpiarAccion(v){
  return String(v||'').trim()
    .replace(/^(pues[,\s]*|este[,\s]*|bueno[,\s]*)/i,'')
    .replace(/^(yo\s+)?(hago|me\s+dedico\s+a)\s+/i,'')
    .replace(/[.;]+$/,'')
    .trim();
}

function interpretar(p){
  var t=(p.trabajo_es||'').toLowerCase();
  var oficio=null;
  for(var i=0;i<OFICIOS.length;i++){if(OFICIOS[i][0].test(t)){oficio=OFICIOS[i];break;}}
  if(oficio){
    p.trabajo_en='I am '+oficio[1];
    p.trabajo_et=oficio[1];
    p.lugar_es=p.lugar_es||oficio[2];
    p.lugar_en=p.lugar_en||('I work '+oficio[3]);
    p.reconocido=true;
  }else{
    // no lo reconocí: no invento inglés, lo dejo marcado para que Brian lo corrija
    p.trabajo_en='I have a job.';
    p.trabajo_et=p.trabajo_es;
    p.lugar_es=p.lugar_es||'donde trabajo';
    p.lugar_en=p.lugar_en||'I work every day.';
    p.reconocido=false;
  }
  var a=(p.accion_es||'').toLowerCase(),acc=[];
  ACCIONES_MAP.forEach(function(m){if(m[0].test(a)&&acc.indexOf(m[1])<0)acc.push(m[1]);});
  p.accion_en=acc.length?acc[0]:'I work every day';
  p.accion_en2=acc.length>1?acc[1]:null;
  return p;
}

/* Niveles que hoy tienen las 24 lecciones completas. Cuando A1, A2, B1, B2
   o C1 esten escritos, se agrega su numero aqui y la app los abre sola.
   0=Pre-A1  1=A1  2=A2  3=B1  4=B2  5=C1  6=C2 */
var NIVELES_ABIERTOS=[0,6];

var NOMBRE_NIVEL={0:'Desde cero',1:'A1',2:'A2',3:'B1',4:'B2',5:'C1',6:'Avanzado'};
var CODIGO_NIVEL={0:'Pre-A1',1:'A1',2:'A2',3:'B1',4:'B2',5:'C1',6:'C2'};

var OPCIONES_NIVEL=[
  {n:0,tit:'Desde cero',
   sub:'Nunca lo he llevado, o lo llevé hace años y no lo uso. Empezamos por presentarte, tu día y tu trabajo.'},
  {n:6,tit:'Avanzado',
   sub:'Ya me defiendo hablando. Quiero pulir: tono, formalidad, juntas, y sonar natural.'}
];

// Si el cuestionario cae en un nivel que todavia no esta escrito, se usa el
// abierto mas cercano. Asi nadie aterriza en una leccion vacia.
function nivelAbiertoCercano(n){
  if(NIVELES_ABIERTOS.indexOf(n)>=0)return n;
  var mejor=NIVELES_ABIERTOS[0],dist=99;
  NIVELES_ABIERTOS.forEach(function(a){
    var d=Math.abs(a-n);
    if(d<dist){dist=d;mejor=a;}
  });
  return mejor;
}

function nivelDe(pts){
  if(pts<=1)return {cod:'Pre-A1',n:0,txt:'Empezamos desde cero. Eso está bien: aquí nadie tiene que llegar sabiendo.'};
  if(pts<=3)return {cod:'A1',n:1,txt:'Ya tienes algo. Vamos a construir sobre eso.'};
  if(pts<=5)return {cod:'A2',n:2,txt:'Te defiendes. Vamos a apretar un poco más entonces.'};
  if(pts<=9)return {cod:'B1',n:3,txt:'Hablas bastante bien. Voy a exigirte más de lo normal.'};
  return {cod:'B2 o más',n:4,alto:true,
    txt:'Tu inglés está por arriba de lo que esta práctica diaria cubre.'};
}

function pruebaNivel(){
  var i=0,pts=0,resp=[];
  function paso1(){
    // las dos últimas solo se preguntan si las tres primeras salieron bien
    if(i===3&&pts<6){cerrar();return;}
    if(i>=NIVEL_Q.length){cerrar();return;}
    var x=NIVEL_Q[i];
    APP.innerHTML=atras()+ayuda('Te voy a hacer una pregunta en inglés. Contesta como puedas: hablando o escribiendo. Si no sabes, toca "No sé todavía" y seguimos. No es examen.','tu material de práctica')+'<div class="prog">'+NIVEL_Q.slice(0,pts>=6?NIVEL_Q.length:3).map(function(_,k){return '<i class="'+(k<=i?'on':'')+'"></i>';}).join('')+'</div>'+
      '<div class="qcard"><div class="qlbl">Paso 3 de 5 · a ver qué tanto sabes'+(NIVEL_Q[i].avanzada?' · una más difícil':'')+'</div>'+

      (HAY_MIC?'<button class="mic-big" id="mic"><span class="ring2"></span> Tocar y contestar</button>':'')+
      '<textarea class="typebox" id="tb" placeholder="O escríbelo aquí…" style="margin-top:10px"></textarea>'+
      '<button class="btn" id="env">Enviar respuesta</button>'+

    document.getElementById('ne').textContent=x.es;
    setTimeout(function(){say(x.q,'en-US');},250);
    document.getElementById('oir').onclick=function(){say(x.q,'en-US');};
    document.getElementById('sig1').onclick=function(){
      this.outerHTML='<div class="heard" style="margin-bottom:10px"><div class="hl">quiere decir</div>'+

    if(mic)mic.onclick=function(){
      var b=this;b.classList.add('rec');b.innerHTML='<span class="ring2"></span> Escuchando…';b.disabled=true;
      listen('en-US',function(t){b.classList.remove('rec');b.disabled=false;b.innerHTML='<span class="ring2"></span> Otra vez';califica(t);},

          document.getElementById('res').innerHTML='<div class="heard"><span class="no2">No te oí. Escríbelo abajo.</span></div>';});
    };
    document.getElementById('env').onclick=function(){
      var v=document.getElementById('tb').value.trim();
      if(v)califica(v);
    };
    ligarAyuda('Te voy a hacer una pregunta en inglés. Contesta como puedas: hablando o escribiendo. Si no sabes, toca No sé todavía y seguimos. No es examen.');
    document.getElementById('nose').onclick=function(){resp.push({q:x.q,r:'',ok:false});i++;paso1();};
    ligarAtras(function(){
      if(i>0){var u=resp.pop();if(u&&u.ok)pts-=NIVEL_Q[i-1].vale;i--;paso1();}
      else{epaso=PASOS.length-1;entrevista();}
    });
  }
  function califica(t){
    var x=NIVEL_Q[i],bien=x.ok.test(t);
    if(bien)pts+=x.vale;
    resp.push({q:x.q,r:t,ok:bien});
    document.getElementById('res').innerHTML='<div class="heard"><div class="hl">te entendí</div>'+
      '<div class="ht">'+esc(t)+'</div><div class="tst-r">'+(bien

function cerrar(){
    var nv=nivelDe(pts);

    escogerNivel(nv);

  // Hoy solo dos niveles tienen el curso completo. En vez de mandar al alumno
  // a ciegas a uno que todavia no existe, se le ensenan los abiertos y el
  // escoge. El cuestionario ya no decide: sugiere.
  function escogerNivel(nv){
    var sug=nivelAbiertoCercano(nv.n);

      '<div class="picknv" id="pn">'+
        ops.map(function(o){
          return '<button data-n="'+o.n+'" class="'+(o.n===sug?'sel':'')+'">'+
            '<b>'+esc(o.tit)+'</b>'+
            '<span>'+esc(o.sub)+'</span>'+
            (o.n===sug?'<i>te recomiendo empezar aqu&iacute;</i>':'')+
          '</button>';
        }).join('')+
      '</div>'+
      (nv.alto?'<p class="tiny" style="text-align:left">Por lo que contestaste, tu ingl&eacute;s ya va alto. '+
        'Le aviso a Brian para que te cuente de las sesiones de conversaci&oacute;n y preparaci&oacute;n Cambridge.</p>':'')+
      '<button class="btn" id="gonv" style="margin-top:14px">Empezar</button></div>';

    say('Dime por donde quieres empezar.','es-MX');

    APP.querySelectorAll('#pn button').forEach(function(b){
      b.onclick=function(){
        APP.querySelectorAll('#pn button').forEach(function(x){x.classList.remove('sel');});
        b.classList.add('sel');
        eleg=+b.getAttribute('data-n');
      };
    });
    document.getElementById('gonv').onclick=function(){
      edatos.nivel_n=eleg;
      edatos.nivel=CODIGO_NIVEL[eleg]||nv.cod;
      cerrarPerfil();
    };
  }
  paso1();
}

function videoDeFrase(frase,pista,cb){
  if(typeof pista==='function'){cb=pista;pista='';}
  var k=clave(frase)+'|'+(pista||'');

  if(t[k]!==undefined){cb(t[k]||null);return;}
  if(!VIDEO_ENDPOINT){cb(null);return;}

  var reloj=setTimeout(function(){if(!listo){listo=true;cb(null);}},9000);

        (pista?'&extra='+encodeURIComponent(pista):''))
    .then(function(r){return r.json();})
    .then(function(d){
      if(listo)return;listo=true;clearTimeout(reloj);
      var id=null;
      if(d&&d.ok&&d.resultados&&d.resultados[0])id=d.resultados[0].id||null;
      // Solo se guarda cuando el servidor contesto bien. Si estaba caido,
      // no se guarda nada y la proxima vez se vuelve a intentar.
      if(d&&d.ok)guardarVideo(k,id||0);

    })
    .catch(function(){if(listo)return;listo=true;clearTimeout(reloj);cb(null);});
}


/* ═══════════ a qué le tira cada alumno ═══════════ */
// El programa nacio para Olan y salio todo de oficina: juntas, clientes,
// reportes. Sirve para quien trabaja en eso y estorba para los demas.
// Ahora cada quien dice de que quiere su ingles y TODO lo que produce la IA
// (preguntas, roleplays, repreguntas, correcciones) se acomoda a eso.
function enfoqueClave(txt){
  var t=String(txt||'').toLowerCase();
  if(t.indexOf('vida')>=0 && t.indexOf('trabajo')<0) return 'vida';
  if(t.indexOf('trabajo')>=0 && t.indexOf('vida')<0) return 'trabajo';
  return 'ambos';
}
function enfoqueDe(){
  if(!P)return 'ambos';
  // se recalcula del texto para que cambiarlo en Mis datos surta efecto
  if(P.enfoque_es)return enfoqueClave(P.enfoque_es);
  return P.enfoque||'ambos';   // alumnos de antes: las dos cosas
}
// El parrafo que se le manda al cerebro en CADA peticion. Es el que hace
// que dos alumnos del mismo nivel no reciban lo mismo.
function quienEs(){
  if(!P)return '';
  var e=enfoqueDe();
  var g=[P.gusto_es,P.gusto_otra].filter(Boolean).join(', ');
  var m=[P.meta_es,P.meta_otra].filter(Boolean).join(', ');
  var p='ALUMNO: '+(P.nombre||'')+', nivel '+(P.nivel||'Pre-A1')+'.';
  if(P.trabajo_es) p+=' Trabaja de '+P.trabajo_es+(P.lugar_es?' en '+P.lugar_es:'')+'.';
  if(g) p+=' Le gusta: '+g+'.';
  if(m) p+=' Quiere el ingles '+m+'.';
  if(e==='vida')
    p+=' ENFOQUE: ingles de la VIDA DIARIA. Usa situaciones de su casa, su gente, '+
       'viajes, compras, salud, series, comida y amigos. NO uses juntas, reportes, '+
       'clientes corporativos ni correos de oficina.';
  else if(e==='trabajo')
    p+=' ENFOQUE: ingles de TRABAJO. Usa situaciones de su chamba: '+
       (P.trabajo_es||'su puesto')+', companeros, clientes, telefono y correo.';
  else
    p+=' ENFOQUE: mitad vida diaria y mitad trabajo. Alterna: si el ultimo ejemplo '+
       'fue de oficina, el siguiente que sea de su vida.';
  p+=' Todo lo que inventes debe sonar a SU mundo, no a un libro de negocios.';
  return p;
}

function hayIA(){return !!IA_ENDPOINT;}
function pedirIA(accion,datos,ok,falla){
  if(!hayIA()){falla&&falla();return;}
  fetch(IA_ENDPOINT,{
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({accion:accion,datos:datos})
  })
  .then(function(r){return r.ok?r.json():null;})
  .then(function(d){ if(d&&d.ok)ok&&ok(d.resultado); else falla&&falla(); })
  .catch(function(){falla&&falla();});
}
function evaluarConIA(rec,cb){
  if(!hayIA()){cb&&cb(null);return;}
  pedirIA('evaluar',{
    nombre:rec.nombre, nivel:(rec.perfil&&rec.perfil.nivel)||'',
    trabajo:(rec.perfil&&rec.perfil.trabajo_es)||'',
    alumno:quienEs(), enfoque:enfoqueDe(),
    gusto:(rec.perfil&&rec.perfil.gusto_es)||'',
    sesion:rec.titulo,
    intentos:(rec.intentos||[]).map(function(a){
      return {tipo:a.tipo, meta:a.meta, dijo:a.oido, pct:a.pct};
    })
  },function(res){cb&&cb(res);},function(){cb&&cb(null);});
}
function repreguntarConIA(perfil,dicho,cb){
  if(!hayIA()){cb&&cb(null);return;}
  pedirIA('repreguntar',{nivel:perfil.nivel||'',trabajo:perfil.trabajo_es||'',
    alumno:quienEs(), enfoque:enfoqueDe(), gusto:perfil.gusto_es||'', dijo:dicho},
    function(res){cb&&cb(res);},function(){cb&&cb(null);});
}
// la repregunta llega después, sin trabar la pantalla
// ── role-play: la IA hace del personaje y la conversacion sigue ──
var RP_TURNOS=[];
function roleplayConIA(x,dicho,cb){
  if(!hayIA()){cb&&cb(null);return;}
  pedirIA('roleplay',{
    quien:x.quien||'', ctx:x.ctx||'', nivel:(P&&P.nivel)||'A1',
    trabajo:(P&&P.trabajo_es)||'',
    alumno:quienEs(), enfoque:enfoqueDe(), gusto:(P&&P.gusto_es)||'',
    dijo:dicho, turnos:(x.turnos||RP_TURNOS).slice(-6)
  }, function(res){cb&&cb(res);}, function(){cb&&cb(null);});
}
function seguirRoleplay(x,dicho){
  var caja=document.getElementById('res');
  if(!caja)return;
  RP_TURNOS.push({de:'alumno',txt:dicho});
  caja.insertAdjacentHTML('afterbegin',
    '<div class="bubble-ia pensando" id="rp-esp"><div class="ht">'+esc(x.quien||'')+' está pensando…</div></div>');
  roleplayConIA(x,dicho,function(res){
    var esp=document.getElementById('rp-esp');
    if(esp)esp.remove();
    if(!res||!res.dice){
      var c2=document.getElementById('res');
      if(c2)c2.insertAdjacentHTML('afterbegin',
        '<div class="fb no">No pude traer su respuesta. Toca Siguiente y seguimos.</div>');
      return;
    }
    RP_TURNOS.push({de:'personaje',txt:res.dice});
    var c=document.getElementById('res');

/* ═══════════ el examen de cada nivel ═══════════ */
// La parada 14 y la 28 no son material nuevo: son prueba.
// La 28 es la final, la que cierra el nivel.
// Tres partes dentro de UNA sola sesion:
//   1. gramatica y vocabulario  (sale de lo que ya practico en este nivel)
//   2. listening                 (lo mismo, pero de oido)
//   3. conversacion en dos fases (yo pregunto / el pregunta)
// La conversacion pasa entera en UNA SOLA PANTALLA: el chat crece hacia
// abajo y nunca se cambia de tarjeta. Eso lo pidio Brian explicitamente.
var EXAMENES=[14,28];
function esExamen(n){ return EXAMENES.indexOf(+n)>=0; }
function esExamenFinal(n){ return +n===PARADAS; }

function nivelTexto(){ return (P&&P.nivel)||'Pre-A1'; }
function nivelNum(){ var n=(P&&P.nivel_n); return (n===0||n)?n:0; }

// Cuantos turnos aguanta cada nivel y que tan larga se le pide la respuesta.
// Abajo: poquitas y cortas. Arriba: conversacion de verdad.
function planCharla(){
  var n=nivelNum();
  if(n<=0)  return {p1:4,p2:3,min:2,largo:'con 3 o 4 palabras basta'};
  if(n===1) return {p1:4,p2:3,min:3,largo:'una frase completa'};
  if(n===2) return {p1:5,p2:4,min:4,largo:'una o dos frases'};
  if(n===3) return {p1:5,p2:4,min:6,largo:'dos o tres frases, y di por que'};
  if(n===4) return {p1:6,p2:5,min:8,largo:'unas tres frases, con tus razones'};
  if(n===5) return {p1:6,p2:5,min:9,largo:'desarrollalo, con ejemplos'};
  return              {p1:6,p2:5,min:10,largo:'lo que haga falta, cuidando el tono'};
}

// Las preguntas de respaldo, por si el cerebro no contesta. No son de
// relleno: son las que de verdad se preguntan en un examen oral de ese
// nivel, y la mitad NO son de trabajo. Eso tambien lo pidio Brian: el
// programa venia demasiado cargado a business por lo de Olan.
function bancoPreguntas(){
  var g=(P&&P.gusto_es)||'', t=(P&&P.trabajo_es)||'';
  var porNivel={
    0:['What is your name?','Where are you from?','What do you do?',
       'Do you have children?','Do you like music?','What do you do on Sunday?'],
    1:['Tell me about your family.','Where do you live?',
       'What did you do yesterday?','What do you do in your free time?',
       'What is your favourite food?','Do you like your job? Why?'],
    2:['Tell me about a normal week for you.','What did you do last weekend?',
       'What are your plans for this year?','Tell me about someone you like a lot.',
       'What do you do when something goes wrong at work?',
       'Where would you like to travel?'],
    3:['Tell me about something you are good at.',
       'What is the best thing about where you live?',
       'Tell me about a time something did not go as planned.',
       'What would you change about your job?',
       'How do you usually spend your money?',
       'What do you think about social media?'],
    4:['What is a decision you are glad you made?',
       'How has your work changed in the last five years?',
       'Some people say we work too much. What do you think?',
       'Tell me about a problem you had to solve with other people.',
       'What is something people get wrong about your country?',
       'If you had a free year, what would you do with it?'],
    5:['What is a belief you have changed your mind about?',
       'How do you handle someone who disagrees with you?',
       'What is the hardest part of leading other people?',
       'Is technology making us better at our jobs, or worse?',
       'Tell me about a moment that changed how you see your career.',
       'What advice would you give someone starting out in your field?'],
    6:['How would you describe the difference between being right and being persuasive?',
       'What is something your culture does that outsiders misread?',
       'Tell me about a time you had to deliver bad news well.',
       'Where do you think your industry will be in ten years?',
       'What do you find genuinely funny, and why do you think that is?',
       'If you could rewrite one rule about how people work together, what would it be?']
  };
  var base=(porNivel[nivelNum()]||porNivel[0]).slice();
  var e=enfoqueDe();
  // si su ingles es de vida, fuera las de oficina; si es de trabajo, al reves
  if(e==='vida') base=base.filter(function(q){ return !/\b(work|job|career|industry|field)\b/i.test(q); });
  if(e==='trabajo') base=base.filter(function(q){ return !/\b(family|children|food|music|weekend|sunday)\b/i.test(q); });
  if(base.length<3) base=(porNivel[nivelNum()]||porNivel[0]).slice();
  // una pregunta hecha a la medida: de lo que le gusta, no de su chamba
  if(g) base.splice(Math.min(3,base.length),0,
        'Tell me about '+((P&&P.gusto_en)||g).replace(/^I like /i,'')+'.');
  if(t && nivelNum()>=2 && e!=='vida')
    base.push('Tell me what a good day at work looks like for you.');
  return base;
}

// Lo que el alumno puede usar para preguntar en la fase 2.
// En los niveles bajos se le dan los arranques; arriba no hace falta.
function arranquesPregunta(){
  var n=nivelNum();
  if(n<=0) return ['What is...?','Where...?','Do you...?','How old...?'];
  if(n===1) return ['What do you...?','Where do you...?','Do you like...?','How many...?'];
  if(n===2) return ['What did you...?','Have you ever...?','Why do you...?','Would you...?'];

}

/* ── armar el examen ── */
// Las partes 1 y 2 salen del material de SU nivel: es su propio curso el que
// lo examina. Si su nivel todavia usa el generador viejo (que solo produce
// model, ask y free), se fabrican los reactivos a partir de sus frases.
function materialExamen(final){
  if(!MAT||!MAT.length){ try{ MAT=materialDe(P); }catch(e){} }
  var todos=[];
  (MAT||[]).forEach(function(S){ (S.items||[]).forEach(function(z){ todos.push(z); }); });

  // Sin esto salia el mismo reactivo dos veces: hay frases que se repiten
  // entre lecciones a proposito, y al barajar caian juntas.
  var yaVisto={};
  function nuevo(z){
    var f=z.k+'|'+(z.en||z.frase||z.audio||z.bien||'')+'|'+(z.a||'')+'|'+
          (z.antes||'')+'|'+((z.piezas||[]).join(' '));
    if(yaVisto[f])return false;
    yaVisto[f]=1; return true;
  }
  function de(kinds,cuantos){
    var v=todos.filter(function(z){ return kinds.indexOf(z.k)>=0 && nuevo(z); });
    return mezclar(v).slice(0,cuantos);
  }
  var gram=de(['hueco','cazar','ordenar','transf','palabra','deletreo','idiom','phrasal'], final?6:4);
  var oir =de(['idea','detalle','dosc','segm','pares'], final?4:3);

  // Relleno para los niveles cuyo material todavia no trae esos tipos.
  // Se fabrican de sus propias frases, pero solo de las que sirven: de una
  // sola oracion y ni tan cortas que se armen solas ni tan largas que sean
  // un rompecabezas de quince piezas.
  var frases=todos.filter(function(z){
    if(z.k!=='model'||!z.en)return false;
    var t=z.en.trim();
    if(/[.?!]\s+\S/.test(t))return false;          // trae mas de una oracion
    var n=t.replace(/[.?!]$/,'').split(/\s+/).length;
    return n>=3 && n<=9;
  });
  frases=mezclar(frases.slice());
  var fi=0;
  while(gram.length<(final?6:4) && fi<frases.length){
    var f=frases[fi++];
    var pz=f.en.trim().replace(/[.?!]$/,'').split(/\s+/);
    if(!nuevo({k:'ordenar',piezas:pz}))continue;
    gram.push({k:'ordenar', piezas:pz, es:f.es||''});
  }
  while(oir.length<(final?4:3) && fi<frases.length){
    var g=frases[fi++];
    var otra=variarFrase(g.en);
    // si no se le pudo cambiar ninguna palabra, ese par no ensena nada
    if(!otra || otra===g.en || otra===g.en.replace(/\.$/,' too.'))continue;
    if(!nuevo({k:'dosc',a:g.en}))continue;
    var izq=Math.random()<0.5;
    oir.push({k:'dosc', a:izq?g.en:otra, b:izq?otra:g.en,
              bien:izq?'a':'b', es:g.es||''});
  }

  var items=gram.concat(oir);
  items.push({k:'charla', final:!!final});

  return {
    t: final?'Examen final de '+nivelTexto():'Examen de medio camino',
    hoy: final?'ponemos a prueba todo el nivel':'vemos como vas a la mitad',
    obj: 'Contestar gramatica, entender de oido y sostener una conversacion.',
    tip: 'No es para reprobarte. Es para ver que ya se te quedo y que hay que volver a ver.',
    enc: final
      ? 'Esta es la ultima parada del nivel. Tres partes: unas preguntas de gramatica, unas de oido, y al final una conversacion conmigo. La conversacion es la que mas pesa.'
      : 'Vamos a la mitad del nivel. Tres partes cortas y al final platicamos un rato.',
    esExamen:true, final:!!final,
    items:items
  };
}

// cambia una palabra de la frase para armar el par de "cual oiste"
function variarFrase(en){
  var cambios={'work':'walk','three':'free','live':'leave','fifteen':'fifty',
    'thirteen':'thirty','sit':'seat','ship':'sheep','man':'men','this':'these',
    'he':'she','at':'and','is':'was','has':'had','can':'can\'t'};
  var p=String(en).split(/\s+/);
  for(var i=0;i<p.length;i++){
    var limpio=p[i].toLowerCase().replace(/[.,!?]/g,'');
    if(cambios[limpio]){
      var nueva=cambios[limpio], cola=p[i].replace(/^[A-Za-z']+/,'');
      // si la original iba con mayuscula (principio de frase), la nueva tambien
      if(/^[A-Z]/.test(p[i])) nueva=nueva.charAt(0).toUpperCase()+nueva.slice(1);
      p[i]=nueva+cola;
      return p.join(' ');
    }
  }
  return String(en).replace(/\.$/,' too.');
}

function arrancarExamen(final){
  if(!P){ try{personalizar();}catch(e){} return; }
  var E=materialExamen(final);
  if(!E||!E.items||E.items.length<2){
    avisito('Todavia no hay material suficiente para el examen. Sigue con la parada normal.');
    return;
  }
  MAT=MAT.concat([E]);
  sIdx=MAT.length-1; it=0; attempts=[]; vistos={}; t0=Date.now();
  say(final
    ? 'Ultima parada del nivel. Es el examen. Tranquilo, es para ver como vas.'
    : 'Vamos a la mitad del nivel. Examen corto.','es-MX');
  correr();
}

// Una sola puerta para empezar la parada, desde el mapa 3D y desde el viejo.
// Antes el boton del mapa 3D se brincaba los repasos.
function arrancarParada(){
  var c=progreso();
  if(!yaPersonalizo()){ personalizar(); return; }
  if(!MAT||!MAT.length){ try{ MAT=materialDe(P); }catch(e){} }
  if(esExamen(c.parada)){ arrancarExamen(esExamenFinal(c.parada)); return; }
  if(esRepaso(c.parada)){ arrancarRepaso(); return; }
  sIdx=(contenidoDe(c.parada)-1)%MAT.length; it=0; attempts=[]; t0=Date.now();
  correr();
}

/* ── la conversacion en dos fases ── */
// Todo vive aqui adentro. paso() dibuja la tarjeta UNA vez y de ahi en
// adelante solo se le cuelgan burbujas: la pantalla no se mueve.
var CH=null;

function chCaja(){ return document.getElementById('chcaja'); }
function chBurbuja(de,txt,es,clase){

  c.appendChild(d);
  c.scrollTop=c.scrollHeight;
  return d;
}
function chAvance(){
  var b=document.getElementById('chbar'); if(!b||!CH)return;
  var total=CH.plan.p1+CH.plan.p2;
  var hechos=(CH.fase===1?CH.i:CH.plan.p1+CH.i);

}
function chMic(txt,prendido){
  var m=document.getElementById('micchat'); if(!m)return;
  m.disabled=!prendido;
  m.innerHTML='<span class="ring2"></span> '+txt;
}
function chPie(txt){ var p=document.getElementById('chpie'); if(p)p.textContent=txt; }
function chFase(txt){ var f=document.getElementById('chfase'); if(f)f.textContent=txt; }

function arrancarCharla(x){
  CH={fase:1,i:0,x:x,dichos:[],turnos:[],inicio:Date.now(),ocupado:false};
  CH.plan=planCharla();
  CH.banco=bancoPreguntas();

  var intro='Última parte. Yo te hago preguntas y tú me contestas hablando. '+
            'Todo pasa aquí mismo, la pantalla no se mueve. '+CH.plan.largo+'.';
  say(intro,'es-MX');
  var m=document.getElementById('micchat');
  if(m)m.onclick=function(){ chOir(m); };

}

function ctxExamen(){
  var n=nivelTexto(), g=(P&&P.gusto_es)||'', t=(P&&P.trabajo_es)||'';
  var e=enfoqueDe();
  var deQue = e==='vida'
    ? 'Preguntale de su vida: su gente, su casa, sus viajes, lo que le gusta. NADA de oficina.'
    : e==='trabajo'
    ? 'Preguntale de su trabajo y de como es su dia ahi.'
    : 'Alterna: una de su vida, una de su trabajo, y asi.';
  if(CH.fase===1){
    return quienEs()+' '+deQue+' EXAMEN ORAL de ingles, nivel '+n+'. Eres un examinador amable. '+
      'Haces UNA sola pregunta por turno, corta y del nivel '+n+'. '+
      'No corrijas, no expliques, no des clase: reacciona en tres o cuatro palabras '+
      'y haz la siguiente pregunta. Varia los temas: su vida diaria, su gente, '+
      (g?'lo que le gusta ('+g+'), ':'')+'sus planes'+(t?' y su trabajo ('+t+')':'')+'. '+
      'No preguntes solo de trabajo. Vas en la pregunta '+(CH.i+1)+' de '+CH.plan.p1+'. '+
      'Cuando llegues a la '+CH.plan.p1+', despidete y pon fin en true.';
  }
  return quienEs()+' EXAMEN ORAL de ingles, nivel '+n+'. Ahora es al reves: el ALUMNO te pregunta a TI. '+
    'Contesta su pregunta como una persona normal, en una o dos frases del nivel '+n+', '+
    'y NO le devuelvas la pregunta ni le hagas otra. Si lo que dijo no fue una pregunta, '+
    'dile nada mas "Ask me a question" y espera. Va la '+(CH.i+1)+' de '+CH.plan.p2+'.';
}

function chPreguntar(){
  if(!CH)return;
  if(CH.i>=CH.plan.p1){ chFase2(); return; }
  CH.ocupado=true;
  chMic('Espera…',false);
  var esp=chBurbuja('ia','pensando…','','esp');
  function suelta(q,es){
    if(esp&&esp.remove)esp.remove();
    CH.turnos.push({de:'personaje',txt:q});
    chBurbuja('ia',q,es||'');
    say(q,'en-US');
    CH.ocupado=false;
    chMic('Tocar y contestar',true);
    chPie('Contesta hablando. '+CH.plan.largo+'.');
  }
  if(hayIA()){
    var ultimo=CH.dichos.length?CH.dichos[CH.dichos.length-1].txt:'';
    roleplayConIA({quien:'Examiner',ctx:ctxExamen(),turnos:CH.turnos},ultimo||'(empieza el examen)',function(res){
      if(res&&res.dice) suelta(res.dice,res.es||'');
      else suelta(CH.banco[CH.i%CH.banco.length],'');
    });
  }else{
    setTimeout(function(){ suelta(CH.banco[CH.i%CH.banco.length],''); },500);
  }
}

function chFase2(){
  if(!CH)return;
  CH.fase=2; CH.i=0;
  chAvance();
  chFase('Fase 2 de 2 · ahora tú preguntas');
  chMic('Espera…',false);
  var av='Ahora al revés. Tú me preguntas a mí. Hazme las preguntas que quieras, en inglés.';
  chBurbuja('ia','Now you ask me. Go ahead.','Ahora pregúntame tú.');
  say(av,'es-MX',function(){ say('Now you ask me. Go ahead.','en-US'); });
  var ar=arranquesPregunta();
  if(ar.length){
    var caja=document.getElementById('chayuda');
    if(caja){
      caja.innerHTML='<b>Puedes empezar así</b>'+ar.map(function(a){
        return '<span>'+esc(a)+'</span>'; }).join('');
      caja.style.display='';
    }
  }
  setTimeout(function(){
    CH.ocupado=false;
    chMic('Tocar y preguntar',true);
    chPie('Hazme una pregunta en inglés. Van '+CH.plan.p2+'.');
  },2600);

// El boton de "no se esta". No castiga: cuenta como turno no contestado
// y sigue, porque trabarse en una pregunta no debe acabar el examen.
function chSaltar(){
  if(!CH||CH.ocupado)return;
  callarTodo();
  chBurbuja('yo','(no contest\u00f3 esta)','');
  CH.dichos.push({fase:CH.fase,txt:'',trabado:false,saltada:true});
  attempts.push({tipo:CH.fase===1?'examen-contesta':'examen-pregunta',
                 meta:'',oido:'',pct:0});
  CH.i++;
  chAvance();
  if(CH.fase===1){ chMic('Espera\u2026',false); setTimeout(chPreguntar,600); }
  else if(CH.i>=CH.plan.p2){ setTimeout(chTerminar,600); }
  else { chPie('Va la siguiente. Te quedan '+(CH.plan.p2-CH.i)+'.'); }

function chOir(b){
  if(!CH||CH.ocupado)return;
  callarTodo();
  b.classList.add('rec'); b.disabled=true;
  b.innerHTML='<span class="ring2"></span> Grabando…';
  chPie('Te estoy oyendo. Habla sin prisa; no te voy a cortar.');
  listen('en-US',function(t,conf,extra){
    b.classList.remove('rec');
    chRecibir(t,conf,extra);
  },function(err){
    b.classList.remove('rec'); b.disabled=false;
    if(err==='no-speech'){
      b.innerHTML='<span class="ring2"></span> No te oí · otra vez';
      chPie('No te oí. Acércate al micrófono y toca otra vez.');
      return;
    }
    b.innerHTML='<span class="ring2"></span> Otra vez';
    chPie('El micrófono falló. Toca otra vez o salta esta.');
  },{meta:''});
}

function chRecibir(t,conf,extra){
  if(!CH)return;
  t=String(t||'').trim();
  if(!t){ chMic(CH.fase===1?'Tocar y contestar':'Tocar y preguntar',true); return; }
  chBurbuja('yo',t,'');
  CH.dichos.push({fase:CH.fase,txt:t,trabado:!!(extra&&extra.trabado)});
  CH.turnos.push({de:'alumno',txt:t});
  attempts.push({tipo:CH.fase===1?'examen-contesta':'examen-pregunta',
                 meta:CH.fase===1?(CH.turnos.length>1?CH.turnos[CH.turnos.length-2].txt:''):'',
                 oido:t,pct:null});
  if(extra&&extra.trabado){
    chPie('Se te trabó tantito. No pasa nada, eso cuenta igual.');
  }
  CH.i++;
  chAvance();
  if(CH.fase===1){
    chMic('Espera…',false);
    setTimeout(chPreguntar,900);
  }else{
    chResponder(t);
  }
}

function chResponder(preg){
  if(!CH)return;
  CH.ocupado=true;
  chMic('Espera…',false);
  var esp=chBurbuja('ia','pensando…','','esp');
  function suelta(r,es){
    if(esp&&esp.remove)esp.remove();
    CH.turnos.push({de:'personaje',txt:r});
    chBurbuja('ia',r,es||'');
    say(r,'en-US');
    CH.ocupado=false;
    if(CH.i>=CH.plan.p2){ setTimeout(chTerminar,2200); return; }
    chMic('Tocar y preguntar',true);
    chPie('Otra pregunta. Te quedan '+(CH.plan.p2-CH.i)+'.');
  }
  if(hayIA()){
    roleplayConIA({quien:'Examiner',ctx:ctxExamen(),turnos:CH.turnos},preg,function(res){
      if(res&&res.dice) suelta(res.dice,res.es||'');
      else suelta(respuestaDeRespaldo(preg),'');
    });
  }else{
    setTimeout(function(){ suelta(respuestaDeRespaldo(preg),''); },600);
  }
}

// Sin cerebro, igual contesta algo con sentido segun con que empezo la
// pregunta. Vale mas una respuesta sencilla que un silencio.
function respuestaDeRespaldo(p){
  var t=String(p||'').toLowerCase().trim();
  if(!pareceP(t)) return 'Ask me a question. Any question.';
  if(/^where/.test(t))            return 'I live in Mexico City. I like it here.';
  if(/^when/.test(t))             return 'Usually in the morning, around seven.';
  if(/^who/.test(t))              return 'My family, mostly. And a couple of good friends.';
  if(/^why/.test(t))              return 'Because I enjoy it, and it keeps me busy.';
  if(/^how (old|many|much|long)/.test(t)) return 'Not too many. Maybe four or five.';
  if(/^how/.test(t))              return 'Pretty well, thank you. And you?';
  if(/^what.*(name)/.test(t))     return 'My name is Sam. Nice to meet you.';
  if(/^what.*(do|work|job)/.test(t)) return 'I am a teacher. I work with adults.';
  if(/^what/.test(t))             return 'That is a good question. I would say coffee and a quiet morning.';
  if(/^(do|does|did|are|is|was|were|have|has|can|could|will|would)\b/.test(t))
                                  return 'Yes, I do. Quite often, actually.';
  return 'Good question. Yes, I think so.';
}

function pareceP(t){
  t=String(t||'').trim().toLowerCase();
  if(!t)return false;
  if(/\?\s*$/.test(t))return true;
  return /^(what|where|when|who|whose|why|how|which|do|does|did|are|is|am|was|were|can|could|will|would|have|has|had|may|might|should|shall|tell me)\b/.test(t);
}

function chTerminar(){

  var f=document.getElementById('chfase'); if(f)f.textContent='Ya acabó · revisando';
  var caja=document.getElementById('chayuda'); if(caja)caja.style.display='none';
  var b=document.getElementById('chbar'); if(b)b.style.width='100%';
  var loc=calificarLocal();
  var listo=false;
  function pinta(res){
    if(listo)return; listo=true;
    pintarVeredicto(loc,res);
  }
  if(hayIA()){
    pedirIA('evaluar',{
      nombre:(P&&P.nombre)||'', nivel:nivelTexto(),
      trabajo:(P&&P.trabajo_es)||'', gusto:(P&&P.gusto_es)||'',
      sesion:'EXAMEN ORAL de nivel '+nivelTexto()+
        ' - fase 1 el examinador pregunta, fase 2 el alumno pregunta',
      intentos:CH.dichos.map(function(z,i){
        return {tipo:(z.fase===1?'contesto':'pregunto'),meta:'',dijo:z.txt,pct:null};
      })
    },function(res){ pinta(res); },function(){ pinta(null); });
    setTimeout(function(){ pinta(null); },14000);
  }else{
    setTimeout(function(){ pinta(null); },700);
  }
}

function calificarLocal(){
  var p=CH.plan, d=CH.dichos;
  var contesto=d.filter(function(z){return z.fase===1&&z.txt;}).length;
  var pregunto=d.filter(function(z){return z.fase===2&&pareceP(z.txt);}).length;
  var largas=d.filter(function(z){return cuantasPalabras(z.txt)>=p.min;}).length;
  var palabras=d.map(function(z){return z.txt;}).join(' ').trim().split(/\s+/).filter(Boolean).length;
  var pct=Math.round(100*(
    0.40*Math.min(1,contesto/p.p1)+
    0.30*Math.min(1,pregunto/Math.max(1,p.p2))+
    0.30*Math.min(1,largas/Math.max(1,d.length||1))
  ));
  // preguntar es la mitad del examen. Sin llegar a la mitad de la fase 2
  // no se pasa, aunque haya contestado todo perfecto.
  if(pregunto < Math.ceil(p.p2/2)) pct=Math.min(pct,55);
  return {pct:pct,contesto:contesto,pregunto:pregunto,palabras:palabras,
          deP1:p.p1,deP2:p.p2};
}

function pintarVeredicto(loc,res){
  var caja=document.getElementById('res'); if(!caja)return;
  // fuera los botones de la conversacion: ya acabo
  ['micchat','chsalta'].forEach(function(id){
    var b=document.getElementById(id); if(b&&b.remove)b.remove();
  });
  var _f=document.getElementById('chfase');
  if(_f)_f.textContent='Ya acab\u00f3';
  var _p=document.getElementById('chpie'); if(_p&&_p.remove)_p.remove();
  var pasa=loc.pct>=60;
  var final=!!(CH&&CH.x&&CH.x.final);
  var titulo=pasa?(loc.pct>=85?'Muy bien':'Pasaste'):'Todavía no';
  var cuerpo=
    '<div class="chnota"><span class="gr">'+loc.pct+'%</span>'+
    '<b>'+esc(titulo)+'</b><br>'+
    'Contestaste '+loc.contesto+' de '+loc.deP1+' preguntas y me hiciste '+
    loc.pregunto+' de '+loc.deP2+'. Dijiste '+loc.palabras+' palabras en inglés.'+
    (res&&res.comentario?'<div class="pes" style="margin-top:8px">'+esc(res.comentario)+'</div>':'')+
    ((res&&res.errores&&res.errores.length)
      ? '<div style="margin-top:9px"><b style="font-size:12px">Lo que hay que volver a ver</b><br>'+
        res.errores.slice(0,3).map(function(e){
          return '· '+esc(typeof e==='string'?e:(e.frase||e.error||e.que||''));
        }).join('<br>')+'</div>'
      : '')+
    '</div>';
  if(!pasa){
    cuerpo+='<p class="tiny">No es reprobar. Quiere decir que conviene repetir el nivel '+
      'un poco más antes de subir. Yo te guardo lo que se te atoró.</p>';
  }else if(final){
    cuerpo+='<p class="tiny">Terminaste el nivel '+esc(nivelTexto())+'.</p>';
  }
  caja.innerHTML=cuerpo+'<button class="btn" id="chfin" style="margin-top:12px">'+
    (final?'Cerrar el nivel':'Seguir')+'</button>';
  var d=load();
  d.examenes=d.examenes||[];
  d.examenes.push({fecha:new Date().toISOString().slice(0,10),nivel:nivelTexto(),
    final:final,pct:loc.pct,contesto:loc.contesto,pregunto:loc.pregunto,
    palabras:loc.palabras,dichos:CH.dichos.slice()});
  save(d); D=d;
  say(pasa?'Pasaste. Buen trabajo.':'Todavía no, pero ya casi. Lo repasamos.','es-MX');
  var bf=document.getElementById('chfin');
  if(bf)bf.onclick=function(){
    CH=null; it++; paso();          // esto dispara el cierre de la sesion
    if(final&&pasa)setTimeout(ofrecerSubirNivel,0);   // y hasta despues, subir
  };
}

// Al pasar el examen final, si el nivel de arriba ya tiene material, se le
// ofrece. Si todavia no esta escrito, se le dice la verdad.
function ofrecerSubirNivel(){
  var orden=['Pre-A1','A1','A2','B1','B2','C1','C2'];
  var i=nOrden(nivelTexto());
  if(i>=orden.length-1)return;
  var sig=orden[i+1];
  if(typeof NIVELES_ABIERTOS!=='undefined' && NIVELES_ABIERTOS.indexOf(i+1)<0){
    avisito('Terminaste '+nivelTexto()+'. '+sig+' todavía se está escribiendo.');
    return;
  }
  try{
    P.nivel=sig; P.nivel_n=i+1;
    var d=load(); d.perfil=P;
    d.camino=d.camino||{}; d.camino.parada=1; d.camino.maxima=1;
    save(d); D=d;
    MAT=materialDe(P);
    avisito('Subiste a '+sig+'. Empiezas desde la parada 1.');
  }catch(e){}
}

function portada(){
  var vuelve=!!P;
  var tb=document.querySelector('.topbar');
  if(tb)tb.style.display='none';
  var g=saludoDelDia(vuelve);

  var historial=[];
  function pinta(s){
    if(!s||!s.en)s=SALUDOS[0];          // nunca pintar undefined
    if(s.reg==null)s.reg=0;
    var vistos=(D.saludosVistos||[]).length;
    APP.innerHTML='<div class="splash" id="sp">'+
      '<div class="sp-mark">'+
        '<svg viewBox="0 0 96 96" aria-hidden="true">'+
          '<circle cx="48" cy="48" r="40" fill="none" stroke="rgba(40,32,20,.13)" stroke-width="5"/>'+
          '<circle cx="48" cy="48" r="40" fill="none" stroke="#C9A84C" stroke-width="5" '+
            'stroke-linecap="round" stroke-dasharray="66 185" transform="rotate(-90 48 48)"/>'+
          '<circle cx="48" cy="48" r="9" fill="#C9A84C"/>'+
        '</svg>'+
      '</div>'+
      '<div class="sp-greet" id="gr">'+esc(s.en)+(vuelve?'<span class="sp-nm">'+esc(P.nombre)+'.</span>':'')+'</div>'+
      '<div class="sp-es">'+esc(s.es)+'</div>'+
      '<div class="sp-reg">'+REGISTRO[s.reg]+'</div>'+
      '<div class="sp-nav">'+
        (historial.length?'<button class="sp-b" id="ant">← Anterior</button>':'')+
        '<button class="sp-b" id="otro">Otro saludo ↻</button>'+
      '</div>'+
      '<button class="btn sp-go" id="cta">Continuar</button>'+
      '<div class="sp-name">English For All</div>'+
      '<div class="sp-cuenta">'+vistos+' de '+SALUDOS.length+' saludos vistos</div>'+
      '</div>';
    ligar(s);
  }

  var hablado=false,avanzado=false;
  var intentos=0;
  function saludar(s){
    hablado=true;
    soloTuVoz(s.en,function(sono){
      if(sono||intentos>=6)return;
      // ese saludo no está grabado: se cambia por otro que sí lo esté,
      // para que nunca se oiga la voz sintética en esta pantalla
      intentos++;
      var otro=saludoDelDia(vuelve);
      if(otro.en===s.en)return;
      g=otro;pinta(g);saludar(g);
    });
  }
  function avanzar(){
    if(avanzado)return;
    avanzado=true;
    if(!hablado)saludar(g);
    vioSaludo=true;D.vista=1;save(D);
    var sp=document.getElementById('sp');
    if(sp)sp.classList.add('out');
    setTimeout(router,340);
  }
  function ligar(s){
    var gr=document.getElementById('gr');
    if(gr)gr.onclick=function(e){e.stopPropagation();saludar(s);};
    var ot=document.getElementById('otro');
    if(ot)ot.onclick=function(e){
      e.stopPropagation();
      historial.push(g);
      g=saludoDelDia(vuelve);
      pinta(g);
      saludar(g);
    };
    var an=document.getElementById('ant');
    if(an)an.onclick=function(e){
      e.stopPropagation();
      if(!historial.length)return;
      g=historial.pop();
      pinta(g);
      saludar(g);
    };
    var cta=document.getElementById('cta');
    if(cta)cta.onclick=function(e){e.stopPropagation();avanzar();};
  }

  pinta(g);

  cargarVoces(function(){
    aplicarPreferencias();
    // se intenta de entrada; casi todos los navegadores lo bloquean hasta
    // que hay un toque, y para eso está el listener de abajo
    saludar(g);
  });

  // el primer toque libera el audio en los navegadores que lo bloquean
  ['pointerdown','keydown','touchstart'].forEach(function(ev){
    document.addEventListener(ev,function(){if(!hablado)saludar(g);},{once:true});
  });
}

      if(sel!==null)soloTuVoz('Hello. This is how I am going to speak to you.',function(){});

  });

  setTimeout(function(){ if(!yaCerro){faltan=1;cerrar();} },3000);

      a.oncanplaythrough=function(){listos[idx]=p;cerrar();};
      a.onerror=intenta;
      try{a.load();}catch(e){cerrar();}
    })();
  });
  function elegir(id){
    D.paquete=id;D.velAudio=VEL_AUDIO;save(D);
    PAQUETE_ACTIVO=id;armarRutas();router();
  }
  function cerrar(){
    if(yaCerro)return;
    if(--faltan>0)return;
    yaCerro=true;
    var hay=listos.filter(Boolean);
    if(hay.length<=1){elegir(hay.length?hay[0].id:'audio');return;}
    document.getElementById('vl').innerHTML=hay.map(function(p,i){
      return '<button class="vopt" data-i="'+i+'"><span class="vn">'+esc(p.nombre)+'</span>'+
             '<span class="vp">'+esc(p.nota)+'</span><span class="vplay">▶</span></button>';
    }).join('');
    APP.querySelectorAll('.vopt').forEach(function(b){
      b.onclick=function(){

      };
    });
    document.getElementById('ok').onclick=function(){ if(sel!==null)elegir(hay[sel].id); };
  }
}

  {id:'hora',lbl:'Tu día',q:'¿A qué hora empiezas?',sub:'',tipo:'pick',ops:HORAS},
  {id:'gusto',lbl:'Tú',q:'¿Qué te gusta?',sub:'Puedes escoger varias. Si no está la tuya, escríbela.',tipo:'pick',ops:GUSTOS,multi:true,otra:'Otra cosa…',otraPh:'Ej: bailar, el box, mis plantas'},
  {id:'meta',lbl:'Tú',q:'¿Para qué quieres el inglés?',sub:'Puedes escoger varias. No hay respuesta correcta.',tipo:'pick',ops:METAS,multi:true,otra:'Otra razón…',otraPh:'Ej: para irme a vivir a Canadá'},
  {id:'enfoque',lbl:'Tú',q:'¿Qué inglés te sirve más?',sub:'Con esto decido de qué van tus frases, tus conversaciones y tus ejemplos.',tipo:'pick',ops:ENFOQUES,sinVoz:true}
];
var epaso=0,edatos={};

function entrevista(){
  var s=PASOS[epaso];
  var textoAyuda=(s.tipo==='pick')
    ? 'Toca la respuesta que más se parezca a ti. Luego toca Continuar.'
    : 'Escribe tu respuesta en el cuadro, o toca el botón para decirla en voz alta. Luego toca Continuar.';
  var h=atras()+ayuda(textoAyuda,(epaso<PASOS.length-1?'la siguiente pregunta':'una prueba corta de inglés'))+'<div class="prog">'+PASOS.map(function(x,i){return '<i class="'+(i<=epaso?'on':'')+'"></i>';}).join('')+'</div>'+
    '<div class="qcard"><div class="qlbl">Paso 2 de 5 · pregunta '+(epaso+1)+' de '+PASOS.length+'</div>'+
    '<div class="qtxt">'+s.q+'</div>'+(s.sub?'<div class="qsub">'+s.sub+'</div>':'<div style="height:8px"></div>');

  if(s.tipo==='libre'){
    h+='<textarea class="typebox" id="tx" placeholder="'+s.ph+'" style="min-height:80px">'+
       esc(edatos[s.id+'_es']||'')+'</textarea>'+
       (HAY_MIC?'<button class="btn ghost" id="dic"><span class="pulse"></span> Decirlo en voz alta</button>':'')+
       '<button class="btn" id="ok" style="margin-top:8px">Continuar</button>';
  }else if(s.tipo==='texto'){
    h+='<textarea class="typebox" id="tx" placeholder="'+s.ph+'">'+
       esc(s.id==='nombre'?(edatos.nombre||''):'')+'</textarea>'+
       (HAY_MIC?'<button class="btn ghost" id="dic"><span class="pulse"></span> Decirlo en voz alta</button>':'')+
       '<button class="btn" id="ok" style="margin-top:8px">Continuar</button>';
  }else{
    h+='<div class="pick" id="pk">'+s.ops.map(function(o,i){
      return '<button data-i="'+i+'">'+esc(o[0])+'<i>'+esc(o[1])+'</i></button>';}).join('')+
      (s.otra?'<button data-otra="1" class="otra">'+esc(s.otra)+'</button>':'')+'</div>'+
      (s.otra?'<textarea class="typebox" id="txotra" placeholder="'+esc(s.otraPh||'')+'" style="display:none;min-height:56px"></textarea>':'')+
      (s.multi?'<p class="tiny" style="margin:0 0 12px;text-align:left">Toca todas las que quieras.</p>':'')+
      '<button class="btn" id="ok" disabled>Continuar</button>';
  }
  h+='<p class="tiny">Esto solo se pregunta una vez. Con tus respuestas armo tu material.</p></div>';
  APP.innerHTML=h;
  ligarAyuda(textoAyuda);
  ligarAtras(function(){
    if(epaso>0){epaso--;entrevista();}
    else{irA('voz');}
  });

  if(epaso===0){
    decirSeguido([['Muy bien. Ahora quiero saber quién eres.','es-MX'],[s.q,'es-MX']]);
  }else{
    say(s.q,'es-MX');
  }

  if(s.tipo==='texto'||s.tipo==='libre'){
    var d=document.getElementById('dic');
    if(d)d.onclick=function(){
      var b=this;b.classList.add('rec');b.innerHTML='<span class="pulse"></span> Escuchando…';
      listen('es-MX',function(t){
          document.getElementById('tx').value=t;
          b.classList.remove('rec');b.innerHTML='<span class="pulse"></span> Decirlo otra vez';
        },
        function(err){
          b.classList.remove('rec');
          if(err==='no-speech'){b.innerHTML='<span class="pulse"></span> No te oí · intenta otra vez';return;}
          b.disabled=true;
          b.textContent=err==='not-allowed'?'Falta permiso del micrófono · escríbelo'
                       :'Tu navegador no reconoce voz · escríbelo';
        });
    };
    document.getElementById('ok').onclick=function(){
      var v=document.getElementById('tx').value.trim();
      if(!v){
        var av=document.getElementById('avisovacio');
        if(!av){
          av=document.createElement('div');
          av.id='avisovacio';av.className='tst-r';
          av.innerHTML='<span class="no2">Escribe o dicta tu respuesta antes de continuar.</span>';
          document.getElementById('tx').parentNode.insertBefore(av,document.getElementById('tx').nextSibling);
        }
        say('Escribe o dicta tu respuesta antes de continuar.','es-MX');
        return;
      }
      if(s.id==='nombre'){
        var n=limpiarNombre(v);
        if(!n){
          var av2=document.getElementById('avisovacio');
          if(!av2){
            av2=document.createElement('div');
            av2.id='avisovacio';av2.className='tst-r';
            av2.innerHTML='<span class="no2">No entendí tu nombre. Escríbelo solo, sin nada más.</span>';
            document.getElementById('tx').parentNode.insertBefore(av2,document.getElementById('tx').nextSibling);
          }
          return;
        }
        edatos.nombre=n;
      }else{
        edatos[s.id+'_es']=(s.id==='trabajo')?limpiarOficio(v):(s.id==='accion'?limpiarAccion(v):v);
        edatos[s.id+'_en']=null;   // lo traduce el analizador
      }
      avanzar();
    };
  }else{
    var sel=[],otraOn=false;
    var caja=document.getElementById('txotra');
    function revisa(){
      var hay=sel.length>0||(otraOn&&caja&&caja.value.trim());
      document.getElementById('ok').disabled=!hay;
    }
    APP.querySelectorAll('#pk button').forEach(function(b){
      b.onclick=function(){
        if(b.dataset.otra){
          otraOn=!otraOn;
          b.classList.toggle('sel',otraOn);
          if(caja){caja.style.display=otraOn?'block':'none';if(otraOn)caja.focus();}
          revisa();return;
        }
        var i=+b.dataset.i;
        if(s.multi){
          var k=sel.indexOf(i);
          if(k>=0){sel.splice(k,1);b.classList.remove('sel');}
          else{sel.push(i);b.classList.add('sel');if(!s.sinVoz)say(s.ops[i][1],'en-US');}
        }else{
          APP.querySelectorAll('#pk button').forEach(function(x){x.classList.remove('sel');});
          b.classList.add('sel');sel=[i];
          if(!s.sinVoz)say(s.ops[i][1],'en-US');
        }
        revisa();
      };
    });
    if(caja)caja.oninput=revisa;
    document.getElementById('ok').onclick=function(){
      var es=sel.map(function(i){return s.ops[i][0];});
      var en=sel.map(function(i){return s.ops[i][1];});
      if(otraOn&&caja&&caja.value.trim()){
        es.push(caja.value.trim());
        edatos[s.id+'_otra']=caja.value.trim();
      }
      if(!es.length)return;
      edatos[s.id+'_es']=es.join(' y ');
      edatos[s.id+'_en']=(s.sinVoz||!en.length)?null:en.join(' and ');
      avanzar();
    };
  }
}

function ultimoDato(){
  // qué rescatar de la vez pasada, para que la sesión no arranque en frío
  if(!D.sesiones.length)return null;
  var r=D.sesiones[D.sesiones.length-1];
  var reps=(r.intentos||[]).filter(function(a){return a.pct!==null&&a.pct!==undefined;});
  if(reps.length){
    var peor=reps.reduce(function(a,b){return b.pct<a.pct?b:a;});
    if(peor.pct<80)return {tipo:'repetir',meta:peor.meta,pct:peor.pct,ses:r.s};
  }
  var libre=(r.intentos||[]).filter(function(a){return a.tipo==='free'&&a.oido;});
  if(libre.length)return {tipo:'dijo',texto:libre[libre.length-1].oido,ses:r.s};
  if((r.intentos||[]).some(function(a){return a.tipo==='pista';}))return {tipo:'pista',ses:r.s};
  return {tipo:'ok',ses:r.s};
}

// Lee la lección y explica QUÉ va a ver el alumno: la regla de gramática,
// las palabras nuevas, qué va a oír y qué va a decir. Antes solo decía el tema.
function loQueViene(S){
  var it=(S&&S.items)||[];
  var gram=[], voc=[], oir=[], hab=[];

  var NOMBRA={
    idea:'entender de qué se trata sin traducir cada palabra',
    detalle:'cazar un dato exacto: una hora, un número, un lugar',
    dosc:'distinguir dos frases que suenan casi igual',
    segm:'separar palabras en habla rápida',
    dicto:'escribir lo que oigas',
    acento:'la misma frase en cuatro países distintos',
    recuento:'oír una historia y contarla con tus palabras'
  };

  it.forEach(function(x){
    if(x.k==='regla'&&x.titulo)      gram.push(x.titulo);
    else if(x.k==='cazar'&&x.buena)  gram.push('corregir "'+x.mala+'" → "'+x.buena+'"');
    else if(x.k==='transf'&&x.pide)  gram.push(String(x.pide).replace(/\.$/,''));
    else if(x.k==='hueco'&&x.bien)   gram.push('escoger la forma correcta del verbo');
    else if(x.k==='ordenar')         gram.push('el orden de las palabras');
    else if(x.k==='phrasal'&&x.en)   voc.push(x.en+' — '+(x.es||''));
    else if(x.k==='idiom'&&x.en)     voc.push(x.en+' (expresión)');
    else if(x.k==='palabra'&&x.en)   voc.push(x.en+' — '+(x.es||''));
    else if(x.k==='pares')           voc.push('dos sonidos parecidos: '+(x.a||'')+' / '+(x.b||''));
    else if(x.k==='deletreo'&&x.bien)voc.push('deletrear "'+x.bien+'"');
    else if(NOMBRA[x.k])             oir.push(NOMBRA[x.k]);
    else if(x.k==='roleplay')        hab.push('contestarle a '+(x.quien||'alguien')+', hablando');
    else if(x.k==='model'&&x.en)     hab.push(x.en);
  });

  function unico(a){var v={},o=[];a.forEach(function(z){if(!v[z]){v[z]=1;o.push(z);}});return o;}
  gram=unico(gram); voc=unico(voc); oir=unico(oir); hab=unico(hab);

  if(!gram.length&&!voc.length&&!oir.length&&!hab.length)return '';

  function bloque(tit,arr,corte){
    if(!arr.length)return '';
    return '<div class="lqv-b"><div class="lqv-t">'+tit+'</div>'+
      arr.slice(0,corte).map(function(z){return '<div class="lqv-i">'+esc(z)+'</div>';}).join('')+
      '</div>';
  }
  return '<div class="lqv"><div class="lqv-h">Lo que vas a ver hoy</div>'+
    bloque('Gramática',gram,3)+
    bloque('Palabras nuevas',voc,4)+
    bloque('Vas a oír',oir,3)+
    bloque('Vas a decir',hab,3)+
    '<button class="lqv-oir" id="lqvoir">'+ico('bocina',15)+' Que me lo digan</button>'+
  '</div>';
}

// lo mismo pero para decirlo en voz alta
function loQueVieneHablado(S){
  var it=(S&&S.items)||[];
  var g=[],v=[];
  it.forEach(function(x){
    if(x.k==='regla'&&x.titulo)g.push(x.titulo);
    if(x.k==='phrasal'&&x.en)v.push(x.en);
    if(x.k==='idiom'&&x.en)v.push(x.en);
  });
  var t='';
  if(g.length)t+='La regla de hoy es: '+g[0]+'. ';
  if(v.length)t+='Vas a aprender '+v.slice(0,2).join(' y ')+'. ';
  return t;
}

  mostrarAyudaSiToca('leccion');

      var bien=normal(dicho)===normal(x.bien);
      var r=document.getElementById('res');
      if(r)r.innerHTML=bien?'<div class="fb ok">Perfecto: <b>'+esc(x.bien)+'</b></div>'
                           :'<div class="fb no">Casi. Era <b>'+esc(x.bien)+'</b></div>';
      attempts.push({tipo:'deletreo',meta:x.bien||'',oido:dicho,pct:bien?100:0});
      registrarEnMemoria(x.bien||'',bien?100:0);
      say(x.bien||'','en-US');

      setTimeout(function(){it++;paso();},2600);

  // ---- tipos nuevos: gramatica y listening ----
  var _audioDe = x.audio || x.bien || x.origen || x.en || x.q || '';
  if(x.k==='regla'||x.k==='transf'){

  // el botón de "más lento" vale para todos los de oír
  (function(){

    if(x.k==='pares')txt=(x.bien==='b')?(x.b||''):(x.a||'');

    if(_oL)_oL.onclick=function(){

  }
  if(x.k==='regla'){
    setTimeout(function(){

    var _sg=document.getElementById('sigue');

      attempts.push({tipo:'regla',meta:x.titulo||'',oido:'vio la regla',pct:null});

    };
  }
  if(x.k==='cazar'){
    APP.querySelectorAll('#cazafila .palb').forEach(function(b){
      b.onclick=function(){
        var w=b.dataset.w, bien=normal(w)===normal(x.mala);
        b.classList.add(bien?'ok':'no');
        attempts.push({tipo:'cazar',meta:x.mala+' -> '+x.buena,oido:w,pct:bien?100:0});
        registrarEnMemoria(x.frase||'',bien?100:0);
        var r=document.getElementById('res');
        if(r)r.innerHTML = bien
          ? '<div class="fb ok">Esa era. Va asi: <b>'+esc(x.buena)+'</b></div>'
          : '<div class="fb no">Esa esta bien. La mala era <b>'+esc(x.mala)+'</b>, va <b>'+esc(x.buena)+'</b></div>';
        APP.querySelectorAll('#cazafila .palb').forEach(function(o){o.disabled=true;});
        setTimeout(function(){it++;paso();},2200);
      };
    });
  }
  if(x.k==='hueco'){
    APP.querySelectorAll('#huecops .opt').forEach(function(b){
      b.onclick=function(){
        var o=(x.ops||[])[+b.dataset.i], bien=normal(o)===normal(x.bien);
        b.classList.add(bien?'ok':'no');
        attempts.push({tipo:'hueco',meta:x.bien,oido:o,pct:bien?100:0});
        registrarEnMemoria((x.antes||'')+x.bien+(x.despues||''),bien?100:0);
        APP.querySelectorAll('#huecops .opt').forEach(function(z){z.disabled=true;});
        if(bien)say((x.antes||'')+' '+x.bien+' '+(x.despues||''),'en-US');
        explicarRespuesta({
          caja:'#huecops', bien:bien, elegida:o, correcta:x.bien,
          contexto:'La frase es: '+(x.antes||'')+'___'+(x.despues||'')+' ('+(x.es||'')+').',

      setTimeout(function(){it++;paso();},2600);

    APP.querySelectorAll('#piezas .palb').forEach(function(b){

    var _br=document.getElementById('borrar');
    if(_br)_br.onclick=function(){
      _arm=[]; _pinta();
      APP.querySelectorAll('#piezas .palb').forEach(function(z){z.disabled=false;z.classList.remove('usada');});
    };

  if(x.k==='idea'||x.k==='detalle'||x.k==='dosc'){

        else { sel=(x.ops||[])[i]; bien=normal(sel)===normal(x.bien); }
        b.classList.add(bien?'ok':'no');
        attempts.push({tipo:x.k,meta:x.k==='dosc'?(x.bien==='a'?x.a:x.b):x.bien,oido:sel,pct:bien?100:0});
        registrarEnMemoria(_audioDe,bien?100:0);
        var r=document.getElementById('res');
        if(r)r.innerHTML = bien ? '<div class="fb ok">Correcto.</div>'
              : '<div class="fb no">Era <b>'+esc(x.k==='dosc'?(x.bien==='a'?x.a:x.b):x.bien)+'</b></div>';
