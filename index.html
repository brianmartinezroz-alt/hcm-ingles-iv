      attempts.push({tipo:'dicto',meta:x.bien||'',oido:dicho,pct:pct});
      registrarEnMemoria(x.bien||'',pct);
      say(x.bien||'','en-US');
      _rv.disabled=true;
      setTimeout(function(){it++;paso();},3200);
    };
  }

  if(x.k==='num'){
    setTimeout(function(){say(x.en,'en-US');},300);
    APP.querySelectorAll('#numops .opt').forEach(function(b){
      b.onclick=function(){
        var bien=x.ops[+b.dataset.i].en===x.bien.en;
        b.classList.add(bien?'ok':'no');
        document.getElementById('res').innerHTML='<div class="heard">'+
          (bien?'<span class="ok2">Eso es. Era '+esc(x.bien.es)+' · '+esc(x.bien.en)+'.</span>'
               :'<span class="no2">Era '+esc(x.bien.es)+' · '+esc(x.bien.en)+'. Escúchalo otra vez.</span>')+
          '</div>'+
          (x.nota?'<div class="ctxbox" style="margin-top:10px">'+esc(x.nota)+'</div>':'')+
          '<button class="btn" id="sig">Siguiente</button>';
        if(x.nota)setTimeout(function(){say(x.nota,'es-MX');},700);
        attempts.push({tipo:'numeros',meta:x.bien.en,oido:x.ops[+b.dataset.i].en,pct:bien?100:0});
        document.getElementById('sig').onclick=function(){it++;paso();};
      };
    });
  }
  var pb=document.getElementById('pista');
  if(pb)pb.onclick=function(){
    document.getElementById('res').innerHTML='<div class="heard"><div class="hl">di esto</div><div class="ht">'+esc(x.pista)+'</div></div>';
    say(x.pista,'en-US');
    attempts.push({tipo:'pista',meta:x.pista,oido:'',pct:null});
    pb.remove();
  };

  var _mic=document.getElementById('mic');
  if(_mic)_mic.onclick=function(){
    var b=this;
    callarTodo();                       // silencio antes de oír al alumno
    if(!HAY_MIC){grabarPaso(x,b);return;}
    b.classList.add('rec');b.innerHTML='<span class="ring2"></span> Grabando…';b.disabled=true;
    var _r0=document.getElementById('res');
    if(_r0)_r0.innerHTML='<div class="grabando"><span class="punto"></span>'+
      'Te estoy grabando. Habla ahora.<br><small style="opacity:.75">'+
      'El audio se apagó para que solo se oiga tu voz.</small></div>';
    MI_GRABACION=null;
    if(x.k==='model'||x.k==='drill')empezarGrabacion();
    listen('en-US',function(t,conf,extra){
      pararGrabacion();
      b.classList.remove('rec');b.disabled=false;b.innerHTML='<span class="ring2"></span> Otra vez';
      registrar(x,t,extra);
    },function(err){
      pararGrabacion();
      b.classList.remove('rec');b.disabled=false;
      if(err==='no-speech'){
        b.innerHTML='<span class="ring2"></span> No te oí · intenta otra vez';
        var _r1=document.getElementById('res');
        if(_r1)_r1.innerHTML='<div class="fb no">No te oí. Acércate al micrófono y toca otra vez.</div>';
        return;
      }
      HAY_MIC=false;grabarPaso(x,b);
    });
  };
  ligarAyuda(ayudas[x.k]||'Sigue las instrucciones de la tarjeta.');
  ligarBilingue();
  var _sk=document.getElementById('skip');
  if(_sk)_sk.onclick=function(){it++;paso();};
  ligarAtras(function(){
    if(it>0){it--;paso();}
    else{it=0;attempts=[];portadaSesion();}
  });
}


function grabarPaso(x,b){
  callarTodo();   // que no se grabe la propia app

  var meta=(x.k==='model'||x.k==='drill')?x.en:'';
  if(!HAY_GRAB){escribir(x);return;}
  var r=document.getElementById('res');
  if(b.dataset.grabando==='1'){
    b.dataset.grabando='';
    b.classList.remove('rec');b.innerHTML='<span class="ring2"></span> Grabar otra vez';
    grabarFin();
    return;
  }
  r.innerHTML='<div class="heard"><div class="hl">modo grabación</div>'+
    '<div style="font-size:13px;color:var(--tinta-2);line-height:1.5">Tu teléfono no reconoce voz, '+
    'pero sí puede grabarte. Di la frase en voz alta y toca otra vez para parar. Brian la escucha después.</div></div>';
  grabarInicio(function(blob){
    var url=URL.createObjectURL(blob);
    blobABase64(blob,function(b64){
      attempts.push({tipo:x.k+'-audio',meta:x.k==='model'?x.en:x.q,oido:'[audio grabado]',pct:null,
                     audio:b64,audiotipo:blob.type,seg:Math.round(blob.size/2000)});
      r.innerHTML='<div class="heard"><div class="hl">tu grabación</div>'+
        '<audio controls src="'+url+'" style="width:100%;margin-top:4px"></audio>'+
        '<div class="tst-r"><span class="ok2">Guardada. Brian la escucha después.</span></div></div>'+
        // Sin reconocimiento de voz, el alumno se quedaba sin saber si le salió.
        // Ahora escribe lo que dijo y recibe la MISMA revisión que los demás.
        (meta?'<div class="qcard" style="margin-top:10px"><div class="qlbl">Ahora escribe lo que dijiste</div>'+
          '<div class="qsub">Tal como te salió, aunque creas que estuvo mal. Así te digo en qué falló.</div>'+
          '<input class="tx" id="dicho" placeholder="What I said…" autocomplete="off">'+
          '<button class="btn" id="revisa" style="margin-top:10px">Revisar lo que dije</button></div>'
        :'<button class="btn" id="sig">Siguiente</button>');
      var sg=document.getElementById('sig');
      if(sg)sg.onclick=function(){it++;paso();};
      var rv=document.getElementById('revisa');
      if(rv)rv.onclick=function(){
        var tx=document.getElementById('dicho');
        var dicho=((tx&&tx.value)||'').trim();
        if(!dicho){avisito('Escribe lo que dijiste, aunque sea a medias.');return;}
        registrar(x,dicho);
      };
    });
  },function(err){
    var m=err==='NotAllowedError'?'No diste permiso al micrófono. Revisa el candado de la barra de direcciones.'
         :'Tu navegador no deja grabar. Puedes escribir lo que dijiste.';
    r.innerHTML='<div class="heard"><span class="no2">'+m+'</span></div>';
    HAY_GRAB=false;escribir(x);
  });
  b.dataset.grabando='1';
  b.classList.add('rec');b.innerHTML='<span class="ring2"></span> Grabando… toca para parar';
}


// Tras la segunda escucha: una comprobación corta. No es examen — sirve para
// escuchar con un objetivo, que es lo que separa oír de entender.
function chequeoDe(x){
  var caja=document.getElementById('chequeo');
  if(!caja||caja.getAttribute('data-puesto'))return;
  caja.setAttribute('data-puesto','1');
  var q=String(x.q||'').toLowerCase(),op=null;
  if(/your name/.test(q))                      op=['Te pregunta tu nombre','Te pregunta la hora','Te pide una herramienta'];
  else if(/what do you do/.test(q))            op=['Te pregunta a qué te dedicas','Te pregunta dónde vives','Te da los buenos días'];
  else if(/where do you work/.test(q))         op=['Te pregunta dónde trabajas','Te pregunta qué hora es','Te pregunta tu nombre'];
  else if(/what time/.test(q))                 op=['Te pregunta a qué hora entras','Te pregunta tu nombre','Te pregunta si te gusta'];
  else if(/how are you/.test(q))               op=['Te pregunta cómo estás','Te pregunta dónde trabajas','Te pide ayuda'];
  else if(/do you work every day/.test(q))     op=['Te pregunta si trabajas diario','Te pregunta a qué hora sales','Te pregunta tu nombre'];
  else if(/what do you like/.test(q))          op=['Te pregunta qué te gusta','Te pregunta qué haces','Te pregunta la hora'];
  else if(/why are you learning/.test(q))      op=['Te pregunta para qué estudias inglés','Te pregunta dónde estudias','Te pregunta tu edad'];
  else if(/tell me about yourself/.test(q))    op=['Te pide que hables de ti','Te pide una herramienta','Te pregunta la hora'];
  else if(/what did you do yesterday/.test(q)) op=['Te pregunta qué hiciste ayer','Te pregunta qué harás mañana','Te pregunta dónde trabajas'];
  else if(/and what do you do/.test(q))        op=['Te pregunta qué haces cada día','Te pregunta dónde vives','Te pregunta la hora'];
  if(!op)return;
  var lista=op.map(function(t,i){return {t:t,ok:i===0};});
  for(var i=lista.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var tmp=lista[i];lista[i]=lista[j];lista[j]=tmp;}
  caja.innerHTML='<div class="chq"><div class="hl" id="chqhl">Antes de ver el texto · ¿qué te dijo?</div>'+
    lista.map(function(o){return '<button class="chqb" data-ok="'+(o.ok?1:0)+'">'+esc(o.t)+'</button>';}).join('')+'</div>';
  caja.querySelectorAll('.chqb').forEach(function(b){
    b.onclick=function(e){
      e.stopPropagation();
      var bien=b.getAttribute('data-ok')==='1';
      b.className='chqb '+(bien?'ok':'no');
      var hl=document.getElementById('chqhl');
      if(hl)hl.innerHTML=bien
        ? '<span class="ok2">Eso es. Ya entendiste de qué se trata.</span>'
        : '<span class="no2">No era esa. Escúchalo una vez más.</span>';
      attempts.push({tipo:'listening',meta:x.q,oido:bien?'entendió a la segunda':'no entendió',pct:bien?100:0});
    };
  });
}

function escribir(x){
  var r=document.getElementById('res');
  if(document.getElementById('esc'))return;
  r.innerHTML='<div class="heard"><div class="hl">el micrófono no está disponible</div>'+
    '<div style="font-size:13px;color:rgba(245,242,236,.75);margin-bottom:9px">Dilo en voz alta de todos modos, y luego escríbelo aquí.</div>'+
    '<textarea class="typebox" id="esc" placeholder="Lo que dijiste…"></textarea>'+
    '<button class="btn" id="okesc">Registrar</button></div>';
  document.getElementById('okesc').onclick=function(){
    var v=document.getElementById('esc').value.trim();
    if(!v)return;registrar(x,v);
  };
}

function registrar(x,t,extra){
  extra=extra||{};
  var meta=(x.k==='model'||x.k==='drill')?x.en:'';
  var cmp=meta?compararMejor(meta,t,extra.alternativas):null;
  // Si la version que mejor embona no es la primera, esa es la que se le
  // ensena: es la que de verdad dijo.
  if(cmp&&cmp.dicho) t=cmp.dicho;
  attempts.push({tipo:x.k,meta:meta||x.q,oido:t,pct:cmp?cmp.pct:null});
  if(meta)registrarEnMemoria(meta,cmp?cmp.pct:null);
  if(x.k==='model'){var kk=clave(x.en);intentosDe[kk]=(intentosDe[kk]||0)+1;}
  // en la producción libre el tutor repregunta sobre lo que acaba de decir
  if(x.k==='free')pedirSeguimiento(t);
  if(x.k==='roleplay'&&hayIA())seguirRoleplay(x,t);
  var r=document.getElementById('res');
  var h='<div class="heard"><div class="hl">te entendí</div><div class="ht">'+esc(t)+'</div>';
  // Trabarse no es equivocarse. Si se atoró y ademas le salio bajo, se le
  // dice eso y no "mal": lo que necesita es volver a intentarlo, no una
  // correccion de algo que no hizo mal.
  if(extra.trabado&&cmp&&cmp.pct<80){
    h+='<div class="fb" style="background:var(--verde-suave);border-color:var(--verde)">'+
       'Se te trabó tantito. Eso le pasa a todos. Tócalo otra vez y va.</div>';
  }
  if(cmp){
    h+='<div class="hl" style="margin-top:11px">contra la frase meta</div><div class="ht">'+pintar(meta,cmp)+'</div>'+
       '<div class="score"><div class="sbar"><i style="width:'+cmp.pct+'%"></i></div><span class="snum">'+cmp.pct+'%</span></div>';
  }
  h+='</div>';
  if(meta)h+=bloqueComparar(meta);
  if(cmp&&cmp.pct>=80){
    h+='<div id="correccion"></div>'+bloqueShadow(meta)+'<button class="btn" id="sig">Bien · siguiente</button>';
    if(cmp.pct<97&&hayIA())pedirCorreccion(x,meta,t,cmp.pct,true);
    else say(['Muy bien.','Eso es.','Así se dice.'][Math.floor(Math.random()*3)],'es-MX');
  }
  else if(cmp){
    h+='<div id="correccion"></div>'+
       '<button class="btn ghost" id="otra" style="margin-bottom:8px">Intentar otra vez</button><button class="btn" id="sig">Seguir de todos modos</button>';
    if(hayIA())pedirCorreccion(x,meta,t,cmp.pct,false);
    else say('Casi. Escúchala otra vez y repítela sin prisa.','es-MX');
  }
  else h+='<button class="btn" id="sig">Siguiente</button>';
  r.innerHTML=h;
  if(meta)setTimeout(function(){ligarComparar(meta);ligarShadow(meta);},60);
  var o=document.getElementById('otra');
  if(o)o.onclick=function(){say(meta,'en-US');r.innerHTML='';};
  document.getElementById('sig').onclick=function(){it++;paso();};
}

// Explica en corto QUE se aprendio en la sesion, por area.
function resumenAprendido(S,ats){
  var items=(S&&S.items)||[];
  var GRAM={regla:1,cazar:1,hueco:1,ordenar:1,transf:1};
  var OIR ={idea:1,detalle:1,dosc:1,segm:1,dicto:1};
  var nOir=0,nGram=0,nHab=0, reglas=[], frases=[];
  items.forEach(function(x){
    if(OIR[x.k])nOir++;
    else if(GRAM[x.k]){nGram++; if(x.k==='regla'&&x.titulo)reglas.push(x.titulo);
                       if(x.k==='cazar'&&x.buena)reglas.push(x.mala+' → '+x.buena);}
    else {nHab++; if(x.en)frases.push(x.en);}
  });
  var bien=(ats||[]).filter(function(a){return a.pct>=80;}).length;
  var conP=(ats||[]).filter(function(a){return a.pct!==null&&a.pct!==undefined;}).length;
  var h='<div class="sumcard aprendi"><h3>Qué aprendiste hoy</h3>'+
    '<p class="sub">'+esc(S.obj||S.hoy||'')+'</p>'+
    '<div class="apfila">'+
      '<div class="apbox"><b>'+nOir+'</b><span>de oído</span></div>'+
      '<div class="apbox"><b>'+nGram+'</b><span>de gramática</span></div>'+
      '<div class="apbox"><b>'+nHab+'</b><span>de hablar</span></div>'+
    '</div>';
  if(reglas.length)h+='<div class="aplista"><div class="hl">Las reglas de hoy</div>'+
    reglas.slice(0,3).map(function(r){return '<div class="apr">'+esc(r)+'</div>';}).join('')+'</div>';
  if(frases.length)h+='<div class="aplista"><div class="hl">Tus frases nuevas</div>'+
    frases.slice(0,4).map(function(f){return '<div class="apr">'+esc(f)+'</div>';}).join('')+'</div>';
  if(conP)h+='<p class="sub" style="margin-top:10px">Te salieron bien '+bien+' de '+conP+' ejercicios calificados.</p>';
  return h+'</div>';
}

function cierre(){
  pararReloj();
  var S=MAT[sIdx];
  var dichas=attempts.filter(function(a){return a.oido&&a.tipo!=='pista';});
  var libres=attempts.filter(function(a){return (a.tipo==='free'||a.tipo==='sit')&&a.oido;});
  var conPct=attempts.filter(function(a){return a.pct!==null&&a.pct!==undefined;});
  var prom=conPct.length?Math.round(conPct.reduce(function(s,a){return s+a.pct;},0)/conPct.length):null;
  var pistas=attempts.filter(function(a){return a.tipo==='pista';}).length;
  var pal=dichas.map(function(a){return a.oido;}).join(' ').trim().split(/\s+/).filter(Boolean).length;

  var rec={
    alumna:(P.nombre||'alumno').toLowerCase().replace(/[^a-z0-9]/g,'')||'alumno',
    nombre:P.nombre,nivel:'speaking',s:sIdx,titulo:S.t,
    fecha:new Date().toISOString().slice(0,10),hora:new Date().toTimeString().slice(0,5),
    frases:dichas.map(function(a){return a.oido;}),
    palabras:pal,pista:pistas>0,cierre:'participante',
    dur:Math.round((Date.now()-t0)/1000),
    perfil:P,intentos:attempts.slice(),promedio_repeticion:prom,
    dudas:DUDAS.slice(),observacion:''
  };
  D.sesiones.push(rec);save(D);
  try{hcmCerrarLeccion(rec);}catch(e){console.error(e);}

  // la IA propone los tres errores; Brian los valida. Sin IA, no pasa nada.
  if(hayIA()){
    evaluarConIA(rec,function(res){
      if(!res||!res.errores||!res.errores.length)return;
      rec.errores_ia=res.errores;rec.nota_ia=res.nota||'';
      var d=load();
      if(d.sesiones&&d.sesiones.length){d.sesiones[d.sesiones.length-1]=rec;save(d);}
      var caja=document.getElementById('extra');
      if(!caja)return;
      var h='<div class="card"><h3>Tres cosas para la próxima</h3>'+
        '<p class="sub">Propuestas por el tutor. Brian las revisa antes de que cuenten.</p>';
      res.errores.slice(0,3).forEach(function(e){
        h+='<div class="att"><div class="tg">'+esc(e.correccion||'')+'</div>'+
           '<div class="hd">'+esc(e.codigo||'')+' · dijiste: '+esc(e.dijo||'')+'</div></div>';
      });
      caja.insertAdjacentHTML('afterbegin',h+'</div>');
    });
  }

  var msg=libres.length?'Hablaste '+dichas.length+' veces y produjiste '+pal+' palabras.'
        :'Practicaste '+dichas.length+' frases. La próxima intentamos una tuya.';
  // lo hablado va sin números, para que sea una frase fija con audio propio
  var msgVoz=libres.length
    ? 'Buen trabajo. Hablaste con tus propias palabras. Nos vemos en la siguiente.'
    : 'Buen trabajo. Practicaste las frases de hoy. La próxima intentamos una tuya.';

  var h='<div class="qcard"><div class="qlbl">Cierre</div><div class="qtxt">Buen trabajo, '+esc(P.nombre)+'.</div>'+
    '<div class="qsub">'+msg+(prom!==null?' Tus repeticiones salieron al '+prom+'% de parecido con el modelo.':'')+'</div>'+
    '<button class="btn" id="menu">Volver al camino</button></div>'+
    resumenAprendido(S,attempts)+
    '<div class="sumcard"><h3>Lo que se le manda a tu maestro</h3><p class="sub">Cada intento, tal como salió. Brian lo revisa y te devuelve máximo tres correcciones.</p>'+
    attempts.map(function(a){
      if(a.tipo==='pista')return '<div class="att"><span class="hd">pidió pista · '+esc(a.meta)+'</span></div>';
      return '<div class="att"><div class="tg">'+esc(a.oido||'—')+'</div>'+
        '<div class="hd">'+(a.tipo==='model'?'repetición · meta: '+esc(a.meta):(a.tipo==='ask'?'respuesta a: '+esc(a.meta):'producción libre'))+
        (a.pct!==null&&a.pct!==undefined?' · '+a.pct+'%':'')+'</div></div>';
    }).join('')+
    '<div class="obsbox"><div class="hl">¿Algo que quieras decirle a Brian?</div>'+
    '<textarea class="typebox" id="obs" placeholder="Lo que se te hizo difícil, lo que no entendiste, lo que le cambiarías…"></textarea>'+
    (HAY_MIC?'<button class="btn ghost" id="obsmic"><span class="pulse"></span> Decirlo en voz alta</button>':'')+
    '<p class="tiny" style="text-align:left;margin:6px 0 0">Es opcional, pero es lo que más le sirve a Brian.</p></div>'+
    '<p class="why" id="stat"></p><div class="actrow" id="manual"'+((ONLINE||DATOS_ENDPOINT||HCM_DATOS_ENDPOINT)?' hidden':'')+'>'+
    '<button id="cop">Copiar código</button></div>'+
    '<textarea class="code" id="cd" readonly'+((ONLINE||DATOS_ENDPOINT||HCM_DATOS_ENDPOINT)?' hidden':'')+'></textarea></div>';
  APP.innerHTML=h;
  say(msgVoz,'es-MX');

  // la observación se recoge al enviar, no antes
  function conObs(){
    var o=document.getElementById('obs');
    rec.observacion=o?o.value.trim():'';
    return pack(rec);
  }
  var om=document.getElementById('obsmic');
  if(om)om.onclick=function(){
    var b=this;b.classList.add('rec');b.innerHTML='<span class="pulse"></span> Escuchando…';
    listen('es-MX',function(t){
      document.getElementById('obs').value=t;
      b.classList.remove('rec');b.innerHTML='<span class="pulse"></span> Decirlo otra vez';
    },function(){b.classList.remove('rec');b.disabled=true;b.textContent='El micrófono no abrió · escríbelo';});
  };
  // la observación y las dudas se recogen al momento de enviar
  function recogido(){
    var o=document.getElementById('obs');
    rec.observacion=o?o.value.trim():'';
    rec.dudas=DUDAS.slice();
    return pack(rec);
  }
  // los puntos se dan al cerrar
  var gan=sumarPuntos(rec);
  var cab=APP.querySelector('.qcard');
  if(cab)cab.insertAdjacentHTML('beforeend',
    '<div class="ganados"><span>+'+gan.ganados+' puntos</span>'+
    gan.producidas+' frases tuyas · '+gan.escuchas+' escuchas · '+gan.sombra+' veces al mismo tiempo</div>');
  var codigo=pack(rec);
  document.getElementById('cd').value=codigo;
  document.getElementById('menu').onclick=function(){sIdx=null;mostrarMapa();};

  // v136: el avance ya salio al servidor del Colegio en hcmCerrarLeccion.
  // Aqui solo se le dice al cadete si llego.
  if(HCM_DATOS_ENDPOINT && !DATOS_ENDPOINT){
    var st=document.getElementById('stat');
    if(st) st.textContent='Guardando tu avance…';
    Promise.resolve(ENVIO_HCM).then(function(ok){
      var st2=document.getElementById('stat'); if(!st2) return;
      st2.textContent = ok ? '✓ Guardada. Tu instructor ya la ve.'
                           : 'Sin internet ahorita. Tu avance quedó guardado y se manda solo en cuanto haya conexión.';
    });
  }
  // se manda sola al servidor de datos
  if(DATOS_ENDPOINT){
    document.getElementById('stat').textContent='Enviando a Brian…';
    var enviar=function(){
      var o=document.getElementById('obs');
      rec.observacion=o?o.value.trim():'';
      rec.dudas=DUDAS.slice();
      fetch(DATOS_ENDPOINT,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
        body:JSON.stringify(rec)})
        .then(function(r){return r.ok?r.json():null;})
        .then(function(d){
          document.getElementById('stat').textContent=(d&&d.ok)
            ? '✓ Enviada. Brian ya la tiene.'
            : 'No se pudo enviar. Usa el botón de correo.';
          if(!d||!d.ok){
            document.getElementById('manual').hidden=false;
            document.getElementById('cd').hidden=false;
          }
        })
        .catch(function(){
          document.getElementById('stat').textContent='Sin conexión. Usa el botón de correo.';
          document.getElementById('manual').hidden=false;
          document.getElementById('cd').hidden=false;
        });
    };
    // se espera un poco por si escribe una observación
    setTimeout(enviar,1200);
    var ob=document.getElementById('obs');
    if(ob)ob.onblur=enviar;
  }
  if(ONLINE&&!DATOS_ENDPOINT){
    document.getElementById('stat').textContent='Enviando…';
    google.script.run
      .withSuccessHandler(function(r){document.getElementById('stat').textContent=(r&&r.ok)?'✓ Enviada. Brian ya la tiene.':'No la aceptó el servidor.';})
      .withFailureHandler(function(){
        document.getElementById('stat').textContent='No se pudo conectar. Mándala por correo.';
        document.getElementById('manual').hidden=false;document.getElementById('cd').hidden=false;
      })
      .guardarSesion(rec);
    var envio=document.getElementById('obs');
    if(envio)envio.onblur=function(){
      rec.observacion=envio.value.trim();
      try{google.script.run.guardarSesion(rec);}catch(e){}
    };
  }
  var m=document.getElementById('mail');
  if(m)m.onclick=function(){
    rec.observacion=(document.getElementById('obs')||{}).value||'';
    var codigo2=conObs();
    var codigo2=recogido();
    var cuerpo='Sesión '+(sIdx+1)+' — '+S.t+'\n'+P.nombre+' · '+rec.fecha+'\n\n'+
      (rec.observacion?'LO QUE ESCRIBIÓ EL ALUMNO:\n'+rec.observacion+'\n\n':'')+
      (DUDAS.length?'DUDAS QUE PREGUNTÓ:\n'+DUDAS.map(function(d){return '· '+d;}).join('\n')+'\n\n':'')+
      'Perfil: '+P.trabajo_es+', '+P.lugar_es+', '+P.accion_es+'\n'+
      'Intentos:\n'+attempts.map(function(a){
        return '· '+(a.tipo==='pista'?'[pista] '+a.meta:(a.oido+(a.pct!=null?' ('+a.pct+'%)':'')+' ← '+a.meta));
      }).join('\n')+'\n\n--- código para el panel ---\n'+codigo2;
    window.location.href='mailto:'+DESTINO+'?subject='+encodeURIComponent('Speaking '+(sIdx+1)+' · '+P.nombre)+'&body='+encodeURIComponent(cuerpo);
  };
  var c=document.getElementById('cop');
  if(c)c.onclick=function(){
    var t=document.getElementById('cd');
    t.value=recogido();
    t.select();
    try{document.execCommand('copy');document.getElementById('stat').textContent='Código copiado.';}catch(x){}
  };
}

// cadete pueda volver a intentarlo sin que le cambie el examen debajo.
function revolverHCM_(lista, semilla){
  var a = lista.slice(), x = (semilla || 1) * 9301 + 49297;
  for (var i = a.length - 1; i > 0; i--) {
    x = (x * 9301 + 49297) % 233280;
    var j = Math.floor((x / 233280) * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function armarSesionHCM(n){
  var lec=LECCIONES_HCM[n];if(!lec)return null;
  var D2=hcmLoad();var P2=D2.perfil||{};
  var carril=CARRILES_HCM[P2.carril||'medio']||CARRILES_HCM.medio;
  var raw;
  if (esEvaluacionHCM(n)) {
    // Repaso de evaluacion: se junta el material de las lecciones del bloque.
    // Antes esto caia en MATERIAL_HCM[1] y el cadete repasaba la leccion 1
    // creyendo que repasaba para su parcial.
    raw = [];
    var bl = BLOQUES_HCM[n];
    for (var b = 0; b < bl.length; b++) {
      var mb = MATERIAL_HCM[bl[b]] || [];
      for (var q = 0; q < mb.length; q++) raw.push(mb[q]);
    }
    raw = revolverHCM_(raw, n).slice(0, 12);
  } else {
    raw = MATERIAL_HCM[n] || MATERIAL_HCM[1] || [];
  }
  var items=raw.filter(function(x){
    // los ejercicios marcados solo:"alto" son el material del ALC 11-12:
    // solo los ve el cadete que va sobrado.
    if(x.solo&&x.solo!==(P2.carril||'medio'))return false;
    return carril.tipos.indexOf(x.k)>=0;
  });
  if(!items.length)items=raw.slice();
  // sesion corta: la regla y tres ejercicios, para el que agarra el
  // telefono entre clases.
  if(HCM_SESION==='corta'&&items.length>4)items=items.slice(0,4);
  items=items.map(function(x){
    var y=JSON.parse(JSON.stringify(x));
    if(!carril.espanol)delete y.es;
    if(carril.ver_texto)y._ver_texto=true;
    if(carril.pista_auto)y._pista_auto=true;
    y._pct=carril.pct;
    // El material del HCM marca la respuesta con el numero de la opcion
    // ("correcta"); el motor la busca por texto, en "bien". Sin esta
    // traduccion el motor comparaba contra undefined y daba por mala
    // hasta la respuesta buena: salia "Era undefined".
    if(typeof y.correcta==='number'){
      if(y.k==='dosc')      y.bien = (y.correcta===0?'a':'b');
      else if(y.ops&&y.ops.length) y.bien = y.ops[y.correcta];
    }
    return y;
  });
  if (esEvaluacionHCM(n)) {
    return {
      t: 'Repaso para la ' + lec.titulo,
      hoy: lec.sub + ' \u00b7 esto es repaso, no es la evaluaci\u00f3n',
      obj: 'llegar listo a la evaluaci\u00f3n que aplica tu maestro en clase',
      enc: 'Repaso del bloque \u00b7 la ' + lec.titulo + ' se presenta en clase el ' + lec.fecha,
      items: items
    };
  }
  return {
    t:lec.titulo,
    hoy:lec.sub,
    obj:'decir "'+lec.titulo+'" sin pensarlo',
    enc:'Leccion '+n+' de '+PARADAS_HCM+' \u00b7 '+lec.fecha+' \u00b7 carril '+(carril.nombre||''),
    items:items
  };
}
function irAParadaHCM(n){
  var lec=LECCIONES_HCM[n];if(!lec)return;
  if(lec.examen && !esEvaluacionHCM(n)){
    try{avisito('El examen llega el '+lec.fecha+'. Sigue practicando.');}
    catch(e){alert('El examen llega el '+lec.fecha);}
    return;
  }
  if(esEvaluacionHCM(n)){
    // Antes esto era una puerta cerrada: el cadete tocaba su parcial y la app
    // le decia "espera". Ahora entra a repasar el bloque, y se le dice con
    // todas sus letras que la evaluacion de verdad la aplica su maestro.
    try{avisito('Esto es repaso. La '+lec.titulo+' la presentas en clase el '+lec.fecha+'.');}catch(e){}
  }
  hcmSincronizarPerfil();
  var S=armarSesionHCM(n);
  if(!S||!S.items.length){
    try{avisito('Esa leccion todavia no tiene material.');}catch(e){}
    return;
  }
  MAT=[S]; sIdx=0; it=0; attempts=[]; intentosDe={}; vistos={}; t0=Date.now();
  var D2=hcmLoad();var P2=D2.perfil||{};
  // Antes esto ponia parada=n, asi que entrar a la leccion 15 hacia
  // creer que las catorce anteriores ya estaban hechas. El avance
  // ahora vive en P2.hechas y solo lo mueve cerrar una leccion.
  P2.parada_actual=n; P2.viendo=n; D2.perfil=P2; hcmSave(D2);
  if(P)P.parada_actual=n;
  hcmGuardarAvance(n,[],0);
  try{portadaSesion();}catch(e){console.error(e);try{mostrarMapa();}catch(x){}}
}
/* Al terminar una leccion: se manda el avance a la hoja y se abre la
   siguiente. Los examenes se saltan al abrir, porque no se practican
   en la app: si no, el cadete se quedaba trabado en el examen. */
function hcmCerrarLeccion(rec){
  var Dh=hcmLoad();var Ph=Dh.perfil||{};
  var n=Ph.parada_actual||Ph.parada||1;
  try{hcmGuardarAvance(n,(rec&&rec.intentos)||[],(rec&&rec.dur)||0);}catch(e){}
  var sig=n+1;
  while(sig<=PARADAS_HCM&&LECCIONES_HCM[sig]&&LECCIONES_HCM[sig].examen)sig++;
  if(sig>PARADAS_HCM)sig=PARADAS_HCM;
  if(!Ph.hechas)Ph.hechas={};
  Ph.hechas[n]=true;
  if(sig>(Ph.parada||1))Ph.parada=sig;
  Ph.ultima=new Date().toISOString().slice(0,10);
  Dh.perfil=Ph;hcmSave(Dh);
}

/* La llave del cadete en la hoja. Antes era su número; ahora que solo
   escriben su nombre, se arma con el nombre mismo: minúsculas, sin
   acentos y sin espacios. Así su renglón sigue siendo el mismo cada
   sesión aunque un día escriba "García" y otro "Garcia". */
function claveCadete(nombre){
  return String(nombre||'')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .toLowerCase().replace(/[^a-z0-9]/g,'');
}

// ── HCM: guardar avance en el servidor ─────────────────────────────
var ENVIO_HCM=null;   // la promesa del ultimo envio, para decirle al cadete si llego
// Los cadetes tienen internet a ratos. Si un envio falla, se guarda en el
// telefono y sale solo la siguiente vez que haya conexion: nada se pierde.
var PEND_HCM='hcm_pendientes';
function pendientesHCM(){ try{ return JSON.parse(localStorage.getItem(PEND_HCM)||'[]'); }catch(e){ return []; } }
function guardaPendientesHCM(l){ try{ localStorage.setItem(PEND_HCM, JSON.stringify(l.slice(-60))); }catch(e){} }
function mandarHCM_(cuerpo){
  return fetch(HCM_DATOS_ENDPOINT, {
    method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(cuerpo)
  }).then(function(r){ return r.ok ? r.json() : null; })
    .then(function(d){ return !!(d && d.ok); })
    .catch(function(){ return false; });
}
var VACIANDO_HCM=false;
function vaciarPendientesHCM(){
  if(!HCM_DATOS_ENDPOINT || VACIANDO_HCM) return;
  var l=pendientesHCM(); if(!l.length) return;
  VACIANDO_HCM=true;
  var sigue=function(){
    var l2=pendientesHCM();
    if(!l2.length){ VACIANDO_HCM=false; return; }
    mandarHCM_(l2[0]).then(function(ok){
      if(!ok){ VACIANDO_HCM=false; return; }          // sin red todavia: otro dia
      var l3=pendientesHCM(); l3.shift(); guardaPendientesHCM(l3); sigue();
    });
  };
  sigue();
}
function hcmGuardarAvance(leccion, intentos, segundos) {
  if (!HCM_DATOS_ENDPOINT) return;
  var D2 = hcmLoad(); var P2 = D2.perfil || {};
  var cuerpo = {
    accion: 'guardar',
    nombre: P2.nombre || '',
    num_cadete: claveCadete(P2.nombre),
    grupo: P2.grupo || '301',
    carril: P2.carril || 'medio',
    leccion: leccion,
    intentos: intentos || [],
    segundos: segundos || 0
  };
  try {
    ENVIO_HCM = mandarHCM_(cuerpo).then(function(ok){
      // solo se guarda para despues lo que trae practica de verdad
      if(!ok && (segundos || (intentos && intentos.length))){
        var l=pendientesHCM(); l.push(cuerpo); guardaPendientesHCM(l);
      }
      if(ok) vaciarPendientesHCM();
      return ok;
    });
  } catch(e) {}
}
// al abrir la app y al recuperar la red, sale lo que se quedo guardado
try{
  window.addEventListener('online', function(){ vaciarPendientesHCM(); });
  setTimeout(vaciarPendientesHCM, 4000);
}catch(e){}

function hcmPedirAyuda(pregunta, leccion) {
  if (!IA_ENDPOINT) {
    mostrarBurbuja('El cerebro IA no está conectado todavía. Pregúntale a tu instructor.','sistema');
    return;
  }
  var D2=hcmLoad();var P2=D2.perfil||{};
  mostrarBurbuja('Pensando…','sistema');
  fetch(IA_ENDPOINT, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({
      accion:'ayuda',
      datos:{pregunta:pregunta, leccion:leccion, carril:P2.carril||'medio'}
    })
  })
  .then(function(r){return r.ok?r.json():null;})
  .then(function(d){
    var r=d&&d.ok&&d.resultado;
    var txt=r&&(r.respuesta||r.texto);
    if(txt){
      mostrarBurbuja(txt,'ia');
    } else {
      mostrarBurbuja('No pude responder. Intenta de nuevo.','sistema');
    }
  })
  .catch(function(){mostrarBurbuja('Sin conexión con el cerebro IA.','sistema');});
}

function mostrarBurbuja(texto, tipo) {
  var caja = document.getElementById('res') || document.getElementById('body') || document.getElementById('app');
  if (!caja) return;
  var d = document.createElement('div');
  d.className = tipo==='ia' ? 'bubble-ia' : 'fb';
  d.innerHTML = (tipo==='ia'?'<div class="hl">Tutor IA</div>':'') +
    '<div class="ht">' + texto + '</div>';
  caja.insertBefore(d, caja.firstChild);
}

/* ══════════════════════════════════════════════════════════════════
   HCM · ritmo, niveles y Cerebro siempre a mano
   Esta capa va al final a proposito: las funciones que declara
   sustituyen a las de arriba (mostrarMapa, mostrarAyudaSiToca) sin
   tocar el codigo original.
   ══════════════════════════════════════════════════════════════════ */

var HCM_SESION = 'completa';   // corta | completa | larga
var HCM_RITMOS = {
  diario:  {nom:'Todos los dias',     det:'Una leccion por semana, en ratos de 20 minutos.', porSem:1},
  algunos: {nom:'Unos dias a la semana', det:'Dos o tres ratos por semana, como te toque.', porSem:1},
  finde:   {nom:'Solo los fines de semana', det:'Una sesion larga el sabado o el domingo.', porSem:1}
};

/* El avance: cuenta lecciones cerradas, no en que numero vas.
   Si el cadete venia del esquema viejo (solo "parada"), se le dan por
   hechas las anteriores para no borrarle el trabajo. */
function hcmHechas(){
  var D=hcmLoad(); var P=D.perfil||{};
  if(!P.hechas){
    P.hechas={};
    var p=P.parada||1;
    for(var i=1;i<p;i++) if(LECCIONES_HCM[i]&&!LECCIONES_HCM[i].examen) P.hechas[i]=true;
    D.perfil=P; hcmSave(D);
  }
  return P.hechas;
}
function hcmCuantasHechas(){
  var h=hcmHechas(), n=0;
  for(var k in h) if(h[k]) n++;
  return n;
}
/* La sugerida es la primera sin cerrar que no sea examen. */
function hcmSugerida(){
  var h=hcmHechas();
  for(var i=1;i<=PARADAS_HCM;i++){
    var L=LECCIONES_HCM[i];
    if(L&&!L.examen&&!h[i]) return i;
  }
  return 1;
}
function hcmRitmo(){
  var D=hcmLoad(); var P=D.perfil||{};
  return HCM_RITMOS[P.ritmo] ? P.ritmo : 'algunos';
}
function hcmGuardarPerfil(campo, valor){
  var D=hcmLoad(); var P=D.perfil||{};
  P[campo]=valor; D.perfil=P; hcmSave(D);
}

/* ── hoja de abajo, generica ── */
function hcmCerrarHoja(){
  var v=document.getElementById('hcm-velo'), h=document.getElementById('hcm-hoja');
  if(v){v.classList.remove('on'); setTimeout(function(){if(v.parentNode)v.parentNode.removeChild(v);},220);}
  if(h){h.classList.remove('on'); setTimeout(function(){if(h.parentNode)h.parentNode.removeChild(h);},280);}
}
function hcmHoja(html){
  hcmCerrarHoja();
  var v=document.createElement('div'); v.className='hcm-velo'; v.id='hcm-velo';
  v.onclick=hcmCerrarHoja;
  var h=document.createElement('div'); h.className='hcm-hoja'; h.id='hcm-hoja';
  h.style.position='fixed';
  h.innerHTML='<button class="cerrar" aria-label="Cerrar">&times;</button>'+html;
  document.body.appendChild(v); document.body.appendChild(h);
  h.querySelector('.cerrar').onclick=hcmCerrarHoja;
  requestAnimationFrame(function(){v.classList.add('on'); h.classList.add('on');});
  return h;
}

/* ── elegir ritmo ── */
function hcmElegirRitmo(){
  var act=hcmRitmo(), html='<h3>¿Cada cuando vas a practicar?</h3>'+
    '<p class="sub">Sirve para saber qué proponerte. Puedes cambiarlo cuando quieras, y si faltas una semana no pasa nada.</p>';
  ['diario','algunos','finde'].forEach(function(k){
    var r=HCM_RITMOS[k];
    html+='<button class="hcm-op'+(k===act?' sel':'')+'" data-r="'+k+'">'+
      '<b>'+r.nom+'</b><span>'+r.det+'</span></button>';
  });
  var h=hcmHoja(html);
  h.querySelectorAll('[data-r]').forEach(function(b){
    b.onclick=function(){
      hcmGuardarPerfil('ritmo', b.dataset.r);
      hcmCerrarHoja(); setTimeout(mostrarMapa, 240);
    };
  });
}

/* ── cuanto tiempo traen hoy ── */
function hcmElegirSesion(n){
  var lec=LECCIONES_HCM[n]||{};
  var html='<h3>'+esc(lec.titulo||('Lección '+n))+'</h3>'+
    '<p class="sub">¿Cuánto tiempo traes ahora?</p>'+
    '<button class="hcm-op" data-s="corta"><b>Un rato · 5 minutos</b>'+
      '<span>La regla y tres ejercicios. Para entre clases.</span></button>'+
    '<button class="hcm-op" data-s="completa"><b>La lección completa · 20 minutos</b>'+
      '<span>Todo: la regla, escuchar, hablar y transformar.</span></button>'+
    '<button class="hcm-op" data-s="larga"><b>Sesión de fin de semana</b>'+
      '<span>Esta lección y sigues con la que viene, sin volver al mapa.</span></button>';
  var h=hcmHoja(html);
  h.querySelectorAll('[data-s]').forEach(function(b){
    b.onclick=function(){
      HCM_SESION=b.dataset.s;
      hcmGuardarPerfil('largo_pref', HCM_SESION);
      hcmCerrarHoja();
      setTimeout(function(){ hcmEntrar(n); }, 240);
    };
  });
}
/* Entrar de verdad. En la sesion larga se encadenan las lecciones
   siguientes que no sean examen, para que no vuelva al mapa. */
function hcmEntrar(n){
  if(HCM_SESION!=='larga'){ irAParadaHCM(n); return; }
  hcmSincronizarPerfil();
  var lista=[], i=n;
  while(lista.length<3 && i<=PARADAS_HCM){
    var L=LECCIONES_HCM[i];
    if(L&&!L.examen){ var S=armarSesionHCM(i); if(S&&S.items.length) lista.push(S); }
    i++;
  }
  if(!lista.length){ irAParadaHCM(n); return; }
  MAT=lista; sIdx=0; it=0; attempts=[]; intentosDe={}; vistos={}; t0=Date.now();
  var D2=hcmLoad(); var P2=D2.perfil||{};
  P2.parada_actual=n; P2.viendo=n; D2.perfil=P2; hcmSave(D2);
  if(P)P.parada_actual=n;
  try{hcmGuardarAvance(n,[],0);}catch(e){}
  try{portadaSesion();}catch(e){}
}

/* ── el mapa: todas abiertas ── */
function mostrarMapa(){
  document.getElementById('topbar').style.display='';
  document.getElementById('barrabaja').style.display='';
  document.querySelectorAll('.tabb').forEach(function(b){b.classList.toggle('on',b.dataset.t==='mapa');});
  var D=hcmLoad(); var P=D.perfil||{};
  var nom=(P.nombre||'Cadete').split(' ')[0];
  var carril=P.carril||'medio';
  var h=hcmHechas();
  var hechas=hcmCuantasHechas();
  var sug=hcmSugerida();
  var pct=Math.round((hechas/PARADAS_HCM)*100);
  var chips={bajo:'🟡 Básico',medio:'🟠 Intermedio',alto:'🔴 Avanzado'};
  var ritmo=HCM_RITMOS[hcmRitmo()];
  var rows='';
  for(var i=1;i<=PARADAS_HCM;i++){
    var lec=LECCIONES_HCM[i]; if(!lec)continue;
    var esEx=!!lec.examen;
    var cls='hcm-parada', icTxt=String(i), etiTxt='Lección '+i+' · '+lec.fecha;
    if(esEx){ etiTxt=lec.fecha; icTxt='⚑'; cls+=' examen'; }
    else if(h[i]){ cls+=' hecha'; icTxt='✓'; }
    else if(i===sug){ cls+=' actual sugerida'; }
    rows+='<div class="'+cls+'" data-n="'+i+'">'+
      '<div class="hcm-par-ic">'+icTxt+'</div>'+
      '<div class="hcm-par-tx">'+
      '<div class="hcm-par-eti">'+etiTxt+(i===sug&&!esEx?' · te toca':'')+'</div>'+
      '<div class="hcm-par-nom">'+lec.titulo+'</div>'+
      '<div class="hcm-par-sub">'+lec.sub+'</div>'+
      '</div></div>';
  }
  document.getElementById('app').innerHTML=
    '<div class="hcm-mapa"><div class="hcm-mapa-cab">'+
    '<div class="hcm-saludo">Bienvenido, cadete.</div>'+
    '<div class="hcm-nombre">'+nom+'</div>'+
    '<button class="hcm-chip-bt" id="hcm-bt-carril">'+
      '<span class="hcm-carril-chip '+carril+'">'+(chips[carril]||carril)+' ›</span></button>'+
    '<div class="hcm-prog-fila">'+
    '<div class="hcm-prog-bar"><div class="hcm-prog-fill" style="width:'+pct+'%"></div></div>'+
    '<div class="hcm-prog-txt">'+hechas+' de '+PARADAS_HCM+'</div></div>'+
    '<p class="hcm-plan">'+ritmo.nom.toLowerCase()+' · '+
      '<button class="hcm-chip-bt" id="hcm-bt-ritmo" style="text-decoration:underline">cambiar ritmo</button></p>'+
    '<p class="hcm-plan">Todas las lecciones están abiertas. Entra a la que quieras. \u00b7 '+
      '<button class="hcm-chip-bt" id="hcm-bt-tutorial" style="text-decoration:underline">ver el tutorial</button></p>'+
    '</div><div class="hcm-paradas">'+rows+'</div></div>';

  document.querySelectorAll('.hcm-parada').forEach(function(el){
    el.onclick=function(){
      var n=+el.dataset.n;
      var L=LECCIONES_HCM[n];
      if(L&&L.examen){ irAParadaHCM(n); return; }
      hcmElegirSesion(n);
    };
  });
  var bc=document.getElementById('hcm-bt-carril'); if(bc)bc.onclick=hcmElegirCarril;
  var br=document.getElementById('hcm-bt-ritmo');  if(br)br.onclick=hcmElegirRitmo;
  var bt=document.getElementById('hcm-bt-tutorial');
  if(bt)bt.onclick=function(){hcmGuardarPerfil('tutorHCM',false);hcmTutorial();};
  // La primera vez arranca solo, en cuanto el mapa ya esta pintado.
  if(!P.tutorHCM)setTimeout(hcmTutorial,700);
  setTimeout(function(){
    var a=document.querySelector('.hcm-parada.sugerida');
    if(a)a.scrollIntoView({behavior:'smooth',block:'center'});
  },200);
}

/* ── el Cerebro, en todas las pantallas ──
   Antes el boton se escondia dentro de las lecciones y preguntaba con
   prompt(), que en el telefono tapa la pantalla. Ahora es una hoja
   normal y no se esconde nunca. */
function mostrarAyudaSiToca(){
  var ay=document.getElementById('btnayuda');
  if(ay)ay.classList.remove('escondido');
}
function hcmRespaldoEscrito(n){
  var raw=MATERIAL_HCM[n]||[];
  for(var i=0;i<raw.length;i++){
    if(raw[i].k==='regla'){
      var r=raw[i];
      return '<b>'+esc(r.titulo||'')+'</b><br>'+esc(r.regla||'')+
        (r.bien?'<br><br>Así sí: <i>'+esc(r.bien)+'</i>':'')+
        (r.mal?'<br>Así no: '+esc(r.mal):'')+
        (r.porque?'<br><br>'+esc(r.porque):'');
    }
  }
  return 'Vuelve a la regla de la lección y léela despacio. En cuanto haya señal te explico con más detalle.';
}
function hcmCerebro(){
  var D=hcmLoad(); var P=D.perfil||{};
  var n=P.viendo||P.parada_actual||hcmSugerida();
  var lec=LECCIONES_HCM[n]||{};
  var h=hcmHoja(
    '<h3>¿Qué no te cuadra?</h3>'+
    '<p class="sub">Pregúntame en español o en inglés. Estoy en la lección '+n+
      (lec.titulo?': '+esc(lec.titulo):'')+'.</p>'+
    '<textarea id="hcm-duda" placeholder="Por ejemplo: ¿cuándo uso because y cuándo because of?"></textarea>'+
    '<button class="hcm-op sel" id="hcm-duda-ok" style="text-align:center;margin-top:10px">'+
      '<b>Preguntar</b></button>'+
    '<div id="hcm-duda-resp"></div>');
  var ta=h.querySelector('#hcm-duda');
  setTimeout(function(){try{ta.focus();}catch(e){}},300);
  h.querySelector('#hcm-duda-ok').onclick=function(){
    var q=(ta.value||'').trim();
    if(!q)return;
    var caja=h.querySelector('#hcm-duda-resp');
    caja.innerHTML='<div class="hcm-resp"><div class="de">Tu maestro</div>Pensando…</div>';
    function pintar(txt, de){
      caja.innerHTML='<div class="hcm-resp"><div class="de">'+de+'</div>'+txt+'</div>';
    }
    if(!IA_ENDPOINT){ pintar(hcmRespaldoEscrito(n), 'Sin conexión · la regla'); return; }
    var corto=setTimeout(function(){
      pintar(hcmRespaldoEscrito(n), 'Sin conexión · la regla');
      corto=null;
    }, 12000);
    fetch(IA_ENDPOINT,{
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({accion:'ayuda',datos:{
        pregunta:q, leccion:n, carril:P.carril||'medio'
      }})
    }).then(function(r){return r.ok?r.json():null;})
      .then(function(d){
        if(corto===null)return; clearTimeout(corto);
        var res=d&&d.ok&&d.resultado;
        var txt=res&&(res.respuesta||res.texto);
        if(txt)pintar(esc(txt).replace(/\n/g,'<br>'), 'Tu maestro');
        else pintar(hcmRespaldoEscrito(n), 'La regla de esta lección');
      })
      .catch(function(){
        if(corto===null)return; clearTimeout(corto);
        pintar(hcmRespaldoEscrito(n), 'Sin conexión · la regla');
      });
  };
}
document.addEventListener('DOMContentLoaded', function(){
  var fab=document.getElementById('btnayuda');
  if(fab){
    var nuevo=fab.cloneNode(true);       // se van los listeners viejos
    nuevo.classList.remove('escondido');
    fab.parentNode.replaceChild(nuevo, fab);
    nuevo.onclick=function(e){ e.preventDefault(); hcmCerebro(); };
    nuevo.title='Pregúntale a tu maestro';
  }
  var D=hcmLoad(); var P=D.perfil||{};
  if(P.largo_pref)HCM_SESION=P.largo_pref;
});

function pasosTutor(){
  return [
    {donde:null, titulo:'Esto es todo tu curso',

/* Al cerrar: guardar la marca del HCM y no llamar al saludo del motor
   viejo, que hablaba de otro curso. */
function cerrarTutor(){
  TUTOR_VIVO=false;
  var v=document.getElementById('tutor');
  if(v&&v.remove)v.remove();
  try{ var d=load(); d.tutorVisto=true; save(d); D=d; }catch(e){}
  hcmGuardarPerfil('tutorHCM', true);
}

function hcmTutorial(){
  hcmCerrarHoja();
  var D=hcmLoad(); var P2=D.perfil||{};
  if(!P2.nombre)return;                       // todavia no se registra
  if(document.getElementById('hcm-hoja'))return;
  try{ arrancarTutor(); }catch(e){}
}

})();
