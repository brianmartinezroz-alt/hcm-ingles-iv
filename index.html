function router(){
  callarTodo();
  var tb=document.querySelector('.topbar');
  if(tb)tb.style.display='';
  aplicarModo();
  if(forzar){
    var f=forzar;forzar=null;
    if(f==='saludo'){vioSaludo=false;portada();return;}
    if(f==='experiencia'){preguntaExperiencia();return;}
    if(f==='sonido'){pruebaSonido();return;}
    if(f==='voz'){vozPicker();return;}
  }
  /* Una sola ventana encima del mapa, nunca dos. La PRIMERA vez que
     entra le toca el recorrido; de ahi en adelante, el saludo. */
  setTimeout(function(){
    if(MODO_JEFE||JEFE_LIBRE)return;
    try{ if(!P)return; }catch(e){ return; }
    // Si todavia esta en la pantalla de marca, el saludo no tiene nada
    // encima que saludar. Sale cuando ya se ve el mapa.
    if(!vioMarca)return;

    // La primera vez manda el recorrido; el saludo sale al terminarlo.
    if(!D.tutorVisto&&!TUTOR_VIVO){ arrancarTutor(); return; }
    // De ahi en adelante, el saludo sale CADA VEZ que se abre la app.
    // Antes se apuntaba en sessionStorage y no se volvia a ver: al recargar
    // nunca aparecia, y despues del recorrido tampoco, porque la marca ya
    // estaba puesta. Por eso parecia que el saludo no existia.
    hojaHola();
  },2000);   // dos segundos: primero que se vea el mapa, luego el saludo

  if(MODO_JEFE){
    MODO_JEFE=false;
    try{ pantallaJefe(); }
    catch(e){
      APP.innerHTML='<div class="card"><h2>Modo jefe</h2>'+
        '<p class="tiny">Algo falló al pintarlo: '+esc(String(e))+'</p>'+
        '<button class="btn" onclick="location.href=location.pathname">Volver a la app</button></div>';
    }
    return;
  }
  if(!vioMarca){marca();return;}
  /* Ya NO se detiene en la pantalla de saludos: de la marca pasa derecho
     al mapa. El saludo es la ventana flotante de arriba (hojaHola). La
     pantalla completa de saludos sigue viva en el cajon de "Mas". */

  // De aquí en adelante ya no se le pide nada para entrar: ve su tablero.
  // Las preguntas, la prueba de voz y el personaje viven en el cajón.
  if(PAQUETE_ACTIVO!==D.paquete){PAQUETE_ACTIVO=D.paquete;armarRutas();}
  if(D.velAudio)VEL_AUDIO=D.velAudio;
  aplicarVoz(D.voz);elegirVozES();if(D.rate)RATE=D.rate;
  pintarColorDelNivel();   // el color del nivel, pase por donde pase la app

  if(PERSONALIZANDO){ seguirPersonalizacion(); return; }

  // Si el perfil guardado quedó a medias, no lo dejamos en pantalla muerta:
  // se le pide otra vez, en vez de reventar en silencio.
  MAT=null;
  if(P){
    try{ MAT=materialDe(P); }
    catch(e){ MAT=null; P=null; D.perfil=null; save(D); }
  }
  if(sIdx===null||!P||!MAT){mapa();return;}
  correr();
}

// Escoge una que embone con la hora y que no sea la de la vez pasada.
function despedidaDelDia(termino){
  var m=(typeof momento==='function')?momento():0;
  var diaHoy=new Date().getDay();   // 0 domingo ... 6 sabado
  var pool=DESPEDIDAS.filter(function(s){
    // "Have a good weekend" un martes suena raro: solo de jueves a sabado
    if(s.finde&&!(diaHoy>=4&&diaHoy<=6))return false;
    if(s.mom!==0&&s.mom!==m)return false;
    if(s.cuando===1&&termino)return false;
    if(s.cuando===2&&!termino)return false;
    return true;
  });
  if(!pool.length)pool=[DESPEDIDAS[0]];
  var previo=D&&D.ultimaDespedida;
  var libres=pool.filter(function(s){return s.en!==previo;});
  if(libres.length)pool=libres;
  var s=pool[Math.floor(Math.random()*pool.length)];
  try{
    D.ultimaDespedida=s.en;
    D.despedidasVistas=(D.despedidasVistas||[]);
    if(D.despedidasVistas.indexOf(s.en)<0)D.despedidasVistas.push(s.en);
    save(D);
  }catch(e){}
  return s;
}

function momento(){
  var h=new Date().getHours();
  return h<12?1:(h<19?2:3);
}
function saludoDelDia(vuelve){
  var m=momento();
  var pool=SALUDOS.filter(function(s){
    if(s.mom!==0&&s.mom!==m)return false;
    if(s.quien===1&&vuelve)return false;
    if(s.quien===2&&!vuelve)return false;
    return true;
  });
  if(!pool.length)pool=[SALUDOS[0]];
  // que no repita el de la vez pasada
  var previo=D.ultimoSaludo;
  var libres=pool.filter(function(s){return s.en!==previo;});
  if(libres.length)pool=libres;
  var s=pool[Math.floor(Math.random()*pool.length)];
  D.ultimoSaludo=s.en;
  D.saludosVistos=(D.saludosVistos||[]);
  if(D.saludosVistos.indexOf(s.en)<0)D.saludosVistos.push(s.en);
  save(D);
  return s;
}



/* ═══════════ variantes ═══════════ */
// Una idea se dice de varias formas. Aprender solo una deja a la persona
// atorada cuando le contestan distinto. Cada frase modelo lleva sus variantes.
function variantesDe(en,p){
  var n=p&&p.nombre?p.nombre:'';
  var t=String(en||'').trim();
  var v=[],m;

  // frases compuestas: se toman las variantes de la primera parte
  if(/\.\s+\S/.test(t)&&t.split(/\.\s+/).length>1){
    var partes=t.split(/\.\s+/);
    var prim=partes[0]+'.', resto=partes.slice(1).join('. ');
    var vp=variantesDe(prim,p);
    if(vp.length>1)return vp.map(function(x){return x.replace(/\.$/,'')+'. '+resto;});
  }

  // presentarse
  if((m=t.match(/^My name is\s+(.+?)\.?$/i)))      v=['My name is '+m[1]+'.','I am '+m[1]+'.',"I'm "+m[1]+'.'];
  else if((m=t.match(/^His name is\s+(.+?)\.?$/i)))v=['His name is '+m[1]+'.','He is '+m[1]+'.',"He's "+m[1]+'.'];
  else if((m=t.match(/^Her name is\s+(.+?)\.?$/i)))v=['Her name is '+m[1]+'.','She is '+m[1]+'.',"She's "+m[1]+'.'];
  // oficio con artículo
  else if((m=t.match(/^I am (a|an)\s+(.+?)\.?$/i)))  v=['I am '+m[1]+' '+m[2]+'.',"I'm "+m[1]+' '+m[2]+'.','I work as '+m[1]+' '+m[2]+'.'];
  else if((m=t.match(/^He is (a|an)\s+(.+?)\.?$/i))) v=['He is '+m[1]+' '+m[2]+'.',"He's "+m[1]+' '+m[2]+'.','He works as '+m[1]+' '+m[2]+'.'];
  else if((m=t.match(/^She is (a|an)\s+(.+?)\.?$/i)))v=['She is '+m[1]+' '+m[2]+'.',"She's "+m[1]+' '+m[2]+'.','She works as '+m[1]+' '+m[2]+'.'];
  // oficio sin artículo: in sales, in IT, retired
  else if((m=t.match(/^I am not (.+?)\.?$/i)))     v=['I am not '+m[1]+'.',"I'm not "+m[1]+'.'];
  else if((m=t.match(/^I am\s+(.+?)\.?$/i)))       v=['I am '+m[1]+'.',"I'm "+m[1]+'.','I work '+m[1]+'.'];
  else if((m=t.match(/^We are\s+(.+?)\.?$/i)))     v=['We are '+m[1]+'.',"We're "+m[1]+'.'];
  // lugar de trabajo, cualquier preposición
  else if((m=t.match(/^I work\s+((?:at|in|on|from|around|for)\s+.+?)\.?$/i)))
        v=['I work '+m[1]+'.','My job is '+m[1]+'.','I have a job '+m[1]+'.'];
  else if((m=t.match(/^He works\s+((?:at|in|on|from|around|for)\s+.+?)\.?$/i)))
        v=['He works '+m[1]+'.','His job is '+m[1]+'.'];
  else if(/^I work every day\.?$/i.test(t))       v=['I work every day.','I work from Monday to Friday.','I work all week.'];
  // horario
  else if((m=t.match(/^I start\s+(.+?)\.?$/i)))    v=['I start '+m[1]+'.','I begin '+m[1]+'.','My shift starts '+m[1]+'.'];
  else if((m=t.match(/^She starts\s+(.+?)\.?$/i))) v=['She starts '+m[1]+'.','She begins '+m[1]+'.'];
  else if((m=t.match(/^He starts\s+(.+?)\.?$/i)))  v=['He starts '+m[1]+'.','He begins '+m[1]+'.'];
  // gustos
  else if((m=t.match(/^I like\s+(.+?)\.?$/i)))     v=['I like '+m[1]+'.','I enjoy '+m[1]+'.','I really like '+m[1]+'.'];
  else if((m=t.match(/^He likes\s+(.+?)\.?$/i)))   v=['He likes '+m[1]+'.','He enjoys '+m[1]+'.'];
  // para qué el inglés
  else if((m=t.match(/^I study English\s+(.+?)\.?$/i)))
        v=['I study English '+m[1]+'.','I am learning English '+m[1]+'.','I need English '+m[1]+'.'];
  // negativos y preguntas de la serie
  else if((m=t.match(/^I do not\s+(.+?)\.?$/i)))   v=['I do not '+m[1]+'.',"I don't "+m[1]+'.'];
  else if((m=t.match(/^Do you\s+(.+?)\?$/i)))      v=['Do you '+m[1]+'?','Do you usually '+m[1]+'?'];
  else if((m=t.match(/^Are you\s+(.+?)\?$/i)))     v=['Are you '+m[1]+'?','So, are you '+m[1]+'?'];
  else if(/^What is your name\?$/i.test(t))       v=['What is your name?',"What's your name?",'Can I have your name?'];
  else if(/^What time do you start\?$/i.test(t))  v=['What time do you start?','When do you start?'];
  // sociales
  else if(/^Nice to meet you\.?$/i.test(t))       v=['Nice to meet you.','Good to meet you.','Pleased to meet you.'];
  else if(/^And you\?$/i.test(t))                 v=['And you?','What about you?','How about you?'];
  else if(/^Yes, I do\.?$/i.test(t))              v=['Yes, I do.','Yes, every day.'];
  else if(/^It is difficult, but I like it\.?$/i.test(t))
        v=['It is difficult, but I like it.',"It's difficult, but I like it.",'It is hard, but I like it.'];
  // acciones del día: I check things, He checks things
  else if((m=t.match(/^I\s+([a-z]+)\s*(.*?)\.?$/i))){
    var r=m[2]?(' '+m[2]):'';
    v=['I '+m[1]+r+'.','I usually '+m[1]+r+'.','My job is to '+m[1]+r+'.'];
  }
  else if((m=t.match(/^He\s+([a-z]+)\s*(.*?)\.?$/i))){
    var r2=m[2]?(' '+m[2]):'';
    v=['He '+m[1]+r2+'.','He usually '+m[1]+r2+'.'];
  }
  else if((m=t.match(/^She\s+([a-z]+)\s*(.*?)\.?$/i))){
    var r3=m[2]?(' '+m[2]):'';
    v=['She '+m[1]+r3+'.','She usually '+m[1]+r3+'.'];
  }
  // si nada aplicó, al menos la contracción de is/am/are
  if(!v.length){
    var c=t.replace(/\bIt is\b/,"It's").replace(/\bThat is\b/,"That's").replace(/\bI am\b/,"I'm");
    v=(c!==t)?[t,c]:[t];
  }
  return v.filter(function(x,i,a){return x&&a.indexOf(x)===i;});
}

// Lo que salió mal la vez pasada se vuelve a practicar al día siguiente.
function repasoDeErrores(){
  var d=load();
  if(!d.sesiones||!d.sesiones.length)return [];
  var ult=d.sesiones[d.sesiones.length-1];
  var flojas=(ult.intentos||[]).filter(function(a){
    return a.tipo==='model'&&a.pct!==null&&a.pct!==undefined&&a.pct<80&&a.meta;
  });
  var vistos={},out=[];
  flojas.forEach(function(a){
    if(vistos[a.meta])return;
    vistos[a.meta]=1;
    out.push({k:'model',en:a.meta,es:'Esta te costó la vez pasada. Vamos otra vez.',repaso:true});
  });
  return out.slice(0,3);
}

// El error más común del shadowing es practicar sin oírse. Después de hablar,
// puede oír el modelo y su propia voz, una tras otra.
var MI_GRABACION=null,GRAB_ACTIVA=null,GRAB_TROZOS=[];
function grabandoDisponible(){
  return !!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder);
}
function empezarGrabacion(){
  if(!grabandoDisponible())return;
  // Si la app está sonando, el micrófono la graba a ella y no al alumno.
  // Se calla ANTES de abrir el micrófono, siempre.
  callarTodo();
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(st){
    GRAB_TROZOS=[];
    var tipo='';
    ['audio/webm;codecs=opus','audio/webm','audio/mp4'].forEach(function(t){
      if(!tipo&&window.MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t))tipo=t;
    });
    GRAB_ACTIVA=tipo?new MediaRecorder(st,{mimeType:tipo}):new MediaRecorder(st);
    GRAB_ACTIVA.ondataavailable=function(e){if(e.data&&e.data.size)GRAB_TROZOS.push(e.data);};
    GRAB_ACTIVA.onstop=function(){
      try{st.getTracks().forEach(function(t){t.stop();});}catch(e){}
      if(!GRAB_TROZOS.length)return;
      MI_GRABACION=URL.createObjectURL(new Blob(GRAB_TROZOS,{type:GRAB_ACTIVA.mimeType||'audio/webm'}));
    };
    GRAB_ACTIVA.start();
  }).catch(function(){});
}
function pararGrabacion(){
  try{if(GRAB_ACTIVA&&GRAB_ACTIVA.state!=='inactive')GRAB_ACTIVA.stop();}catch(e){}
  GRAB_ACTIVA=null;
}

  document.getElementById('dudacerrar').onclick=function(e){e.stopPropagation();d.remove();};
  var m=document.getElementById('dudamic');

    e.stopPropagation();
    var b=this;b.classList.add('rec');b.innerHTML='<span class="pulse"></span> Escuchando…';
    listen('es-MX',function(t){document.getElementById('dudatx').value=t;b.classList.remove('rec');b.innerHTML='<span class="pulse"></span> Decirlo otra vez';},
      function(){b.classList.remove('rec');b.disabled=true;b.textContent='El micrófono no abrió · escríbela';});
  };
  document.getElementById('dudaok').onclick=function(e){
    e.stopPropagation();
    var q=document.getElementById('dudatx').value.trim();
    if(!q)return;
    DUDAS.push(q);
    var r=document.getElementById('dudares');
    if(!hayIA()){
      r.innerHTML='<div class="heard"><span class="ok2">Anotada. Brian te la contesta al revisar tu sesión.</span></div>';
      return;
    }
    r.innerHTML='<div class="heard"><span class="hl">pensando…</span></div>';
    pedirIA('duda',{pregunta:q,nivel:(P&&P.nivel)||'',trabajo:(P&&P.trabajo_es)||''},
      function(res){
        if(!res||!res.respuesta){
          r.innerHTML='<div class="heard"><span class="ok2">Anotada. Brian te la contesta al revisar tu sesión.</span></div>';
          return;
        }
        r.innerHTML='<div class="heard"><div class="hl">respuesta</div><div style="font-size:15px;line-height:1.55">'+
          esc(res.respuesta)+'</div></div>';
        say(res.respuesta,'es-MX');
      },
      function(){r.innerHTML='<div class="heard"><span class="ok2">Anotada. Brian te la contesta al revisar tu sesión.</span></div>';});
  };
}

/* ═══════════ respuestas explicadas ═══════════ */
// Antes solo se marcaba bien o mal y se pasaba a la siguiente. Eso no ensena:
// el alumno ve el color pero no sabe por que. Ahora se le explica y, si fallo,
// se le deja intentar otra vez en vez de arrastrarlo al siguiente ejercicio.
function explicarRespuesta(op){
  // op: {caja, bien, elegida, correcta, porque, alSeguir, contexto}
  var r=document.getElementById('res');
  if(!r)return;
  var h='<div class="fb '+(op.bien?'ok':'no')+'">'+
    '<div class="fb-t">'+(op.bien?'Correcto':'Todavia no')+'</div>'+
    '<div class="fb-p" id="fbporque">'+esc(op.porque||'')+'</div>'+
    '</div>';
  if(!op.bien){
    h+='<button class="btn ghost" id="reint" style="margin-top:8px">Intentar otra vez</button>'+
       '<button class="btn ghost" id="verresp" style="margin-top:8px">Ensename la respuesta</button>';
  }else{
    h+='<button class="btn" id="seguir" style="margin-top:10px">Siguiente</button>';
  }
  r.innerHTML=h;

  // si no hay explicacion escrita, se la pedimos al cerebro
  if(!op.porque && hayIA()){
    var cj=document.getElementById('fbporque');
    if(cj)cj.innerHTML='<span style="opacity:.6;font-style:italic">pensando por que…</span>';
    pedirIA('duda',{
      pregunta:'Alumno de nivel '+((P&&P.nivel)||'A1')+'. '+(op.contexto||'')+
        ' Eligio: "'+op.elegida+'". La correcta es: "'+op.correcta+'". '+
        'Explicale en ESPANOL, en maximo dos lineas, por que la correcta es correcta '+
        'y que tiene de malo la que eligio. Sin saludos, sin relleno.',
      nivel:(P&&P.nivel)||''},
      function(res){
        var c2=document.getElementById('fbporque');
        if(c2)c2.textContent=(res&&res.respuesta)?String(res.respuesta).trim()
          :(op.bien?'Asi es.':'Era: '+op.correcta);
      },
      function(){
        var c3=document.getElementById('fbporque');
        if(c3)c3.textContent=op.bien?'Asi es.':'Era: '+op.correcta;
      });
  }

  var re=document.getElementById('reint');
  if(re)re.onclick=function(){
    r.innerHTML='';
    if(op.caja)APP.querySelectorAll(op.caja+' .opt').forEach(function(z){
      z.disabled=false; z.classList.remove('ok','no');
    });
  };
  var vr=document.getElementById('verresp');
  if(vr)vr.onclick=function(){
    r.innerHTML='<div class="fb ok"><div class="fb-t">La respuesta</div>'+
      '<div class="fb-p">'+esc(op.correcta)+'</div></div>'+
      '<button class="btn" id="seguir2" style="margin-top:10px">Siguiente</button>';
    var s2=document.getElementById('seguir2');
    if(s2)s2.onclick=function(){ op.alSeguir&&op.alSeguir(); };
  };
  var sg=document.getElementById('seguir');
  if(sg)sg.onclick=function(){ op.alSeguir&&op.alSeguir(); };
}

// Antes solo se marcaba en rojo lo que falló. Eso no enseña: el alumno ve
// que se equivocó pero no sabe en qué ni cómo arreglarlo. Ahora se le dice.
function pedirCorreccion(x,meta,dicho,pct,estuvoBien){
  var caja=document.getElementById('correccion');
  if(caja)caja.innerHTML='<div class="corr pensando">viendo qué te faltó…</div>';
  pedirIA('corregir',{
      meta:meta, dijo:dicho, pct:pct,
      nivel:(P&&P.nivel)||'A1', trabajo:(P&&P.trabajo_es)||''},
    function(res){
      var c=document.getElementById('correccion');
      if(!res||(!res.que&&!res.como)){
        if(c)c.innerHTML='';
        say(estuvoBien?'Muy bien.':'Casi. Escúchala otra vez y repítela sin prisa.','es-MX');
        return;
      }
      if(c)c.innerHTML=
        '<div class="corr'+(res.bien?' ok':'')+'">'+
          '<div class="corr-h">'+(res.bien?'Lo que hiciste bien':'Qué te faltó')+'</div>'+
          '<div class="corr-q">'+esc(res.que)+'</div>'+
          (res.como?'<div class="corr-h" style="margin-top:9px">Cómo arreglarlo</div>'+
                    '<div class="corr-c">'+esc(res.como)+'</div>':'')+
          (res.boca?'<div class="corr-h" style="margin-top:9px">La boca</div>'+
                    '<div class="corr-c">'+esc(res.boca)+'</div>':'')+
          (res.tono?'<div class="corr-h" style="margin-top:9px">El tono</div>'+
                    '<div class="corr-c">'+esc(res.tono)+'</div>':'')+
          (res.clave?'<div class="corr-k">Fíjate en: <b>'+esc(res.clave)+'</b></div>':'')+
          '<div class="oirfila" style="margin-top:10px">'+
            '<button class="oirb" id="corroir">'+ico('bocina',15)+' Oírla bien</button>'+
            '<button class="oirb alt" id="corrlento">'+ico('bocina',15)+' Muy lento</button>'+
          '</div>'+
          (res.bien?'':'<button class="btn" id="corrotra" style="margin-top:9px">'+
                       'Intentarlo otra vez</button>')+
        '</div>';
      var dilo=res.que+(res.como?'. '+res.como:'');
      say(dilo,'es-MX');
      var b=document.getElementById('corroir');
      if(b)b.onclick=function(e){e.stopPropagation();say(meta,'en-US');};
      var bl=document.getElementById('corrlento');
      if(bl)bl.onclick=function(e){e.stopPropagation();sayLento(meta,'en-US');};
      // fallar y volver a intentar ES el ejercicio: se repinta el mismo paso
      var ot=document.getElementById('corrotra');
      if(ot)ot.onclick=function(e){ e.stopPropagation(); paso(); };
      attempts.push({tipo:'correccion',meta:meta,oido:res.que+' | '+res.como,pct:null});
    },
    function(){
      var c=document.getElementById('correccion');
      if(c)c.innerHTML='';
      say(estuvoBien?'Muy bien.':'Casi. Escúchala otra vez y repítela sin prisa.','es-MX');
    });
}

/* ═══════════ variantes: traducir y preguntar ═══════════ */

// El botón de "qué significa" solo servía en la frase principal.
// Las variantes no traían traducción escrita, así que se le pide al cerebro
// (y si no hay cerebro, se dice al menos en inglés para no dejar al alumno colgado).
var TRAD_CACHE={};
function traducirVariante(en,caja,listo){
  if(!en)return;
  function pinta(es){
    if(es&&caja){
      var d=document.createElement('div');
      d.className='vartrad';
      d.textContent=es;
      caja.appendChild(d);
    }
    if(es)say(es,'es-MX');
    else say(en,'en-US');
    listo&&listo(es);
  }
  if(TRAD_CACHE[en]){ pinta(TRAD_CACHE[en]); return; }
  if(!hayIA()){ pinta(null); return; }
  if(caja){
    var esp=document.createElement('div');
    esp.className='vartrad pensando'; esp.textContent='traduciendo…';
    caja.appendChild(esp);
  }
  pedirIA('duda',{
      pregunta:'Traduce esta frase al español de México, natural y corta. '+
               'Responde SOLO con la traducción, sin comillas ni explicación: "'+en+'"',
      nivel:(P&&P.nivel)||'', trabajo:(P&&P.trabajo_es)||''},
    function(res){
      var esp2=caja&&caja.querySelector('.vartrad.pensando');
      if(esp2)esp2.remove();
      var es=(res&&res.respuesta)?String(res.respuesta).replace(/^["']|["']$/g,'').trim():null;
      if(es)TRAD_CACHE[en]=es;
      pinta(es);
    },
    function(){
      var esp3=caja&&caja.querySelector('.vartrad.pensando');
      if(esp3)esp3.remove();
      pinta(null);
    });
}

// ── Pregúntame lo que sea ──
// Un solo lugar para todo: cómo se dice algo, phrasal verbs, expresiones,
// por qué se dice así, o cualquier duda suelta.
// Se puede ESCRIBIR o DECIR, en español o en inglés.
var PREG_IDIOMA='es';

function abrirDudaFrase(x){
  var caja=document.getElementById('dudacaja');
  if(!caja)return;
  if(caja.innerHTML.trim()){ caja.innerHTML=''; return; }

  var frase=(x&&x.en)||'';
  caja.innerHTML=
    '<div class="dudabox">'+
      '<div class="hl">Pregúntame lo que sea</div>'+
      '<p class="tiny" style="margin:4px 0 9px">Escríbelo o dilo. En español o en inglés, como te salga.</p>'+

      '<div class="pgchips" id="pgchips">'+
        '<button class="pgchip" data-p="decir">¿Cómo digo…?</button>'+
        '<button class="pgchip" data-p="phrasal">Phrasal verbs</button>'+
        '<button class="pgchip" data-p="idiom">Expresiones</button>'+
        '<button class="pgchip" data-p="porque">¿Por qué se dice así?</button>'+
        '<button class="pgchip" data-p="libre">Otra duda</button>'+
      '</div>'+

      '<div class="pgidioma">'+
        '<button class="pgi on" data-i="es">Español</button>'+
        '<button class="pgi" data-i="en">English</button>'+
      '</div>'+

      '<div class="pgfila">'+
        '<input class="tx" id="dftx" placeholder="Escribe tu pregunta..." autocomplete="off">'+
        '<button class="pgmic" id="dfmic" title="Decirlo">'+ico('boca',18)+'</button>'+
      '</div>'+
      '<button class="btn" id="dfok" style="margin-top:8px">Preguntar</button>'+
      '<div id="dfres"></div>'+
    '</div>';

  var inp=document.getElementById('dftx');
  if(inp)inp.focus();

  // idioma en que pregunta
  caja.querySelectorAll('.pgi').forEach(function(b){
    b.onclick=function(e){
      e.stopPropagation();
      PREG_IDIOMA=b.dataset.i;
      caja.querySelectorAll('.pgi').forEach(function(z){z.classList.remove('on');});
      b.classList.add('on');
      if(inp)inp.placeholder = PREG_IDIOMA==='es'
        ? 'Escribe tu pregunta...' : 'Type your question...';
    };
  });

  // atajos
  var PLANTILLA={
    decir:  {es:'¿Cómo digo "…"?',            en:'How do I say "…"?'},
    phrasal:{es:'Dame phrasal verbs con esta frase', en:'Give me phrasal verbs for this'},
    idiom:  {es:'Dame una expresión que signifique lo mismo', en:'Give me an idiom that means this'},
    porque: {es:'¿Por qué se dice así?',      en:'Why is it said this way?'},
    libre:  {es:'',                            en:''}
  };
  var MODO='libre';
  caja.querySelectorAll('.pgchip').forEach(function(b){
    b.onclick=function(e){
      e.stopPropagation();
      MODO=b.dataset.p;
      caja.querySelectorAll('.pgchip').forEach(function(z){z.classList.remove('on');});
      b.classList.add('on');
      var t=PLANTILLA[MODO][PREG_IDIOMA]||'';
      if(inp){
        inp.value=t;
        inp.focus();
        var pos=t.indexOf('…');
        if(pos>=0){ try{ inp.setSelectionRange(pos,pos+1); }catch(err){} }
      }
      if(MODO==='phrasal'||MODO==='idiom'){ mandar(); }
    };
  });

  // decirlo en vez de escribirlo
  var mic=document.getElementById('dfmic');
  if(mic)mic.onclick=function(e){
    e.stopPropagation();
    var d=diagnostico();
    if(!d.ok){ avisito(d.largo); return; }
    mic.classList.add('oyendo');
    mic.innerHTML=ico('boca',18)+'<span class="pgpunto"></span>';
    listen(PREG_IDIOMA==='es'?'es-MX':'en-US',
      function(txt){
        mic.classList.remove('oyendo'); mic.innerHTML=ico('boca',18);
        if(inp){ inp.value=txt; }
        PREG_POR_VOZ=true;
        verLoQueOi(txt);
      },
      function(err){
        mic.classList.remove('oyendo'); mic.innerHTML=ico('boca',18);
        avisito(err==='no-speech'?'No te oí. Acércate y toca otra vez.'
                                 :'No pude abrir el micrófono. Escríbelo mejor.');
      });
  };

  // Antes, lo que el microfono entendiera se mandaba al instante. Si entendia
  // mal, el alumno no se enteraba nunca y la respuesta llegaba fuera de lugar.
  // Ahora se le ensena por escrito lo que se oyo y el decide si es eso.
  var PREG_POR_VOZ=false;
  function verLoQueOi(txt){
    var r=document.getElementById('dfres');
    if(!r){ mandar(); return; }
    r.innerHTML='<div class="heard"><div class="hl">esto te oí</div>'+
      '<div class="ht">'+esc(txt)+'</div>'+
      '<p class="tiny" style="margin:7px 0 0">Si no es eso, corrígelo en el renglón de arriba.</p>'+
      '<div class="oirfila" style="margin-top:8px">'+
        '<button class="oirb" id="dfsi">Sí, es eso · preguntar</button>'+
        '<button class="oirb alt" id="dfno">Decirlo otra vez</button>'+
      '</div></div>';
    var si=document.getElementById('dfsi');
    if(si)si.onclick=function(ev){ ev.stopPropagation(); mandar(); };
    var no=document.getElementById('dfno');
    if(no)no.onclick=function(ev){ ev.stopPropagation(); var m=document.getElementById('dfmic'); if(m)m.click(); };
  }

  function instruccion(q){
    var niv=(P&&P.nivel)||'A1';
    var base='Alumno mexicano de nivel '+niv+' aprendiendo inglés de trabajo. ';
    if(frase)base+='Está practicando la frase: "'+frase+'". ';
    if(MODO==='phrasal'){
      return base+'Dale DOS phrasal verbs útiles relacionados con esa frase o con su trabajo. '+
        'Formato exacto, sin nada más:\nphrasal — significado en español — ejemplo corto en inglés\n'+
        'Uno por línea. Nivel '+niv+', nada rebuscado.';
    }
    if(MODO==='idiom'){
      return base+'Dale UNA expresión idiomática en inglés que sirva en su trabajo y se '+
        'relacione con la frase. Formato exacto, sin nada más:\n'+
        'expresión — qué significa en español — cuándo se usa (una línea)';
    }
    if(MODO==='porque'){
      return base+'Explícale en español, en máximo tres líneas y sin tecnicismos, por qué esa '+
        'frase se dice así en inglés. Si hay una regla, dísela con palabras sencillas.';
    }
    if(MODO==='decir'){
      return base+'Quiere decir: "'+q+'". Dale la frase en inglés, corta y natural, en la PRIMERA '+
        'línea y sola. Luego, en UNA línea, explícale en español qué cambió respecto a la frase '+
        'que practica. Nada más.';
    }
    return base+'Su pregunta es: "'+q+'". Contéstale en español, claro y corto, máximo cuatro '+
      'líneas. Si la respuesta incluye una frase en inglés, ponla en la PRIMERA línea, sola.';
  }

  function mandar(){
    var q=(inp&&inp.value||'').trim();
    if(!q&&MODO!=='phrasal'&&MODO!=='idiom'&&MODO!=='porque'){
      avisito(PREG_IDIOMA==='es'?'Escribe o di tu pregunta.':'Type or say your question.');
      return;
    }
    var r=document.getElementById('dfres');
    if(!hayIA()){
      if(r)r.innerHTML='<div class="heard"><span class="ok2">Anotada. Brian te la contesta al revisar tu sesión.</span></div>';
      try{ DUDAS.push((PREG_POR_VOZ?'(hablando) ':'')+q); }catch(e){}
      attempts.push({tipo:'pregunta',meta:frase,oido:q,pct:null});
      return;
    }
    if(r)r.innerHTML='<div class="heard"><span class="hl">pensando…</span></div>';
    pedirIA('duda',{pregunta:instruccion(q),nivel:(P&&P.nivel)||'',trabajo:(P&&P.trabajo_es)||''},
      function(res){
        if(!res||!res.respuesta){
          if(r)r.innerHTML='<div class="heard"><span class="ok2">Anotada. Brian te la contesta.</span></div>';
          return;
        }
        var t=String(res.respuesta).trim();
        var prim=(t.split('\n')[0]||'').replace(/^["']|["']$/g,'').trim();
        // ¿la primera línea es una frase en inglés que se pueda practicar?
        var esIngles=/^[A-Za-z0-9 ,.'!?-]+$/.test(prim)&&prim.split(' ').length>1&&prim.length<90;
        if(r)r.innerHTML=
          '<div class="heard"><div class="hl">'+(MODO==='phrasal'?'phrasal verbs':
             MODO==='idiom'?'expresión':MODO==='porque'?'por qué':'respuesta')+'</div>'+
          '<div class="pgtxt">'+esc(t).replace(/\n/g,'<br>')+'</div>'+
          '<div class="oirfila" style="margin-top:8px">'+
            '<button class="oirb" id="dfoir">'+ico('bocina',16)+' Oírla</button>'+
            (esIngles?'<button class="oirb alt" id="dfusar">Practicar esta</button>':'')+
          '</div></div>';
        if(esIngles)say(prim,'en-US'); else say(t,'es-MX');
        attempts.push({tipo:'pregunta-'+MODO,meta:q||frase,oido:t,pct:null});
        // Se guarda la pregunta Y la respuesta, y si la dijo hablando se anota,
        // para que Brian sepa si el microfono la entendio bien.
        try{ DUDAS.push((PREG_POR_VOZ?'(hablando) ':'')+(q||MODO)+'  →  '+t); }catch(e){}
        var o=document.getElementById('dfoir');
        if(o)o.onclick=function(ev){ev.stopPropagation();
          if(esIngles)say(prim,'en-US'); else say(t,'es-MX');};
        var u=document.getElementById('dfusar');
        if(u)u.onclick=function(ev){
          ev.stopPropagation();
          x.en=prim; x.es=q||'';
          paso();
          avisito('Ahora practicas la tuya.');
        };
      },
      function(){
        if(r)r.innerHTML='<div class="heard"><span class="ok2">No pude traerla. Brian te la contesta al revisar.</span></div>';
      });
  }

  var ok=document.getElementById('dfok');
  if(ok)ok.onclick=function(e){e.stopPropagation();mandar();};
  if(inp)inp.addEventListener('keydown',function(e){if(e.key==='Enter')mandar();});
}

/* ═══════════ cambiar una pieza ═══════════ */
function serieDe(en,p){
  var out=[],m;
  if((m=en.match(/^I am (a|an)\s+(.+?)\.?$/i))){
    var art=m[1], of=m[2];
    var plural=of.replace(/^(a|an)\s+/i,'')+'s';
    out=[
      {pide:'Ahora habla de un compañero. Él.',   di:'He is '+art+' '+of+'.'},
      {pide:'Ahora de una compañera. Ella.',      di:'She is '+art+' '+of+'.'},
      {pide:'Ahora de ti y tu equipo. Nosotros.', di:'We are '+plural+'.'},
      {pide:'Ahora dilo en negativo.',            di:'I am not '+art+' '+of+'.'},
      {pide:'Ahora pregúntale a alguien.',        di:'Are you '+art+' '+of+'?'}
    ];
  }else if((m=en.match(/^I work\s+(.+?)\.?$/i))){
    var d=m[1];
    out=[
      {pide:'Ahora de un compañero. Él.',  di:'He works '+d+'.'},
      {pide:'Ahora de ustedes. Nosotros.', di:'We work '+d+'.'},
      {pide:'Ahora en negativo.',          di:'I do not work '+d+'.'},
      {pide:'Ahora pregunta.',             di:'Do you work '+d+'?'}
    ];
  }else if((m=en.match(/^I start\s+(.+?)\.?$/i))){
    var h=m[1];
    out=[
      {pide:'Ahora de tu compañera. Ella.', di:'She starts '+h+'.'},
      {pide:'Ahora pregunta la hora.',      di:'What time do you start?'},
      {pide:'Ahora en negativo.',           di:'I do not start '+h+'.'}
    ];
  }else if((m=en.match(/^I like\s+(.+?)\.?$/i))){
    var g=m[1];
    out=[
      {pide:'Ahora de un compañero. A él le gusta.', di:'He likes '+g+'.'},
      {pide:'Ahora en negativo.',                    di:'I do not like '+g+'.'},
      {pide:'Ahora pregunta.',                       di:'Do you like '+g+'?'}
    ];
  }else if((m=en.match(/^My name is\s+(.+?)\.?$/i))){
    out=[
      {pide:'Ahora presenta a alguien más.', di:'His name is Pedro.'},
      {pide:'Ahora a una compañera.',        di:'Her name is Ana.'},
      {pide:'Ahora pregunta el nombre.',     di:'What is your name?'}
    ];
  }else if((m=en.match(/^I\s+([a-z]+)\s*(.*?)\.?$/i))){
    var v=m[1], resto=m[2]?(' '+m[2]):'';
    var v3=/[sxz]$|ch$|sh$/.test(v)?v+'es':(/[^aeiou]y$/.test(v)?v.slice(0,-1)+'ies':v+'s');
    out=[
      {pide:'Ahora de un compañero. Él.', di:'He '+v3+resto+'.'},
      {pide:'Ahora en negativo.',         di:'I do not '+v+resto+'.'},
      {pide:'Ahora pregunta.',            di:'Do you '+v+resto+'?'}
    ];
  }
  return out;
}

/* ═══════════ la misma frase en varios acentos ═══════════ */
// Oír la frase en bocas distintas es lo que entrena el oído. En vez de
// depender de videos ajenos con publicidad, se usan los paquetes de voz
// que ya tenemos: la misma frase en americano, británico, australiano.
function acentosDisponibles(){ return PAQUETES; }
function botonVideo(frase){
  return '<button class="ygb" data-fr="'+esc(frase)+'">'+ico('globo',17)+' Oírla en otros acentos</button>';
}
function abrirVideo(frase,boton){
  var viejo=document.getElementById('ygbox');
  if(viejo){viejo.remove();return;}   // segundo toque: se cierra
  var caja=(boton&&boton.parentNode)||document.getElementById('res')||APP;
  var lista=acentosDisponibles();
  var d=document.createElement('div');
  d.id='ygbox';d.className='ygbox';
  d.innerHTML='<div class="hl">La misma frase, en otras bocas</div>'+
    '<p class="ygaviso2">Es lo mismo dicho en distintos países. No tienes que entenderlo todo: '+
    'fíjate en cómo cambia el sonido.</p>'+
    '<div class="acfila">'+
      lista.map(function(p){
        return '<button class="acb" data-id="'+p.id+'">'+esc(p.nombre)+'</button>';
      }).join('')+
    '</div>'+
    '<button class="compb full" id="actodos" style="margin-top:8px">▶ Oírla en todos, uno tras otro</button>'+
    '<button class="btn ghost" id="ygcerrar" style="margin-top:8px">Cerrar</button>';
  // aparece justo debajo del botón que lo abrió
  if(boton&&boton.nextSibling)caja.insertBefore(d,boton.nextSibling);
  else caja.appendChild(d);
  document.getElementById('ygcerrar').onclick=function(e){e.stopPropagation();d.remove();};

  function conAcento(id,cb){
    var antes=PAQUETE_ACTIVO;
    PAQUETE_ACTIVO=id;armarRutas();
    say(frase,'en-US',function(){
      PAQUETE_ACTIVO=antes;armarRutas();
      cb&&cb();
    });
  }
  d.querySelectorAll('.acb').forEach(function(b){
    b.onclick=function(e){
      e.stopPropagation();
      d.querySelectorAll('.acb').forEach(function(x){x.classList.remove('on');});
      b.classList.add('on');
      conAcento(b.getAttribute('data-id'));
    };
  });
  document.getElementById('actodos').onclick=function(e){
    e.stopPropagation();
    var i=0,btns=d.querySelectorAll('.acb');
    (function siguiente(){
      if(i>=lista.length)return;
      btns.forEach(function(x){x.classList.remove('on');});
      if(btns[i])btns[i].classList.add('on');
      var id=lista[i].id;i++;
      conAcento(id,function(){setTimeout(siguiente,250);});
    })();
  };
}
function ligarVideo(){
  APP.querySelectorAll('.ygb').forEach(function(b){
    b.onclick=function(e){e.stopPropagation();abrirVideo(b.dataset.fr,b);};
  });
}

/* ═══════════ modo shadowing ═══════════ */
// Repetir con pausa es una técnica; hablar encima es otra distinta, y es la
// que construye ritmo y entonación. Aparece cuando la frase ya le sale bien.
var SH_RONDA=0;
function bloqueShadow(frase){
  return '<div class="shbox" id="shbox">'+
    '<div class="hl">Ahora al mismo tiempo</div>'+
    '<p class="sh-t">Voy a decir la frase despacio, tres veces. Habla <b>encima de mí</b>, '+
    'medio segundo atrás, como una sombra. No pares entre una y otra.</p>'+
    '<div class="sh-r"><span id="shr1" class="sh-p">1</span><span id="shr2" class="sh-p">2</span><span id="shr3" class="sh-p">3</span></div>'+
    '<button class="compb full" id="shgo">▶ Empezar las tres</button>'+
    '</div>';
}
function ligarShadow(frase){
  var b=document.getElementById('shgo');
  if(!b)return;
  b.onclick=function(e){
    e.stopPropagation();
    SH_RONDA=0;
    var velAnterior=VEL_AUDIO;
    VEL_AUDIO=0.85;
    b.disabled=true;b.textContent='Habla conmigo…';
    (function ronda(){
      SH_RONDA++;
      var p=document.getElementById('shr'+SH_RONDA);
      if(p)p.className='sh-p on';
      say(frase,'en-US',function(){
        if(SH_RONDA<3){setTimeout(ronda,700);}
        else{
          VEL_AUDIO=velAnterior;
          b.disabled=false;b.textContent='▶ Otra vez las tres';
          attempts.push({tipo:'shadow',meta:frase,oido:'hizo shadowing',pct:null});
        }
      });
    })();
  };
}

// El límite no es para cortar: es para que sepa cuánto le queda y aproveche.
// Al llegar a cero no se bloquea nada — se le ofrece cerrar. Practicar de más
// cansado no sirve, y obligarlo a parar a media frase tampoco.
var MINUTOS=20, RELOJ=null, AVISADO=false;
function arrancarReloj(){
  pararReloj();AVISADO=false;
  RELOJ=setInterval(pintarReloj,1000);
  pintarReloj();
}
function pararReloj(){ if(RELOJ){clearInterval(RELOJ);RELOJ=null;} }
function pintarReloj(){
  var caja=document.getElementById('reloj');
  if(!caja)return;
  var pasados=Math.floor((Date.now()-t0)/1000);
  var quedan=Math.max(0,MINUTOS*60-pasados);
  var m=Math.floor(quedan/60), sg=quedan%60;
  caja.textContent=m+':'+(sg<10?'0':'')+sg;
  caja.className='reloj'+(quedan<=180?' poco':'')+(quedan===0?' fin':'');
  if(quedan===0&&!AVISADO){
    AVISADO=true;
    caja.textContent='se acabó el tiempo';
    var b=document.getElementById('skip');
    if(b){
      b.classList.add('btn-cerrar');
      b.textContent='Cerrar aquí · ya son 20 minutos';
    }
    say('Ya pasaron los veinte minutos. Puedes cerrar aquí o terminar lo que estás haciendo.','es-MX');
  }
}

/* ═══════════ el camino ═══════════ */
// Sesenta paradas, iguales para todos. Lo que cambia es dónde entra cada
// quien según su nivel: ver el camino recorrido detrás motiva más que
// empezar de cero sabiendo que ya sabes.
// 28 paradas por nivel: 4 bloques de 7. Repaso en la 7, 14, 21 y 28;
// las de 14 y 28 son además examen. Antes eran 72, arrastre del diseño viejo
// de un solo mapa para todo el curso (daba 490 lecciones, casi 5 años).
var PARADAS=28;
var CADA=7;              // cada séptima casilla es repaso

// ¿esta casilla es de repaso?
function esRepaso(n){ return n%CADA===0; }
// a qué sesión de contenido corresponde una casilla que no es de repaso
function contenidoDe(n){ return n-Math.floor(n/CADA); }
var TRAMOS=[
  {desde:1,  hasta:14, nombre:'En tu área',        sub:'Presentarte y decir qué haces',        color:'#C9A84C'},
  {desde:15, hasta:36, nombre:'Con tu equipo',     sub:'Turnos, rutina y pedir cosas',         color:'#9A7C22'},
  {desde:37, hasta:54, nombre:'Llega un cliente',  sub:'Atender una visita a la planta',       color:'#C08A22'},

  {desde:65, hasta:72, nombre:'Fuera de México',   sub:'Viajar y presentarte con un cliente',  color:'#6F5716'}
];

// El piso de cada tramo. Cambiar de zona se ve en el suelo, no en un letrero:
// el alumno cruza el arco y el mundo debajo de sus pies es otro.

   loseta:'#E2DECC', lIzq:'#C3BFAD', lDer:'#B3AF9D', num:'#8A8776',

function ambienteDe(n){
  for(var i=0;i<TRAMOS.length;i++)if(n>=TRAMOS[i].desde&&n<=TRAMOS[i].hasta)return AMBIENTES[i];
  return AMBIENTES[0];
}
function idxTramo(n){
  for(var i=0;i<TRAMOS.length;i++)if(n>=TRAMOS[i].desde&&n<=TRAMOS[i].hasta)return i;
  return 0;
}
function tramoDe(n){
  for(var i=0;i<TRAMOS.length;i++)if(n>=TRAMOS[i].desde&&n<=TRAMOS[i].hasta)return TRAMOS[i];
  return TRAMOS[0];
}

function paradaInicial(nivel_n){
  /* Antes devolvia 14, 35 y 53: paradas del mapa VIEJO de 70. Con el mapa
     de 28 por nivel esos numeros caen fuera y traban la entrada.
     Hoy cada nivel tiene su propio mapa, asi que TODOS arrancan en la 1:

}
function progreso(){

    d.camino={parada:paradaInicial(P&&P.nivel_n),maxima:paradaInicial(P&&P.nivel_n),
              puntos:0,gastados:0,dias:[],avatar:{}};

// ── puntos ──
// Se ganan por producir y por volver. Volver pesa más: terminar una lección
// lo hace cualquiera con ganas un martes; volver el jueves es lo difícil.
function sumarPuntos(rec){
  var c=progreso();
  var att=rec.intentos||[];
  var producidas=att.filter(function(a){return a.oido&&a.tipo!=='pista'&&a.tipo!=='listening'&&a.tipo!=='numeros';}).length;
  var escuchas=att.filter(function(a){return a.tipo==='listening'&&a.pct===100;}).length;
  var sombra=att.filter(function(a){return a.tipo==='shadow';}).length;
  var ganados=producidas*3+escuchas*2+sombra*2+10;   // 10 por terminar

  // constancia: si volvió otro día, vale más
  var hoy=new Date().toISOString().slice(0,10);
  if(c.dias.indexOf(hoy)<0){
    c.dias.push(hoy);
    var seguidos=diasSeguidos(c.dias);
    ganados+=15+Math.min(seguidos,5)*5;
  }
  c.puntos+=ganados;
  SALTAR_DESDE=c.parada;             // de aquí brinca el muñeco al volver al mapa
  c.parada=Math.min(c.parada+1,PARADAS);
  c.maxima=Math.max(c.maxima,c.parada);
  guardarProgreso(c);
  return {ganados:ganados,producidas:producidas,escuchas:escuchas,sombra:sombra};
}
function diasSeguidos(dias){
  if(!dias.length)return 0;
  var o=dias.slice().sort().reverse(),n=1;
  for(var i=1;i<o.length;i++){
    var a=new Date(o[i-1]),b=new Date(o[i]);
    if(Math.round((a-b)/86400000)===1)n++; else break;
  }
  return n;
}
function puntosLibres(){var c=progreso();return c.puntos-(c.gastados||0);}

/* Recorta cuadrado y encoge a 240px. Una foto de celular pesa 4 MB y
   localStorage aguanta 5: sin esto, la primera foto llena el cajon. */
function recortarFoto(file,cb){
  try{
    var r=new FileReader();
    r.onerror=function(){ cb(null); };
    r.onload=function(){
      var im=new Image();
      im.onerror=function(){ cb(null); };
      im.onload=function(){
        try{
          var L=Math.min(im.width,im.height), cv=document.createElement('canvas');
          cv.width=cv.height=240;
          var x=cv.getContext('2d');
          x.drawImage(im,(im.width-L)/2,(im.height-L)/2,L,L,0,0,240,240);
          cb(cv.toDataURL('image/jpeg',0.82));
        }catch(e){ cb(null); }
      };
      im.src=r.result;
    };
    r.readAsDataURL(file);
  }catch(e){ cb(null); }
}

// OJO: la app ya tiene una saludoDelDia(vuelve) que devuelve un saludo completo.
// Esta es otra cosa y por eso lleva otro nombre; antes se llamaban igual y la mía
// pisaba a la suya, dejando "undefined" en la portada.
function horaDelDia(){
  var h=new Date().getHours();
  if(h<12) return 'Buenos días';
  if(h<19) return 'Buenas tardes';
  return 'Buenas noches';
}

function hojaHola(){
  if(document.getElementById('hojahola'))return;
  var c; try{ c=progreso(); }catch(e){ c={parada:1,racha:0}; }
  var nom=(P&&P.nombre)||'';
  var f=null; try{ f=localStorage.getItem('efa_foto'); }catch(e){}
  var racha=c.racha||0;

  // Un saludo distinto cada vez, escogido por la hora y por si ya nos
  // conocemos. Antes siempre decía lo mismo ("Buenos días") y el alumno
  // solo aprendía una forma de saludar, que es justo lo que no queremos.
  // La primerisima vez se presenta: "Nice to meet you". De la segunda en
  // adelante ya se conocen, y toca saludo normal.
  var primeraVez=false;
  try{ primeraVez=!(D&&D.sesiones&&D.sesiones.length); }catch(e){}
  var sal;
  if(primeraVez){
    sal={en:'Nice to meet you.',es:'Mucho gusto — cuando apenas se conocen.',reg:0};
  }else{
    try{ sal=saludoDelDia(true); }catch(e){ sal={en:horaDelDia(),es:'',reg:0}; }
  }
  var hayEs=(typeof modoIdioma==='function')?(modoIdioma()!=='en'):true;

  var v=document.createElement('div');
  v.className='hoja-velo'; v.id='hojahola';
  v.innerHTML='<div class="hoja">'+
    '<div class="hoja-asa"></div>'+
    '<div class="hoja-cab">'+
      (f?'<img class="hoja-foto" src="'+f+'" alt="">':'<div class="hoja-foto vacia">\u{1F464}</div>')+
      '<div><div class="hoja-hola">'+esc(sal.en)+'</div>'+
      '<div class="hoja-nom">'+esc(nom||'qué gusto verte')+'</div></div>'+
    '</div>'+
    '<div class="hoja-gloss">'+
      (hayEs&&sal.es?esc(sal.es)+' · ':'')+esc(REGISTRO[sal.reg||0])+
    '</div>'+
    (racha>0?'<div class="hoja-racha"><b>'+racha+'</b> días seguidos. No la rompas hoy.</div>':'')+
    '<div class="hoja-hoy">'+
      '<div class="hoja-et">Hoy te toca</div>'+
      '<div class="hoja-lec">Parada '+c.parada+'</div>'+
      '<div class="hoja-sub">Diez minutos y ya. Ni uno más si no quieres.</div>'+
    '</div>'+
    '<button class="oirb hoja-oir" id="hojaoir">'+ico('bocina',15)+' Repetir</button>'+
    '<button class="btn hoja-btn" id="hojair">Empezar</button>'+
    '<button class="hoja-mas" id="hojamas">Solo quiero ver el mapa</button>'+
  '</div>';
  document.body.appendChild(v);
  requestAnimationFrame(function(){ v.classList.add('abierta'); });
  // Se dice solo. Es una app de hablado: el saludo se oye antes de leerse.
  setTimeout(function(){ try{ say(sal.en,'en-US'); }catch(e){} },380);

  function cerrar(){
    v.classList.remove('abierta');
    setTimeout(function(){ v.remove(); },340);
  }
  v.onclick=function(e){ if(e.target===v)cerrar(); };
  var so=document.getElementById('hojaoir');
  if(so)so.onclick=function(e){ e.stopPropagation(); try{say(sal.en,'en-US');}catch(err){} };
  var ir=document.getElementById('hojair');
  if(ir)ir.onclick=function(){ cerrar(); setTimeout(function(){ try{correr();}catch(e){} },300); };
  var mas=document.getElementById('hojamas');
  if(mas)mas.onclick=cerrar;
}

/* La despedida no se mide en minutos sino en EJERCICIOS: sale cuando
   faltan dos para terminar la leccion. Asi siempre cae donde debe, sin
   importar si ese dia el alumno fue rapido o lento. */
var YA_AVISE_FINAL=false;

function avisarSiYaCasi(){
  try{
    if(YA_AVISE_FINAL||!P)return;
    if(document.getElementById('hojaadios'))return;
    var S=MAT&&MAT[sIdx];
    if(!S||!S.items||!S.items.length)return;
    var faltan=S.items.length-it;
    if(faltan===2){
      YA_AVISE_FINAL=true;
      setTimeout(function(){ hojaAdios(true); },500);
    }
  }catch(e){}
}

// la despedida tambien sale cuando el alumno intenta irse
(function(){
  var yaSalio=false;
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState==='hidden')yaSalio=true;
  });
  window.addEventListener('pagehide',function(){ yaSalio=true; });
  // en computadora: al llevar el cursor fuera por arriba
  document.addEventListener('mouseout',function(e){
    if(yaSalio||e.relatedTarget||e.clientY>12)return;
    try{ if(!P)return; }catch(err){ return; }
    yaSalio=true;
    hojaAdios();
  });
})();

/* ═══════════ el tablero: losetas con grosor, visto desde arriba ═══════════ */
// Nada de esto son imágenes: se dibuja por código, así que no pesa ni depende
// de ningún servidor. El volumen es falso pero convincente: cada loseta lleva
// su cara de arriba y sus dos caras laterales, más oscuras.
var TW=32, TH=16, TD=13;          // media anchura, media altura, grosor
var COLX=[60,124,188,252];        // las cuatro columnas del serpenteo

// Dónde cae cada parada. Sube en zigzag: cuatro a la derecha, cuatro a la
// izquierda. Así el pulgar siempre alcanza y no se sale de la pantalla.
function celda(n,base){
  var k=n-base;
  var fila=Math.floor(k/4), col=k%4;
  if(fila%2===1)col=3-col;
  return {x:COLX[col], y:0-fila*64-(col*0)};
}
function posicion(n,base,alto){
  // cada parada sube 32 px: da la escalera diagonal, no filas planas.
  // La x va y viene entre cuatro columnas, así el camino serpentea.
  var k=n-base, fila=Math.floor(k/4), col=k%4;
  if(fila%2===1)col=3-col;
  return {x:COLX[col], y:alto-84-k*32};
}

function losetaSVG(cx,cy,arriba,izq,der,dentro,alzada){
  var d=alzada?8:0; cy-=d;
  return '<polygon points="'+(cx-TW)+','+cy+' '+cx+','+(cy-TH)+' '+(cx+TW)+','+cy+' '+cx+','+(cy+TH)+'" fill="'+arriba+'"/>'+
    '<polygon points="'+(cx-TW)+','+cy+' '+(cx-TW)+','+(cy+TD)+' '+cx+','+(cy+TH+TD)+' '+cx+','+(cy+TH)+'" fill="'+izq+'"/>'+
    '<polygon points="'+(cx+TW)+','+cy+' '+(cx+TW)+','+(cy+TD)+' '+cx+','+(cy+TH+TD)+' '+cx+','+(cy+TH)+'" fill="'+der+'"/>'+
    (dentro||'');
}
function palomita(cx,cy,alzada){
  var d=alzada?8:0;
  return '<path d="M'+(cx-8)+' '+(cy-d)+'l6 6 12-12" stroke="#EAF7F1" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>';
}
// la flecha de "esto ya lo viste": marca las casillas de repaso
function flechaRepaso(cx,cy,color){
  return '<path d="M'+(cx-7)+' '+(cy+1)+'a7 5.5 0 1 1 3 4.4" stroke="'+color+
    '" stroke-width="2.2" fill="none" stroke-linecap="round"/>'+
    '<path d="M'+(cx-10)+' '+(cy-3)+'l3 4 4-2.5" stroke="'+color+
    '" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>';
}
function numeroEn(cx,cy,n,color){
  return '<text x="'+cx+'" y="'+(cy+5)+'" text-anchor="middle" font-family="ui-monospace,monospace" font-size="12" fill="'+color+'">'+n+'</text>';
}

// El mismo muñeco, chiquito y en su propio marco: sirve de foto de perfil.
function munecoFoto(a,px){
  px=px||64;
  return '<svg viewBox="0 0 80 80" width="'+px+'" height="'+px+'" aria-hidden="true">'+
    '<circle cx="40" cy="40" r="39" fill="var(--crema)" stroke="var(--linea)"/>'+
    munecoSVG(40,72,a,0.98)+'</svg>';
}

// Los objetos del lugar. Son lo que hace que un tramo se sienta distinto del
// otro: la misma loseta rodeada de máquinas o rodeada de maletas no es igual.
function propSVG(tipo,cx,cy,a){
  function caja(x,y,w,arr,iz,de){
    return '<polygon points="'+(x-w)+','+y+' '+x+','+(y-w/2)+' '+(x+w)+','+y+' '+x+','+(y+w/2)+'" fill="'+arr+'"/>'+
      '<polygon points="'+(x-w)+','+y+' '+(x-w)+','+(y+w*0.6)+' '+x+','+(y+w/2+w*0.6)+' '+x+','+(y+w/2)+'" fill="'+iz+'"/>'+
      '<polygon points="'+(x+w)+','+y+' '+(x+w)+','+(y+w*0.6)+' '+x+','+(y+w/2+w*0.6)+' '+x+','+(y+w/2)+'" fill="'+de+'"/>';
  }
  if(tipo==='maquina')return caja(cx,cy,32,'#C0BCA9','#A19D8B','#918D7C')+caja(cx,cy-24,24,'#8E9A94','#75817B','#66726C');
  if(tipo==='banco')return caja(cx,cy,28,'#B6C2BD','#98A49F','#89959 0'.replace(' ',''))+
    '<rect x="'+(cx-14)+'" y="'+(cy-30)+'" width="28" height="10" rx="3" fill="#7E8A85"/>';
  if(tipo==='escritorio')return caja(cx,cy,30,'#DFC79E','#C0A87F','#B09870')+
    '<rect x="'+(cx-12)+'" y="'+(cy-34)+'" width="24" height="18" rx="3" fill="#9C7C4E"/>';
  if(tipo==='telefono')return caja(cx,cy,26,'#E0CDC2','#C1AEA3','#B29F94')+
    '<rect x="'+(cx-9)+'" y="'+(cy-30)+'" width="18" height="12" rx="4" fill="#993C1D"/>';
  if(tipo==='maleta')return caja(cx,cy,22,'#B9C9C5','#9AAAA6','#8B9B97')+
    '<rect x="'+(cx-10)+'" y="'+(cy-30)+'" width="20" height="16" rx="4" fill="#6F5716"/>'+
    '<rect x="'+(cx-4)+'" y="'+(cy-36)+'" width="8" height="7" rx="3" fill="#0A4636"/>';
  return '';
}

// El arco que separa un tramo del siguiente. Cruzarlo es el momento.
function arcoSVG(cx,cy,color){
  return '<polygon points="'+(cx-52)+','+cy+' '+cx+','+(cy-26)+' '+(cx+52)+','+cy+' '+cx+','+(cy+26)+'" fill="'+color+'" opacity=".28"/>'+
    '<rect x="'+(cx-30)+'" y="'+(cy-42)+'" width="9" height="34" rx="2" fill="'+color+'"/>'+
    '<rect x="'+(cx+21)+'" y="'+(cy-42)+'" width="9" height="34" rx="2" fill="'+color+'" opacity=".85"/>'+
    '<rect x="'+(cx-34)+'" y="'+(cy-50)+'" width="68" height="9" rx="3" fill="'+color+'"/>';
}

// Arma el tablero entero alrededor de donde va el alumno.
function tableroSVG(actual,total){
  var VENT=10;
  var base=Math.max(1,actual-3);
  var fin=Math.min(total,base+VENT-1);
  // el alto lo mandan las paradas que se ven: 32 px cada una, más aire
  // arriba para la loseta más lejana y abajo para la etiqueta del tramo
  var ALTO=(fin-base)*32+188;
  var h='<svg viewBox="0 0 340 '+ALTO+'" class="tab" role="img">'+
    '<title>Tu camino</title><desc>Casillas que suben en zigzag; tu muñeco está parado en la parada '+actual+'.</desc>';

  // el suelo de cada tramo, dibujado de lejos a cerca
  var vistos={};
  for(var n=fin;n>=base;n--){
    var t=idxTramo(n);
    if(vistos[t])continue;
    vistos[t]=1;
    var a=AMBIENTES[t];
    var p=posicion(n,base,ALTO);
    var cy=p.y;
    h+='<polygon points="170,'+(cy+150)+' 350,'+(cy+60)+' 350,'+(cy-60)+' 170,'+(cy-150)+' -10,'+(cy-60)+' -10,'+(cy+60)+'" fill="'+a.piso+'"/>'+
       '<polygon points="-10,'+(cy+60)+' 170,'+(cy+150)+' 170,'+(cy+166)+' -10,'+(cy+76)+'" fill="'+a.pisoIzq+'"/>'+
       '<polygon points="350,'+(cy+60)+' 170,'+(cy+150)+' 170,'+(cy+166)+' 350,'+(cy+76)+'" fill="'+a.pisoDer+'"/>';
  }

  // los objetos del lugar, a los lados del camino
  for(var n=fin;n>=base;n--){
    var a=ambienteDe(n), p=posicion(n,base,ALTO);
    if((n-base)%4===0 && p.x<180) h+=propSVG(a.props,308,p.y-30,a);
    if((n-base)%4===2 && p.x>170) h+=propSVG(a.props,26,p.y-10,a);
  }

  // los arcos entre tramos
  for(var n=base+1;n<=fin;n++){
    if(idxTramo(n)!==idxTramo(n-1)){
      var p=posicion(n,base,ALTO), a=ambienteDe(n);
      h+=arcoSVG(p.x,p.y+36,a.arco);
    }
  }

  // las losetas, de lejos a cerca para que se tapen bien
  for(var n=fin;n>=base;n--){
    var a=ambienteDe(n), p=posicion(n,base,ALTO);
    if(n<actual){
      var hecha=esRepaso(n)?['#C08A22','#9C7C4E','#8A6A3E']:['#C9A84C','#147A5A','#8A6E1F'];
      h+='<g class="lo" data-n="'+n+'">'+losetaSVG(p.x,p.y,hecha[0],hecha[1],hecha[2],palomita(p.x,p.y))+'</g>';
    }else if(n===actual){
      h+='<ellipse cx="'+p.x+'" cy="'+(p.y+18)+'" rx="30" ry="15" fill="#000" opacity=".10"/>';
      h+='<g class="lo aqui" id="losetaAqui" data-n="'+n+'">'+
         losetaSVG(p.x,p.y,esRepaso(n)?'#E8B24C':'#E2C169',esRepaso(n)?'#C08A22':'#C9A84C',esRepaso(n)?'#9C7C4E':'#147A5A',
           '<polygon points="'+(p.x-TW)+','+(p.y-8)+' '+p.x+','+(p.y-TH-8)+' '+(p.x+TW)+','+(p.y-8)+' '+p.x+','+(p.y+TH-8)+'" fill="none" stroke="#8A6E1F" stroke-width="2"/>',true)+
         '</g>';
    }else if(esRepaso(n)){
      h+='<g class="lo fut rep" data-n="'+n+'">'+
         losetaSVG(p.x,p.y,'#F0E2C4','#D6C6A4','#C6B694',flechaRepaso(p.x,p.y,'#9C7C4E'))+'</g>';
    }else{
      h+='<g class="lo fut" data-n="'+n+'">'+losetaSVG(p.x,p.y,a.loseta,a.lIzq,a.lDer,numeroEn(p.x,p.y,n,a.num))+'</g>';
    }
  }

  // el muñeco, encima de todo
  var pa=posicion(actual,base,ALTO);
  h+='<g id="muneco">'+munecoSVG(pa.x,pa.y-8,(progreso().avatar)||{})+'</g>';

  // el nombre del tramo, abajo
  var tr=tramoDe(actual), am=ambienteDe(actual);
  h+='<rect x="16" y="'+(ALTO-30)+'" width="'+(tr.nombre.length*7.4+26)+'" height="24" rx="12" fill="'+am.pill+'"/>'+
     '<text x="'+(tr.nombre.length*3.7+29)+'" y="'+(ALTO-14)+'" text-anchor="middle" font-family="ui-sans-serif,system-ui" font-size="12" fill="'+am.pillTx+'">'+esc(tr.nombre)+'</text>';
  h+='</svg>';
  return {svg:h, base:base, alto:ALTO};
}

// El salto de una loseta a la siguiente. Es lo que hace que avanzar se sienta.
function saltarA(deN,aN,base,alto,cuando){
  var d=posicion(deN,base,alto), a=posicion(aN,base,alto);
  var m=document.getElementById('muneco');
  var lo=document.getElementById('losetaAqui');
  if(!m){ if(cuando)cuando(); return; }
  var t0=Date.now(), DUR=520;
  (function paso(){
    var k=Math.min(1,(Date.now()-t0)/DUR);
    var x=d.x+(a.x-d.x)*k, y=d.y+(a.y-d.y)*k;
    var alto_salto=Math.sin(k*Math.PI)*34;      // la parábola del brinco
    m.setAttribute('transform','translate('+(x-d.x)+','+(y-d.y-alto_salto)+')');
    if(k<1)requestAnimationFrame(paso);
    else{
      m.setAttribute('transform','translate('+(a.x-d.x)+','+(a.y-d.y)+')');
      if(lo){ lo.classList.add('aterriza'); setTimeout(function(){lo.classList.remove('aterriza');},260); }
      if(cuando)cuando();
    }
  })();
}


/* ═══════════ los repasos, armados con lo que a él se le atora ═══════════ */
// Un repaso no es "volver a la parada 3". Es volver a lo que ESTE alumno
// falló, que no es lo mismo que falló su compañero.

function misErrores(){
  var mem=memoria(), out=[];
  Object.keys(mem).forEach(function(k){
    var m=mem[k];
    if(m.dominada)return;
    if(!(m.fallos>0))return;
    out.push({frase:m.frase, fallos:m.fallos, paso:m.paso||0});
  });
  // primero lo que más se le ha caído
  out.sort(function(a,b){return b.fallos-a.fallos||a.paso-b.paso;});
  return out;
}

// Los tipos de error que la IA le ha ido marcando en las sesiones
function tiposDeError(){
  var ses=(load().sesiones||[]).slice(-12), cuenta={};
  ses.forEach(function(r){
    (r.errores_ia||[]).forEach(function(e){
      var t=(e.tipo||e.error||'').toString().trim();
      if(t)cuenta[t]=(cuenta[t]||0)+1;
    });
  });
  return Object.keys(cuenta).map(function(t){return {tipo:t,veces:cuenta[t]};})
    .sort(function(a,b){return b.veces-a.veces;});
}

// Lo que ya corrigió no desaparece de golpe: pasa a vigilancia y vuelve
// UNA vez más, dos repasos después. Si vuelve a salir bien, ahí sí se va.
function retirarError(frase){
  var c=progreso();
  c.vigilancia=c.vigilancia||{};
  if(c.vigilancia[frase]==null){
    c.vigilancia[frase]={vuelve:(c.repasosHechos||0)+2, revisado:false};
  }else{
    c.vigilancia[frase].revisado=true;   // segunda vez limpia: se va
  }
  guardarProgreso(c);
}
function enVigilancia(){
  var c=progreso(), v=c.vigilancia||{}, n=(c.repasosHechos||0), out=[];
  Object.keys(v).forEach(function(f){
    if(!v[f].revisado && v[f].vuelve<=n) out.push(f);
  });
  return out;
}

// El material de una parada de repaso
function materialRepaso(){
  var errs=misErrores().slice(0,4);
  var vigilados=enVigilancia().slice(0,2);
  var items=[], usadas={};

  vigilados.forEach(function(f){
    if(usadas[f])return; usadas[f]=1;
    items.push({k:'model',en:f,es:'Esta se te atoraba. A ver cómo va ahora.',repaso:true,vigilada:true});
  });
  errs.forEach(function(e){
    if(usadas[e.frase])return; usadas[e.frase]=1;
    items.push({k:'model',en:e.frase,es:'Esta se te ha caído '+e.fallos+(e.fallos===1?' vez':' veces')+'.',repaso:true});
  });

  // si todavía no falla nada, se repasa lo más viejo que tenga
  if(!items.length){
    items=tocaHoy(4);
  }
  if(!items.length)return null;

  var tipos=tiposDeError().slice(0,2);
  return {
    titulo:'Parada de repaso',
    esRepaso:true,
    tipos:tipos,
    items:items.slice(0,5)
  };
}


// Un aviso chiquito que se va solo. Para cosas que no merecen pantalla.
function avisito(txt){
  if(!document.body||!document.body.appendChild)return;
  var v=document.getElementById('avisito');
  if(v&&v.remove)v.remove();
  var d=document.createElement('div');
  d.id='avisito'; d.className='avisito'; d.setAttribute('role','status');
  d.textContent=txt;
  document.body.appendChild(d);
  setTimeout(function(){ d.classList.add('fuera'); },2600);
  setTimeout(function(){ if(d.parentNode)d.remove(); },3200);
}

// Arranca una parada de repaso: se arma en el momento con sus errores
function arrancarRepaso(){
  var R=materialRepaso();
  if(!R){
    avisito('Todavía no tengo errores tuyos que repasar. Sigue con la parada normal.');
    var c0=progreso(); c0.parada=Math.min(c0.parada+1,PARADAS); guardarProgreso(c0); mapa();
    return;
  }
  var S={
    t:'Repaso', hoy:'repasamos lo que se te ha atorado',
    enc:'Esto no es material nuevo: son tus propias frases.',
    items:R.items, esRepaso:true, tipos:R.tipos
  };
  MAT=MAT.concat([S]);
  sIdx=MAT.length-1; it=0; attempts=[]; t0=Date.now();
  var c=progreso(); c.repasosHechos=(c.repasosHechos||0)+1; guardarProgreso(c);
  say('Esta parada es de repaso. Son tus frases, las que se te han atorado.','es-MX');
  correr();
}

// El orden: cómo se llama → su personaje → prueba de sonido → acento →
// las preguntas → la prueba de nivel. Cada quien retoma donde se quedó.
function seguirPersonalizacion(){
  // Fuera el monito y fuera la pregunta de "que tanto usas el celular":

function pintarTutor(){
  var v=document.getElementById('tutor');

    var o=document.querySelector(p.donde);
    if(o&&o.getBoundingClientRect){

    hoyo='<ellipse cx="'+cx+'" cy="'+cy+'" rx="'+rx+'" ry="'+ry+'" fill="black"/>';

  v.innerHTML=
    '<svg class="tutor-velo" width="'+ancho+'" height="'+alto+'" aria-hidden="true">'+
      '<defs><mask id="agujero">'+
        '<rect width="'+ancho+'" height="'+alto+'" fill="white"/>'+hoyo+
      '</mask></defs>'+
      '<rect width="'+ancho+'" height="'+alto+'" fill="rgba(16,14,12,.72)" mask="url(#agujero)"/>'+
      (r?'<ellipse cx="'+(r.x+r.w/2)+'" cy="'+(r.y+r.h/2)+'" '+
         'rx="'+(Math.max(r.w,44)/2+10)+'" ry="'+(Math.max(r.h,44)/2+10)+'" '+
         'fill="none" stroke="#E2C169" stroke-width="2.5" class="tutor-aro"/>':'')+
    '</svg>'+
    '<div class="tutor-globo" style="'+(abajo?'top:'+((r?r.y+r.h:alto*0.42)+26)+'px':'bottom:'+(alto-(r?r.y:alto*0.5)+26)+'px')+'">'+
      (r?'<span class="tutor-pico '+(abajo?'arriba':'abajo')+'" style="left:'+
         Math.max(22,Math.min(ancho-42,r.x+r.w/2-12))+'px"></span>':'')+
      '<div class="tutor-cuenta">'+(TUTOR_PASO+1)+' de '+pasos.length+'</div>'+
      '<div class="tutor-t">'+esc(p.titulo)+'</div>'+
      '<div class="tutor-x">'+esc(p.txt)+'</div>'+
      '<div class="tutor-bs">'+
        '<button class="tutor-b fant" id="tsalta">Saltar</button>'+
        '<button class="tutor-b" id="tsig">'+(TUTOR_PASO===pasos.length-1?'Listo':'Siguiente')+'</button>'+
      '</div>'+
    '</div>';

  var sg=document.getElementById('tsig');
  if(sg)sg.onclick=function(){ TUTOR_PASO++; pintarTutor(); };
  var sl=document.getElementById('tsalta');
  if(sl)sl.onclick=cerrarTutor;
  say(p.titulo+'. '+p.txt,'es-MX');
}

/* ═══════════ el botón de ayuda ═══════════ */
/* El alumno pregunta "¿qué hago hoy?" y el cerebro contesta Y LE SEÑALA
   el botón en la pantalla, con el mismo velo del tutorial. Que conteste
   no basta: si no se lo apunta, sigue igual de perdido. */

// Lo que el cerebro puede señalar. La llave es lo que el devuelve.
var COSAS_SENALABLES={
  mapa:      {sel:'[data-t="mapa"]',    que:'el botón del Mapa'},
  avance:    {sel:'[data-t="avance"]',  que:'el botón de Avance'},
  maestro:   {sel:'[data-t="maestro"]', que:'el botón del Maestro'},
  perfil:    {sel:'[data-t="perfil"]',  que:'el botón de Perfil'},
  mas:       {sel:'[data-t="mas"]',     que:'el botón de Más'},
  ayuda:     {sel:'#btnayuda',          que:'este mismo botón'},
  seguir:    {sel:'#seguir',            que:'el botón de seguir'},
  aqui:      {sel:'#losetaAqui',        que:'la casilla donde vas'}
};

var PREGUNTAS_FRECUENTES=[
  '¿Cuál es mi pendiente de hoy?',
  '¿Qué hago para avanzar de lección?',
  '¿Para qué sirve el botón del mapa?',
  '¿Dónde veo cuánto llevo?'
];

function abrirAyuda(){
  if(document.getElementById('ayhoja'))return cerrarAyuda();
  var d=document.createElement('div');
  d.className='ay-hoja'; d.id='ayhoja';
  d.innerHTML='<div class="ay-t">¿En qué te ayudo?</div>'+
    PREGUNTAS_FRECUENTES.map(function(q,i){
      return '<button class="ay-q" data-q="'+i+'">'+esc(q)+'</button>';
    }).join('')+
    '<div class="ay-campo">'+
      '<input id="aytxt" placeholder="O pregúntame otra cosa" autocomplete="off">'+
      '<button id="ayenv">Ir</button>'+
    '</div>';
  document.body.appendChild(d);

  d.querySelectorAll('.ay-q').forEach(function(b){
    b.onclick=function(){ preguntarAyuda(PREGUNTAS_FRECUENTES[+b.getAttribute('data-q')]); };
  });
  var env=document.getElementById('ayenv'), txt=document.getElementById('aytxt');
  function mandar(){ var v=(txt&&txt.value||'').trim(); if(v)preguntarAyuda(v); }
  if(env)env.onclick=mandar;
  if(txt)txt.onkeydown=function(e){ if(e.key==='Enter')mandar(); };
}

function cerrarAyuda(){
  var d=document.getElementById('ayhoja');
  if(d&&d.remove)d.remove();
}

function preguntarAyuda(q){
  var d=document.getElementById('ayhoja');
  if(d)d.innerHTML='<div class="ay-t">'+esc(q)+'</div><div class="ay-pens">Pensando…</div>';

  var c; try{ c=progreso(); }catch(e){ c={parada:1}; }
  var contexto={
    pregunta:q,
    nombre:(P&&P.nombre)||'',
    nivel:(P&&P.nivel)||'',
    parada:c.parada||1,
    total:PARADAS,
    pantalla:(document.getElementById('ayhoja')?'mapa':'otra'),
    botones:Object.keys(COSAS_SENALABLES).join(',')
  };

  pedirIA('ayuda',contexto,function(res){
    // el cerebro devuelve {respuesta, senala}
    var txt = (res&&res.respuesta) ? res.respuesta : null;
    var sen = (res&&res.senala) ? String(res.senala) : '';
    if(!txt) return ayudaDeRespaldo(q);
    mostrarAyuda(txt,sen);
  },function(){ ayudaDeRespaldo(q); });
}

/* Si el cerebro no contesta, el alumno NO se queda viendo un error.
   Estas respuestas viven en el teléfono y no necesitan internet. */
function ayudaDeRespaldo(q){
  var t=(q||'').toLowerCase(), c;
  try{ c=progreso(); }catch(e){ c={parada:1}; }
  if(t.indexOf('pendiente')>=0||t.indexOf('hoy')>=0)
    return mostrarAyuda('Hoy te toca la parada '+(c.parada||1)+' de '+PARADAS+
      '. Son unos 20 minutos. Ábrela desde el mapa.','aqui');
  if(t.indexOf('avanzar')>=0||t.indexOf('lecci')>=0)
    return mostrarAyuda('Termina los ejercicios de tu parada y brincas solo a la siguiente. '+
      'No hay que hacer nada más.','aqui');
  if(t.indexOf('avance')>=0||t.indexOf('llevo')>=0||t.indexOf('cuánto')>=0)
    return mostrarAyuda('En Avance ves cuánto llevas y qué frases se te atoran.','avance');
  if(t.indexOf('mapa')>=0)
    return mostrarAyuda('El mapa es tu camino. Cada casilla es una práctica corta.','mapa');
  if(t.indexOf('maestro')>=0||t.indexOf('profe')>=0)
    return mostrarAyuda('Por aquí le escribes a tu maestro. Contesta una persona.','maestro');
  return mostrarAyuda('Ahorita no me pude conectar. Lo que sigue es tu parada '+
    (c.parada||1)+': ábrela desde el mapa y son unos 20 minutos.','mapa');
}

function mostrarAyuda(txt,senal){
  cerrarAyuda();
  var cosa=COSAS_SENALABLES[senal];
  var sel=cosa?cosa.sel:null;
  // si lo que iba a señalar no está en pantalla, se contesta sin señalar
  if(sel&&!document.querySelector(sel))sel=null;
  velo(sel,'Te ayudo',txt);
  say(txt,'es-MX');
}

/* El velo: oscurece todo y deja un hoyo donde está la cosa. Es el mismo
   truco del tutorial, sacado aparte para que lo usen los dos. */
function velo(sel,titulo,txt,alCerrar){
  var viejo=document.getElementById('tutor');
  if(viejo&&viejo.remove)viejo.remove();

  var v=document.createElement('div');
  v.className='tutor'; v.id='tutor';
  document.body.appendChild(v);

  var r=null;
  if(sel){
    var o=document.querySelector(sel);
    if(o&&o.getBoundingClientRect){
      var b=o.getBoundingClientRect();
      if(b.width||b.height)r={x:b.left,y:b.top,w:b.width,h:b.height};
    }
  }
  var alto=(window.innerHeight||700), ancho=(window.innerWidth||380);
  var abajo = r ? (r.y+r.h/2 < alto*0.55) : true;

  var hoyo='';
  if(r){
    var cx=r.x+r.w/2, cy=r.y+r.h/2;
    var rx=Math.max(r.w,44)/2+10, ry=Math.max(r.h,44)/2+10;
    hoyo='<ellipse cx="'+cx+'" cy="'+cy+'" rx="'+rx+'" ry="'+ry+'" fill="black"/>';
  }

  v.innerHTML=
    '<svg class="tutor-velo" width="'+ancho+'" height="'+alto+'" aria-hidden="true">'+
      '<defs><mask id="agujeroay">'+
        '<rect width="'+ancho+'" height="'+alto+'" fill="white"/>'+hoyo+
      '</mask></defs>'+
      '<rect width="'+ancho+'" height="'+alto+'" fill="rgba(16,14,12,.72)" mask="url(#agujeroay)"/>'+
      (r?'<ellipse cx="'+(r.x+r.w/2)+'" cy="'+(r.y+r.h/2)+'" '+
         'rx="'+(Math.max(r.w,44)/2+10)+'" ry="'+(Math.max(r.h,44)/2+10)+'" '+
         'fill="none" stroke="#E2C169" stroke-width="2.5" class="tutor-aro"/>':'')+
    '</svg>'+
    '<div class="tutor-globo" style="'+
      (abajo?'top:'+((r?r.y+r.h:alto*0.42)+26)+'px':'bottom:'+(alto-(r?r.y:alto*0.5)+26)+'px')+'">'+
      (r?'<span class="tutor-pico '+(abajo?'arriba':'abajo')+'" style="left:'+
         Math.max(22,Math.min(ancho-42,r.x+r.w/2-12))+'px"></span>':'')+
      '<div class="tutor-t">'+esc(titulo)+'</div>'+
      '<div class="tutor-x">'+esc(txt)+'</div>'+
      '<div class="tutor-bs"><button class="tutor-b" id="veloya">Ya entendí</button></div>'+
    '</div>';

  var b2=document.getElementById('veloya');
  if(b2)b2.onclick=function(){
    callarTodo();
    if(v.remove)v.remove();
    alCerrar&&alCerrar();
  };
}

/* ═══════════ pantalla del mapa ═══════════ */
// El jefe entra directo a la lección de esa casilla.
// El despachador: intenta el 3D y si no, cae al de siempre.
function mapa(){
  pintarColorDelNivel();
  avisoDeVisita();
  mostrarAyudaSiToca('mapa');
  if(mapa3DoViejo())return;
  mapaViejo();
}

function irALeccionDe(n){
  soltarMapa();
  if(!MAT||!MAT.length){ avisito('No hay material cargado.'); return; }
  var idx=(contenidoDe(n)-1)%MAT.length;
  if(idx<0)idx=0;
  sIdx=idx; it=0; attempts=[]; vistos={}; t0=Date.now();
  try{ correr(); setTimeout(pintarBarraJefe,120); }
  catch(err){ avisito('Esa lección truena: '+String(err).slice(0,70)); }
}

// El alumno se ASOMA: ve el tema y una probadita de la gramática,
// pero el detalle completo solo aparece cuando de verdad llega ahí.
function asomarseALeccion(n,actual){
  // Si está de visita en otro nivel, lo que se enseña es el material de ESE
  // nivel, no el suyo. De eso se trata: ver qué vocabulario viene más
  // adelante aunque todavía no lo pueda practicar.
  var deVisita=!!VISITANDO;
  var mat=deVisita?MAT_VISITA:MAT;
  // Antes salía sin hacer nada si no había material, y el toque se sentía muerto.
  if(!mat||!mat.length){
    if(P){
      try{
        if(deVisita){ MAT_VISITA=materialDe(perfilDeNivel(VISITANDO)); mat=MAT_VISITA; }
        else { MAT=materialDe(P); mat=MAT; }
      }catch(e){}
    }
    if(!mat||!mat.length){
      var tr=(typeof tramoDe==='function')?tramoDe(n):null;
      avisito('Parada '+n+(tr?' · '+tr.nombre:'')+
        '. Cuéntame de ti y se abre.');
      return;
    }
  }
  var idx=(contenidoDe(n)-1)%mat.length;
  var S=mat[idx]; if(!S){ avisito('Parada '+n); return; }
  // De visita, ninguna parada esta "abierta": todas son de asomarse.
  var abierta=deVisita?false:(n<=actual);

  var items=S.items||[];
  var regla=null, palabras=[];
  items.forEach(function(x){
    if(!regla&&x.k==='regla'&&x.titulo)regla=x.titulo;
    if(x.k==='phrasal'&&x.en)palabras.push(x.en);
    if(x.k==='idiom'&&x.en)palabras.push(x.en);
  });

  var h='<div class="asom-caja">'+
    '<div class="asom-tag">Parada '+n+(abierta?'':' · todavía cerrada')+'</div>'+
    '<div class="asom-t">'+esc(S.t||'')+'</div>'+
    (S.obj?'<div class="asom-o">'+esc(S.obj)+'</div>':'')+
    '<div class="asom-b"><div class="asom-h">De qué va</div>'+
      '<div class="asom-i">'+esc(S.hoy||'practicar')+'</div></div>'+
    (regla?'<div class="asom-b"><div class="asom-h">La gramática que toca</div>'+
      '<div class="asom-i">'+esc(regla)+'</div></div>':'')+
    (palabras.length?'<div class="asom-b"><div class="asom-h">Palabras nuevas</div>'+
      '<div class="asom-i">'+esc(palabras.slice(0,3).join(' · '))+'</div></div>':'')+
    '<div class="asom-vela">'+
      (abierta
        ? 'Lo demás lo vas viendo dentro, ejercicio por ejercicio.'
        : 'El resto se abre cuando llegues aquí. Primero lo de antes.')+
    '</div>'+
    '<button class="btn'+(abierta?'':' ghost')+'" id="asomir">'+
      (n===actual?'Empezar esta':(abierta?'Ya la pasaste':'Aún no llegas'))+'</button>'+
    '<button class="btn ghost" id="asomcerrar" style="margin-top:8px">Cerrar</button>'+
  '</div>';

  var v=document.createElement('div');
  v.className='asom-velo'; v.id='asomvelo'; v.innerHTML=h;
  document.body.appendChild(v);
  v.onclick=function(e){ if(e.target===v)v.remove(); };
  var cerrar=document.getElementById('asomcerrar');
  if(cerrar)cerrar.onclick=function(){v.remove();};
  var ir=document.getElementById('asomir');
  if(ir)ir.onclick=function(){
    v.remove();
    if(deVisita){
      avisito('Esto es de '+VISITANDO+'. Por ahora solo para que veas qué viene.');
      return;
    }
    if(n===actual){ sIdx=idx; it=0; attempts=[]; vistos={}; t0=Date.now(); correr(); }
    else if(abierta)avisito('Ya la pasaste. Lo que se te atoró vuelve solo en una parada de repaso.');
    else avisito('Todavía no llegas aquí. Termina las de antes y se abre sola.');
  };
}
