# Genera la voz de todas las frases de la app en los servidores gratuitos de
# GitHub y la guarda en voz/. Se corre solo cuando cambian las frases, o a
# mano desde la pestaña Actions → "Voces de la app" → Run workflow.
name: Voces de la app

on:
  workflow_dispatch:
    inputs:
      motor:
        description: 'kokoro (la voz buena, gratis), chatterbox o google'
        required: true
        default: 'kokoro'
        type: choice
        options: [kokoro, chatterbox, google]
  push:
    paths: ['voces/frases.json']

permissions:
  contents: write

concurrency:
  group: voces-v2
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        parte: [0,1,2,3,4,5,6,7]
    env:
      MOTOR: ${{ github.event.inputs.motor || 'kokoro' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Herramientas
        timeout-minutes: 12
        run: |
          # apt a veces se cuelga en los servidores de GitHub: tres intentos de 3 min
          for i in 1 2 3; do
            sudo timeout 180 apt-get update -qq && sudo timeout 180 apt-get install -y -qq ffmpeg espeak-ng && break
            echo "apt tardó demasiado, otra vez ($i)"; sleep 5
          done
          command -v ffmpeg
      - name: Motor de voz
        timeout-minutes: 20
        run: |
          python -m pip install -q --upgrade pip
          if [ "$MOTOR" = "kokoro" ]; then
            pip install -q kokoro-onnx soundfile
            curl -sL -o kokoro-v1.0.int8.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.int8.onnx
            curl -sL -o voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
          elif [ "$MOTOR" = "google" ]; then
            pip install -q requests
          elif [ "$MOTOR" = "chatterbox" ]; then
            pip install -q --extra-index-url https://download.pytorch.org/whl/cpu chatterbox-tts
          else
            pip install -q --extra-index-url https://download.pytorch.org/whl/cpu "kokoro>=0.9.4" soundfile
          fi
      - name: Generar (parte ${{ matrix.parte }} de 8)
        run: python voces/generar.py "$MOTOR" ${{ matrix.parte }} 8 salida
      - uses: actions/upload-artifact@v4
        with:
          name: voz-${{ matrix.parte }}
          path: |
            salida/*.mp3
            salida/*.json
          if-no-files-found: ignore
          retention-days: 3

  dialogos:
    # audios de dos o más personas: Kokoro, una voz por persona
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Herramientas
        timeout-minutes: 12
        run: |
          for i in 1 2 3; do
            sudo timeout 180 apt-get update -qq && sudo timeout 180 apt-get install -y -qq ffmpeg && break
            echo "apt tardó demasiado, otra vez ($i)"; sleep 5
          done
          pip install -q kokoro-onnx soundfile
          curl -sL -o kokoro-v1.0.int8.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.int8.onnx
          curl -sL -o voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
      - name: Generar diálogos
        run: python voces/generar.py dialogos 0 1 salida
      - uses: actions/upload-artifact@v4
        with:
          name: voz-dialogos
          path: |
            salida/*.mp3
            salida/*.json
          if-no-files-found: ignore
          retention-days: 3

  guardar:
    needs: [generar, dialogos]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: nuevas
          pattern: voz-*
          merge-multiple: true
      - name: Juntar y armar la lista
        run: |
          mkdir -p voz
          cp nuevas/*.mp3 voz/ 2>/dev/null || true
          python - <<'EOF'
          import json, os, glob
          # las que ya tienen la voz de Kokoro (para no rehacerlas)
          p = 'voz/kokoro.json'
          ks = set(json.load(open(p))) if os.path.exists(p) else set()
          for q in glob.glob('nuevas/kokoro_nuevas_*.json'):
              ks |= set(json.load(open(q)))
          json.dump(sorted(ks), open(p, 'w'))
          fs = [f[:-4] for f in os.listdir('voz') if f.endswith('.mp3')]
          hs = sorted(f for f in fs if not f.endswith('-g'))
          gs = sorted(f[:-2] for f in fs if f.endswith('-g'))
          json.dump({'v': 1, 'h': hs, 'g': gs}, open('voz/lista.json', 'w'))
          print(len(hs), 'audios en voz/')
          EOF
      - name: Guardar en el repositorio
        run: |
          git config user.name  "voces-app"
          git config user.email "voces-app@users.noreply.github.com"
          git add voz
          git diff --cached --quiet && { echo "nada nuevo"; exit 0; }
          git commit -m "Voces de la app: $(ls voz/*.mp3 | wc -l) audios"
          git pull --rebase -q
          git push
